<!-- ================= HEBERGEMENT HORS CLAUDE : FIREBASE (GRATUIT) =================
     1. Va sur https://console.firebase.google.com, cree un projet gratuit (plan Spark, pas de CB requise).
     2. Dans "Parametres du projet" > onglet General, clique sur l'icone Web (</>) pour ajouter une "appli web".
     3. Firebase t'affiche un objet firebaseConfig : copie-colle-le ci-dessous a la place de FIREBASE_CONFIG_PLACEHOLDER.
     4. Va dans "Firestore Database" > "Creer une base de donnees" > "Demarrer en mode test" (gratuit),
        choisis une region proche (ex: eur3 - europe-west, Belgique).
     5. Recharge la page : tant que la config n'est pas remplie, l'appli continue d'utiliser le stockage
        fourni par Claude (comme actuellement) - rien ne casse en attendant que tu configures Firebase.
     Limite du mode test Firestore : les regles de securite sont ouvertes 30 jours puis se ferment.
     Pour un usage durable, il faudra ecrire des regles de securite adaptees avant le passage a l'echelle
     departementale - a voir ensemble le moment venu. -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>
const FIREBASE_CONFIG_PLACEHOLDER = {
  apiKey: "AIzaSyDVOSgUFv9ckodDSxviHAwj_UKVugOu6zE",
  authDomain: "inventaire-sdis80.firebaseapp.com",
  projectId: "inventaire-sdis80",
  storageBucket: "inventaire-sdis80.firebasestorage.app",
  messagingSenderId: "362097950697",
  appId: "1:362097950697:web:f0a1adc4bbfc9744ff1578"
};
(function(){
  if(FIREBASE_CONFIG_PLACEHOLDER.apiKey === "REMPLACER"){
    console.log("[Firebase] Config non renseignee -> l'appli utilise le stockage Claude (window.storage) par defaut.");
    return; // ne touche pas a window.storage : le stockage fourni par Claude reste actif
  }
  try{
    firebase.initializeApp(FIREBASE_CONFIG_PLACEHOLDER);
    const db = firebase.firestore();
    const SHARED_COLLECTION = 'sp_inventaire_shared';
    window.storage = {
      async get(key, shared){
        if(!shared){
          const v = localStorage.getItem('sp-local-'+key);
          return v!==null ? {key, value:v, shared:false} : null;
        }
        const doc = await db.collection(SHARED_COLLECTION).doc(key).get();
        if(!doc.exists) return null;
        return {key, value: doc.data().value, shared:true};
      },
      async set(key, value, shared){
        if(!shared){
          localStorage.setItem('sp-local-'+key, value);
          return {key, value, shared:false};
        }
        await db.collection(SHARED_COLLECTION).doc(key).set({value, updatedAt: Date.now()});
        return {key, value, shared:true};
      },
      async delete(key, shared){
        if(!shared){ localStorage.removeItem('sp-local-'+key); return {key, deleted:true, shared:false}; }
        await db.collection(SHARED_COLLECTION).doc(key).delete();
        return {key, deleted:true, shared:true};
      },
      async list(prefix, shared){
        if(!shared){
          const keys=[];
          for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k && k.indexOf('sp-local-'+(prefix||''))===0) keys.push(k.replace('sp-local-','')); }
          return {keys, prefix, shared:false};
        }
        const snap = await db.collection(SHARED_COLLECTION).get();
        const keys = snap.docs.map(d=>d.id).filter(k=>!prefix || k.indexOf(prefix)===0);
        return {keys, prefix, shared:true};
      }
    };
    console.log("[Firebase] Connecte : les donnees partagees sont maintenant synchronisees via Firestore, projet "+FIREBASE_CONFIG_PLACEHOLDER.projectId+".");
  }catch(e){
    console.error("[Firebase] Erreur d'initialisation, retour au stockage Claude par defaut :", e);
  }
})();
</script>

<style>

:root{

body{margin:0;font-family:var(--font-body);background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;}

.topbar .brand{display:flex;align-items:center;gap:12px;}
.brand .mark{width:36px;height:36px;background:var(--red);display:flex;align-items:center;justify-content:center;font-family:var(--font-head);font-weight:700;font-size:14px;flex-shrink:0;}
.brand h1{font-family:var(--font-head);font-weight:600;font-size:18px;letter-spacing:.4px;margin:0;text-transform:uppercase;}
.brand .sub{font-size:11px;color:#9fb3c4;font-family:var(--font-mono);margin-top:2px;}
.topbar .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.checker-pill{font-size:13.5px;font-weight:700;color:#fff;font-family:var(--font-body);background:var(--steel);padding:9px 14px;border-radius:20px;border:2px solid rgba(255,255,255,.35);cursor:pointer;}
.checker-pill:hover{background:#5a80a3;}
.checker-pill.empty{background:var(--red);border-color:#fff;animation:pillPulse 1.6s infinite;}
.sync-status{font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:14px;color:#fff;white-space:nowrap;}
.sync-status.ok{background:rgba(255,255,255,.12);}
.sync-status.saving{background:rgba(255,255,255,.12);opacity:.7;}

.fab-close:hover{background:var(--green-dark);}
/* Menu deroulant reutilisable : boutons affiches en ligne sur desktop, repliés sous "..." sur mobile — sans JS supplémentaire. */

.actions-dropdown>.dropdown-toggle{display:none;}
.actions-dropdown .dropdown-panel{display:contents;}
@media (max-width:700px){
  .actions-dropdown{display:inline-block;position:relative;}
  .actions-dropdown>.dropdown-toggle{display:inline-flex;align-items:center;gap:4px;cursor:pointer;background:var(--navy-3);color:#fff;border:none;padding:8px 14px;border-radius:20px;font-size:12.5px;font-weight:600;font-family:inherit;}

  .actions-dropdown .dropdown-panel{display:none;flex-direction:column;gap:6px;position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.2);padding:10px;min-width:210px;z-index:70;}

}

/* Voice mode */
.voice-overlay{position:fixed;inset:0;background:var(--navy);color:#fff;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;}

.tech-field input,.tech-field select{width:100%;padding:8px 9px;border:1px solid var(--line);border-radius:3px;font-size:13px;}
.tech-check-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin-top:10px;}
.tech-check-item{font-size:12.5px;display:flex;gap:7px;align-items:center;}
.tech-slider{display:flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:12px;}
.tech-slider input[type=range]{flex:1;}
.tech-textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:3px;font-size:13px;font-family:var(--font-body);min-height:70px;resize:vertical;}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(15,34,55,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:18px;}
.modal{background:#fff;width:100%;max-width:440px;padding:22px;border-radius:4px;max-height:85vh;overflow-y:auto;}
.modal.wide{max-width:600px;}
.modal h3{font-family:var(--font-head);font-size:17px;color:var(--navy);margin:0 0 14px;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin-bottom:4px;}
.field input,.field select{width:100%;padding:8px 9px;border:1px solid var(--line);border-radius:3px;font-size:13px;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}
.qr-box{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 0;}
.qr-url{font-family:var(--font-mono);font-size:10px;color:var(--muted);word-break:break-all;text-align:center;}
.import-drop{border:2px dashed var(--line);border-radius:4px;padding:24px;text-align:center;color:var(--muted);font-size:12.5px;}

.loading-note{text-align:center;color:var(--muted);font-size:12px;padding:20px;}
@media print{
  details{display:block !important;}
  details:not([open]) > *:not(summary){display:block !important;}
  .topbar,.detail-actions,.card-actions,.mode-tabs,.back-link,.btn,
  .check-lock-btn,.comment-btn,.reorder-col,.del-btn,.field-inline,input,select,.gauge-row,.summary-strip,
  #expandAllBtn,#collapseAllBtn,.dash-header button{display:none !important;}
  .check-status-btn:not(.active),.status-btn:not(.active){display:none !important;}
  body{background:#fff;color:#000;}
  .emp-block,.card{border:1px solid #ccc !important;box-shadow:none !important;break-inside:avoid;}
}
@media (max-width:700px){
  .article-row{grid-template-columns:22px 1fr;}
  .status-buttons,.qty-col{grid-column:2;}
  .summary-strip{grid-template-columns:repeat(2,1fr);}
}
</style>

function ensureVehicleShape(v){
  if(!v.techCheck) v.techCheck=defaultTechCheck();
  if(!v.techCheck.carrosseriePhotos) v.techCheck.carrosseriePhotos=[];
  if(!v.checkFrequency) v.checkFrequency='hebdomadaire';
  if(v.checkWeekday===undefined) v.checkWeekday=0; // 0=Lundi par défaut
  if(v.techCheckFrequency===undefined) v.techCheckFrequency='hebdomadaire';
  if(v.techCheckWeekday===undefined) v.techCheckWeekday=0;
  if(v.techCheckMonthlyOccurrence===undefined) v.techCheckMonthlyOccurrence='first';
  if(v.techCheckMonthlyWeekday===undefined) v.techCheckMonthlyWeekday=0;
  if(v.fuelMinThreshold===undefined) v.fuelMinThreshold=75;
  if(v.adblueMinThreshold===undefined) v.adblueMinThreshold=10;
  if(v.hasAdblue===undefined) v.hasAdblue=true;
  if(v.hasEngine===undefined) v.hasEngine=true;
  if(!v.checkHistory) v.checkHistory=[];
  if(!v.currentCis) v.currentCis=v.cis||''; // centre qui gère l'engin au quotidien (par défaut : le centre de rattachement)
  if(!v.loanHistory) v.loanHistory=[];
  if(v.outOfService===undefined) v.outOfService=false;
  if(v.outOfServiceInfo===undefined) v.outOfServiceInfo=null;
  if(!v.breakdownHistory) v.breakdownHistory=[];
  (v.emplacements||[]).forEach(e=>{(e.articles||[]).forEach(a=>{
    migrateComment(a);
    if(a.qtyMissing===undefined)a.qtyMissing=0;
    if(a.photos===undefined)a.photos=[];
    if(a.volumeL===undefined)a.volumeL='';
    if(a.pressureBar===undefined)a.pressureBar='';
    if(a.isContainer===undefined) a.isContainer=!!(a.sousArticles&&a.sousArticles.length);
    if(a.wrongLocation===undefined) a.wrongLocation=false;
    (a.sousArticles||[]).forEach(s=>{migrateComment(s);if(s.qtyMissing===undefined)s.qtyMissing=0;if(s.wrongLocation===undefined)s.wrongLocation=false;});
  });});
  return v;
}
function migrateComment(obj){
  // Ancien format : un seul texte concaténé avec " — ". Nouveau format : liste de commentaires,
  // chacun effaçable individuellement. On convertit une fois, sans perdre l'historique existant.
  if(obj.comments===undefined){
    obj.comments=[];
    if(obj.comment){
      String(obj.comment).split(' — ').forEach(txt=>{ if(txt.trim()) obj.comments.push({id:uid('cm'),text:txt.trim(),date:''}); });
    }
  }
}
function addComment(obj,text){
  if(!obj.comments) obj.comments=[];
  if(text && text.trim()) obj.comments.push({id:uid('cm'),text:text.trim(),date:todayStr()});
}
function commentsTooltip(obj){ return (obj.comments||[]).map(c=>c.text).join(' — '); }

  ).join('')+`</div>`;
}

/* ---------- Protection admin (verrou sur la configuration) ---------- */
let adminUnlocked=false; // reinitialisé a chaque chargement de page, jamais persiste
async function sha256Hex(text){
  const enc=new TextEncoder().encode(text);
  const buf=await crypto.subtle.digest('SHA-256',enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function requireAdmin(cb){
  if(adminUnlocked || !state.adminPasswordHash){ cb(); return; }
  openAdminUnlockModal(cb);
}
function openAdminUnlockModal(cb){
  const overlay=document.createElement('div'); overlay.className='overlay';
  overlay.innerHTML=`<div class="modal"><h3>🔒 Configuration protégée</h3>
    <p style="font-size:12.5px;color:var(--muted);">Un mot de passe administrateur est requis pour accéder à la configuration.</p>
    <div class="field"><label>Mot de passe</label><input type="password" id="adminPwInput"></div>
    <p id="adminPwError" style="color:var(--red-dark);font-size:12px;display:none;">Mot de passe incorrect.</p>
    <div class="modal-actions"><button class="btn ghost" id="adminPwCancel">Annuler</button><button class="btn primary" id="adminPwOk">Déverrouiller</button></div></div>`;
  document.body.appendChild(overlay);
  const inp=document.getElementById('adminPwInput');
  setTimeout(()=>inp.focus(),50);
  overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.remove();});
  document.getElementById('adminPwCancel').addEventListener('click',()=>overlay.remove());
  const submit=async()=>{
    const h=await sha256Hex(inp.value);
    if(h===state.adminPasswordHash){ adminUnlocked=true; overlay.remove(); cb(); }
    else{ document.getElementById('adminPwError').style.display='block'; inp.value=''; inp.focus(); }
  };
  document.getElementById('adminPwOk').addEventListener('click',submit);
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();submit();}});
}
function openAdminSettingsModal(){
  const hasPw=!!state.adminPasswordHash;
  const overlay=document.createElement('div'); overlay.className='overlay';
  overlay.innerHTML=`<div class="modal"><h3>🔒 Sécurité</h3>
    <p style="font-size:12.5px;color:var(--muted);">${hasPw?'La configuration (véhicules, emplacements, réserves...) est protégée par mot de passe.':'Aucun mot de passe défini — la configuration est libre pour tout le monde.'}</p>
    <p style="font-size:11px;color:var(--muted);">Attention : ce mot de passe protège contre les erreurs de manipulation, pas contre une personne cherchant vraiment à le contourner (le code est visible dans le navigateur). Pour une vraie sécurité sur la version serveur, il faudra aussi restreindre les règles Firestore.</p>
    ${hasPw?`<div class="field"><label>Mot de passe actuel</label><input type="password" id="curPw"></div>`:''}
    <div class="field"><label>${hasPw?'Nouveau mot de passe (laisser vide pour retirer la protection)':'Définir un mot de passe'}</label><input type="password" id="newPw"></div>
    <div class="modal-actions">
      ${adminUnlocked?'<button class="btn ghost" id="lockNowBtn">Verrouiller maintenant</button>':''}
      <button class="btn ghost" id="secClose">Fermer</button>
      <button class="btn primary" id="secSave">Enregistrer</button>
    </div></div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.remove();});
  document.getElementById('secClose').addEventListener('click',()=>overlay.remove());
  const lockBtn=document.getElementById('lockNowBtn');
  if(lockBtn) lockBtn.addEventListener('click',()=>{ adminUnlocked=false; overlay.remove(); alert('Configuration verrouillée.'); });
  document.getElementById('secSave').addEventListener('click',async()=>{
    if(hasPw){
      const cur=document.getElementById('curPw').value;
      const curHash=await sha256Hex(cur);
      if(curHash!==state.adminPasswordHash){ alert('Mot de passe actuel incorrect.'); return; }
    }
    const newPw=document.getElementById('newPw').value;
    state.adminPasswordHash = newPw ? await sha256Hex(newPw) : '';
    await saveState(); overlay.remove();
    alert(newPw?'Mot de passe enregistré.':'Protection retirée — la configuration est de nouveau libre.');
  });
}
async function importSeedCatalogue(){
  if(!confirm('Importer le catalogue de matériel construit à partir de tes inventaires véhicules (FPT, VSAV, VSRS, CCRM, EA25) ?\n\nLes références déjà présentes dans les réserves (même nom, même catégorie) ne seront pas dupliquées. Les quantités seront ajoutées à 0 (à toi de renseigner le stock réel) — pense à corriger la catégorie d\'une ligne si elle ne te semble pas correcte, via le menu déroulant sur chaque ligne.')) return;
  let added=0, skipped=0;
  Object.keys(RESERVE_SEED_CATALOGUE).forEach(cat=>{
    if(!state.reserves[cat]) state.reserves[cat]=[];
    RESERVE_SEED_CATALOGUE[cat].forEach(seedItem=>{
      const cleanName=seedItem.name.replace(/^\d+\.\s*/,'').trim(); // retire les préfixes du type "01. "
      const nk=normalizeTxt(cleanName);
      const exists=state.reserves[cat].some(it=>normalizeTxt(it.name)===nk);
      if(exists){ skipped++; return; }
      state.reserves[cat].push({
        id:uid('r'), name:cleanName, qty:0, qtyMin:1, expiry:'', comments:[{id:uid('cm'),text:'Importé depuis les inventaires véhicules',date:todayStr()}],
        numero:seedItem.numero||'', volumeL:seedItem.volumeL||'', pressureBar:seedItem.pressureBar||''
      });
      added++;
    });
  });
  await saveState(); render();
  alert(added+' référence(s) ajoutée(s), '+skipped+' déjà présente(s) ignorée(s).');
}

async function loadState(){
  try{
    const res=await window.storage.get(STORAGE_KEY,true);
    if(res&&res.value){state=JSON.parse(res.value);}else{state=defaultData();await saveState();}
  }catch(e){state=defaultData();await saveState();}
  state.vehicles.forEach(ensureVehicleShape);
  ensureReservesShape();
  if(state.centres.length===0){
    const found=new Set();
    state.vehicles.forEach(v=>{ if(v.cis) found.add(v.cis); });
    state.centres=Array.from(found);
  }
  try{

      try{ const parsed=JSON.parse(c.value); checkerNames=Array.isArray(parsed)?parsed:[String(parsed)]; }
      catch(e2){ checkerNames=c.value.trim()?[c.value.trim()]:[]; await saveCheckers(); } // ancien format (simple texte) -> on le convertit et on le réécrit
    } else checkerNames=[];
  }catch(e){checkerNames=[];}
  updateCheckerPill();
  try{
    const mc=await window.storage.get(MY_CENTRE_KEY,false);
    myCentre=mc&&mc.value?mc.value:'';

  render();
}
let syncStatus='ok'; // 'ok' | 'saving' | 'error'
let syncRetryTimer=null;
function updateSyncIndicator(){
  const el=document.getElementById('syncStatus'); if(!el)return;
  if(syncStatus==='saving'){ el.textContent='💾 Enregistrement…'; el.className='sync-status saving'; }
  else if(syncStatus==='error'){ el.textContent='⚠ Non synchronisé — nouvelle tentative…'; el.className='sync-status error'; }
  else { el.textContent='💾 Enregistré'; el.className='sync-status ok'; }
}
async function saveState(){
  syncStatus='saving'; updateSyncIndicator();
  try{
    await window.storage.set(STORAGE_KEY,JSON.stringify(state),true);
    syncStatus='ok'; updateSyncIndicator();
    if(syncRetryTimer){ clearTimeout(syncRetryTimer); syncRetryTimer=null; }
  }catch(e){
    console.error(e);
    syncStatus='error'; updateSyncIndicator();
    // Nouvelle tentative automatique tant que l'erreur persiste — la dernière version de "state" en
    // mémoire est toujours renvoyée, donc rien n'est perdu tant que l'onglet reste ouvert.
    if(!syncRetryTimer){ syncRetryTimer=setTimeout(()=>{ syncRetryTimer=null; saveState(); },5000); }
  }
}

/* ---------- Stats ---------- */
function leafStatus(article){return article.locked?'ok':article.status;}
function isContainerArt(a){
  // Décidé indépendamment du contenu du tableau sousArticles : décocher "conteneur" ne doit
  // JAMAIS effacer les sous-articles existants, juste changer la façon dont l'article est traité/affiché.
  return a.isContainer!==undefined ? a.isContainer : !!(a.sousArticles && a.sousArticles.length);
}
function articleAllStatuses(article){
  if(isContainerArt(article) && article.sousArticles && article.sousArticles.length){
    if(article.locked) return article.sousArticles.map(()=>'ok');
    return article.sousArticles.map(s=>s.status);
  }
  return [leafStatus(article)];
}
function isSoonOrOverdue(dateStr){ // returns 'overdue' | 'soon' | null
  if(!dateStr) return null;
  const d=daysUntil(dateStr);
  if(d<0) return 'overdue';
  if(d<30) return 'soon';
  return null;
}
function empStats(emp){
  let total=0,ok=0,verifier=0,manquant=0,perime=0,hs=0,soon=0,overdue=0;
  emp.articles.forEach(a=>{
    const statuses=articleAllStatuses(a);
    statuses.forEach(s=>{total++;if(s==='ok')ok++;else if(s==='verifier')verifier++;else if(s==='manquant')manquant++;else if(s==='perime')perime++;else if(s==='hs')hs++;});
    const r1=isSoonOrOverdue(a.regDueDate); if(r1==='soon')soon++; else if(r1==='overdue')overdue++;
    const r2=isSoonOrOverdue(a.expiry); if(r2==='soon')soon++; else if(r2==='overdue')overdue++;
    (a.sousArticles||[]).forEach(s=>{const r3=isSoonOrOverdue(s.expiry); if(r3==='soon')soon++; else if(r3==='overdue')overdue++;});
  });
  const pct=total?Math.round((ok/total)*100):100;
  let overall='ok'; if(manquant||perime||hs)overall='bad'; else if(verifier)overall='warn';
  return {total,ok,verifier,manquant,perime,hs,pct,overall,soon,overdue};
}
function vehicleStats(v){
  let total=0,ok=0,verifier=0,manquant=0,perime=0,hs=0,soon=0,overdue=0;
  v.emplacements.forEach(e=>{const s=empStats(e);total+=s.total;ok+=s.ok;verifier+=s.verifier;manquant+=s.manquant;perime+=s.perime;hs+=s.hs;soon+=s.soon;overdue+=s.overdue;});
  const pct=total?Math.round((ok/total)*100):100;
  let overall='ok'; if(manquant||perime||hs)overall='bad'; else if(verifier)overall='warn';
  return {total,ok,verifier,manquant,perime,hs,pct,overall,soon,overdue};
}
function gaugeColor(pct){if(pct>=90)return'var(--green)';if(pct>=60)return'var(--amber)';return'var(--red)';}
function vehicleGasTotals(v){
  let o2=0,hasO2=false,ari=0,hasAri=false;
  v.emplacements.forEach(e=>e.articles.forEach(a=>{
    if(a.regType==='O2'){ hasO2=true; if(a.volumeL&&a.pressureBar) o2+=parseFloat(a.volumeL)*parseFloat(a.pressureBar)*(a.qty||1); }
    if(a.regType==='ARI'){ hasAri=true; if(a.volumeL&&a.pressureBar) ari+=parseFloat(a.volumeL)*parseFloat(a.pressureBar)*(a.qty||1); }
  }));
  return {o2:hasO2?Math.round(o2):null, ari:hasAri?Math.round(ari):null};
}

const APP_VERSION='1.11.0'; // à incrémenter à chaque modification livrée
const WEEKDAY_LABELS=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
function weekdayIndex(dateStr){ const d=new Date(dateStr); return (d.getDay()+6)%7; } // 0=Lundi ... 6=Dimanche
function mondayOfWeek(dateStr){
  const d=new Date(dateStr);
  const idx=(d.getDay()+6)%7; // 0=Lundi
  d.setDate(d.getDate()-idx);
  return d.toISOString().slice(0,10);
}
function checkDueInfo(v){
  const hist=v.checkHistory||[];
  const last=hist.length?hist[hist.length-1]:null;
  const freq=v.checkFrequency||'hebdomadaire';
  const today=todayStr();
  if(freq==='quotidien'){
    if(!last) return {due:true,label:'Jamais vérifié',lastDate:null};
    const days=Math.floor((new Date(today)-new Date(last.date))/(1000*60*60*24));
    return {due:days>=1,label: days<=0?'Vérifié aujourd\'hui':days+' jour(s) depuis la dernière vérif.',lastDate:last.date};
  }
  // Hebdomadaire : due si aucune vérification n'a eu lieu CETTE semaine (lundi-dimanche) ET que le jour
  // programmé est déjà arrivé (pas de rappel avant le jour prévu).
  const monday=mondayOfWeek(today);
  const doneThisWeek=hist.filter(h=>h.date>=monday).sort((a,b)=>a.date<b.date?1:-1)[0];
  const scheduledIdx=v.checkWeekday!==undefined?v.checkWeekday:0; // défaut lundi
  const todayIdx=weekdayIndex(today);
  if(doneThisWeek){
    return {due:false,label:'Vérifié cette semaine ('+fmtDate(doneThisWeek.date)+')',lastDate:doneThisWeek.date};
  }
  if(todayIdx>=scheduledIdx){
    return {due:true,label: last?('Non fait cette semaine — prévu '+WEEKDAY_LABELS[scheduledIdx]):'Jamais vérifié',lastDate:last?last.date:null};
  }
  return {due:false,label:'À faire '+WEEKDAY_LABELS[scheduledIdx]+' cette semaine',lastDate:last?last.date:null};
}

      <div style="position:absolute;top:0;left:0;height:100%;width:${value}%;background:${fillColor};transition:width .2s;"></div>

function wrongLocationCount(v){

  v.emplacements.forEach(e=>e.articles.forEach(a=>{

    (a.sousArticles||[]).forEach(s=>{if(s.wrongLocation)n++;});

function techCheckAnomalies(v){
  if(v.hasEngine===false) return [];
  const t=v.techCheck; if(!t || !t.lastCheck) return [];
  const labels=[];
  if(!t.huileOk) labels.push('Niveau d\'huile');
  if(!t.liquideOk) labels.push('Liquide de refroidissement');
  if(!t.laveGlaceOk) labels.push('Lave-glace');
  if(v.hasAdblue!==false && !t.adblueOk) labels.push('AdBlue (voyant)');
  if(!t.essuieGlacesOk) labels.push('Essuie-glaces');
  if(!t.pareBriseOk) labels.push('Pare-brise');
  if(!t.retroOk) labels.push('Rétroviseurs');
  if(t.sig){
    if(!t.sig.lumineux) labels.push('Avertisseur lumineux');
    if(!t.sig.sonore) labels.push('Avertisseur sonore');
    if(!t.sig.croisement) labels.push('Feux de croisement');
    if(!t.sig.route) labels.push('Feux de route');
    if(!t.sig.brouillard) labels.push('Feux de brouillard');
    if(!t.sig.stop) labels.push('Feux STOP');
  }
  const today=todayStr();
  if(t.carburant<(v.fuelMinThreshold!==undefined?v.fuelMinThreshold:75)) labels.push('Carburant bas ('+t.carburant+'%)');
  if(v.hasAdblue!==false && t.adblue<(v.adblueMinThreshold!==undefined?v.adblueMinThreshold:10)) labels.push('AdBlue bas ('+t.adblue+'%)');
  if(t.ctDate && t.ctDate<today) labels.push('Contrôle technique dépassé');
  if(t.vidangeDate && t.vidangeDate<today) labels.push('Vidange/entretien dépassé');
  return labels;
}
function techOverallOk(v){
  return v.techCheck && v.techCheck.lastCheck && techCheckAnomalies(v).length===0;
}
function techDueInfo(v){
  if(v.hasEngine===false) return {due:false,label:'Non motorisé — pas de vérification engin',lastDate:null};
  const t=v.techCheck||{};
  const freq=v.techCheckFrequency||'hebdomadaire';
  const last=t.lastCheck;
  const today=todayStr();
  if(freq==='mensuel'){
    const occ=v.techCheckMonthlyOccurrence!==undefined?v.techCheckMonthlyOccurrence:'first';
    const wd=v.techCheckMonthlyWeekday!==undefined?v.techCheckMonthlyWeekday:0;
    const targetDate=monthlyOccurrenceDate(today,occ,wd); // date prévue ce mois-ci (AAAA-MM-JJ)
    if(today<targetDate){
      return {due:false,label:'Prévu le '+fmtDate(targetDate)+' ('+MONTHLY_OCC_LABELS[occ]+' '+WEEKDAY_LABELS[wd]+' du mois)',lastDate:last||null};
    }
    // La date prévue de ce mois est passée ou aujourd'hui : due si pas encore fait depuis cette date.
    const doneSince=last && last>=targetDate;
    if(doneSince) return {due:false,label:'Vérifié le '+fmtDate(last),lastDate:last};
    return {due:true,label: last?('Non fait depuis le '+fmtDate(targetDate)):'Jamais vérifié',lastDate:last||null};
  }
  // Hebdomadaire : due si aucune vérification n'a eu lieu cette semaine ET que le jour programmé est arrivé.
  const monday=mondayOfWeek(today);
  const scheduledIdx=v.techCheckWeekday!==undefined?v.techCheckWeekday:0;
  const todayIdx=weekdayIndex(today);
  const doneThisWeek=last && last>=monday;
  if(doneThisWeek) return {due:false,label:'Vérifié cette semaine ('+fmtDate(last)+')',lastDate:last};
  if(todayIdx>=scheduledIdx) return {due:true,label: last?('Non fait cette semaine — prévu '+WEEKDAY_LABELS[scheduledIdx]):'Jamais vérifié',lastDate:last||null};
  return {due:false,label:'À faire '+WEEKDAY_LABELS[scheduledIdx]+' cette semaine',lastDate:last||null};
}
const MONTHLY_OCC_LABELS={first:'1er',second:'2e',third:'3e',fourth:'4e',last:'dernier'};
function monthlyOccurrenceDate(refDateStr,occurrence,weekday){
  // Renvoie la date (AAAA-MM-JJ) du N-ième [jour de semaine] du mois de refDateStr. weekday: 0=Lundi..6=Dimanche.
  const ref=new Date(refDateStr+'T00:00:00');
  const year=ref.getFullYear(), month=ref.getMonth();
  if(occurrence==='last'){
    const lastOfMonth=new Date(year,month+1,0);
    let d=new Date(lastOfMonth);
    while((d.getDay()+6)%7!==weekday) d.setDate(d.getDate()-1);
    return d.toISOString().slice(0,10);
  }
  const occIdx={first:0,second:1,third:2,fourth:3}[occurrence]||0;
  let d=new Date(year,month,1);
  while((d.getDay()+6)%7!==weekday) d.setDate(d.getDate()+1);
  d.setDate(d.getDate()+occIdx*7);
  return d.toISOString().slice(0,10);
}
function buildWeeklyAlerts(){
  const today=todayStr();
  const monday=mondayOfWeek(today);
  const prevMonday=new Date(monday+'T00:00:00'); prevMonday.setDate(prevMonday.getDate()-7);
  const prevMondayStr=prevMonday.toISOString().slice(0,10);
  const todayIdx=weekdayIndex(today); // 0=Lundi
  const alerts=[]; // {vehicleId, vehicleName, type, label, severity:'overdue'|'upcoming'}
  const pushed=new Set();
  const push=a=>{ const k=a.vehicleId+':'+a.type; if(pushed.has(k))return; pushed.add(k); alerts.push(a); };
  state.vehicles.forEach(v=>{
    // Un engin prêté à un autre centre ou actuellement en panne n'a pas besoin d'être rappelé
    // à la vérification — il n'est simplement pas disponible pour ça.
    if(v.outOfService || (v.currentCis && v.currentCis!==v.cis)) return;
    const due=checkDueInfo(v);
    if(v.checkFrequency!=='quotidien'){
      if(due.due) push({vehicleId:v.id,vehicleName:v.name,type:'Vérification matériel',label:due.label,severity:'overdue'});
      else if(due.label.startsWith('À faire')) push({vehicleId:v.id,vehicleName:v.name,type:'Vérification matériel',label:due.label,severity:'upcoming'});
    }
    // Filet de sécurité indépendant du jour programmé : si aucune vérification matériel n'a eu lieu
    // du tout cette semaine, on le signale à partir de mardi — sauf si la semaine précédente était
    // déjà manquée aussi, auquel cas on le signale sans attendre (c'est déjà en retard).
    const hist=v.checkHistory||[];
    const doneThisWeek=hist.some(h=>h.date>=monday);
    if(!doneThisWeek){
      const doneLastWeek=hist.some(h=>h.date>=prevMondayStr && h.date<monday);
      if(todayIdx>=1 || !doneLastWeek){
        push({vehicleId:v.id,vehicleName:v.name,type:'Vérification matériel',label:'Jamais vérifié cette semaine',severity:'overdue'});
      }
    }
    const tdue=techDueInfo(v);
    if(tdue.due) push({vehicleId:v.id,vehicleName:v.name,type:'Vérification engin',label:tdue.label,severity:'overdue'});
    else if(tdue.label.startsWith('À faire')||tdue.label.startsWith('Prévu')) push({vehicleId:v.id,vehicleName:v.name,type:'Vérification engin',label:tdue.label,severity:'upcoming'});
  });
  return alerts;
}
function buildMaintenanceAlerts(){
  // Contrôle technique / entretien : fenêtre de rappel de 30 jours (pas limitée à la semaine en cours).
  const today=todayStr();
  const horizon=new Date(today); horizon.setDate(horizon.getDate()+30);
  const horizonStr=horizon.toISOString().slice(0,10);
  const alerts=[];
  state.vehicles.forEach(v=>{
    if(v.outOfService || (v.currentCis && v.currentCis!==v.cis)) return;
    const t=v.techCheck;
    if(!t) return;
    [['ctDate','Contrôle technique'],['vidangeDate','Vidange / entretien']].forEach(([field,label])=>{
      const d=t[field];
      if(!d) return;
      if(d<today) alerts.push({vehicleId:v.id,vehicleName:v.name,type:label,label:'Dépassé depuis le '+fmtDate(d),severity:'overdue'});
      else if(d<=horizonStr) alerts.push({vehicleId:v.id,vehicleName:v.name,type:label,label:'Prévu le '+fmtDate(d),severity:'upcoming'});
    });
  });
  return alerts;
}

function isVehicleReadOnlyForMe(v){
  // Lecture seule pour le centre de rattachement pendant que l'engin est géré ailleurs.
  return !!(myCentre && v.cis && v.cis===myCentre && v.currentCis && v.currentCis!==myCentre);
}

function bindVehicleDragDrop(){
  let draggedId=null;
  app.querySelectorAll('[data-vehicle-drag]').forEach(card=>{
    card.addEventListener('dragstart',e=>{
      draggedId=card.dataset.vehicleDrag;
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed='move';
    });
    card.addEventListener('dragend',()=>{ card.classList.remove('dragging'); });
    card.addEventListener('dragover',e=>{ e.preventDefault(); card.classList.add('drag-over'); });
    card.addEventListener('dragleave',()=>{ card.classList.remove('drag-over'); });
    card.addEventListener('drop',async e=>{
      e.preventDefault(); card.classList.remove('drag-over');
      const targetId=card.dataset.vehicleDrag;
      if(!draggedId || draggedId===targetId)return;
      const fromIdx=state.vehicles.findIndex(v=>v.id===draggedId);
      const toIdx=state.vehicles.findIndex(v=>v.id===targetId);
      if(fromIdx<0||toIdx<0)return;
      const[moved]=state.vehicles.splice(fromIdx,1);
      state.vehicles.splice(toIdx,0,moved);
      await saveState(); render();
    });
  });
}

async function duplicateVehicle(id){
  const v=state.vehicles.find(x=>x.id===id); if(!v)return;
  const name=prompt('Nom du nouvel engin (copie de "'+v.name+'") :', v.name+' bis');
  if(!name)return;
  const clone=JSON.parse(JSON.stringify(v));
  clone.id=uid('v'); clone.name=name; clone.immat=''; clone.invNumber=''; clone.techCheck=defaultTechCheck(); clone.checkHistory=[]; clone.loanHistory=[]; clone.currentCis=clone.cis; clone.outOfService=false; clone.outOfServiceInfo=null; clone.breakdownHistory=[];
  const resetArticle=a=>{a.id=uid('a');a.status='verifier';a.locked=false;a.lastCheck='';a.checkedBy='';a.comments=[];(a.sousArticles||[]).forEach(s=>{s.id=uid('s');s.status='verifier';s.lastCheck='';s.checkedBy='';s.comments=[];});};
  clone.emplacements.forEach(e=>{e.id=uid('e');e.articles.forEach(resetArticle);});
  state.vehicles.push(clone); await saveState(); render();
}

function openQrModal(vehicleId){
  const v=state.vehicles.find(x=>x.id===vehicleId); if(!v)return;
  const base=window.location.origin+window.location.pathname;
  const url=base+'?v='+vehicleId+'&mode=check';
  const overlay=document.createElement('div'); overlay.className='overlay';
  overlay.innerHTML=`<div class="modal"><h3>QR — ${escapeHtml(v.name)}</h3>
    <div class="qr-box"><div id="qrHolder"></div><div class="qr-url">${escapeHtml(url)}</div></div>
    <p style="font-size:11.5px;color:var(--muted);">À coller sur le véhicule une fois l'application hébergée sur son adresse définitive : ce QR ouvre directement la fiche de vérification de cet engin en mode terrain.</p>
    <div class="modal-actions"><button class="btn ghost" id="qrClose">Fermer</button></div></div>`;
  document.body.appendChild(overlay);
  document.getElementById('qrClose').addEventListener('click',()=>overlay.remove());
  overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.remove();});
  try{ new QRCode(document.getElementById('qrHolder'),{text:url,width:180,height:180}); }
  catch(e){ document.getElementById('qrHolder').textContent='(QR indisponible hors-ligne)'; }
}

/* ---------- Commande / réserve pharmacie ---------- */
function buildOrderRows(v){
  const rows=[];
  v.emplacements.forEach(emp=>{
    emp.articles.forEach(a=>{
      if(isContainerArt(a)&&a.sousArticles&&a.sousArticles.length){
        a.sousArticles.forEach(s=>{
          if((s.status==='manquant'||s.status==='perime')&&(s.qtyMissing||s.qty)>0){
            rows.push({emp:emp.name,name:a.name+' > '+s.name,qty:s.qtyMissing||s.qty,total:s.qty,pharma:a.regType==='PHARMA'});
          }
        });
      } else if((a.status==='manquant'||a.status==='perime')&&(a.qtyMissing||a.qty)>0){
        rows.push({emp:emp.name,name:a.name,qty:a.qtyMissing||a.qty,total:a.qty,pharma:a.regType==='PHARMA'});
      }
    });
  });
  return rows;
}
function openOrderModal(v){
  const rows=buildOrderRows(v);
  const overlay=document.createElement('div'); overlay.className='overlay';
  let listHtml, textBody;
  if(!rows.length){
    listHtml='<p style="font-size:12.5px;color:var(--muted);">Rien à commander pour le moment — aucun item manquant ou périmé.</p>';
    textBody='';
  } else {
    const byEmp={};
    rows.forEach(r=>{(byEmp[r.emp]=byEmp[r.emp]||[]).push(r);});
    listHtml=Object.keys(byEmp).map(empName=>`
      <div style="margin-bottom:10px;"><b style="font-family:var(--font-head);font-size:13px;color:var(--navy);">${escapeHtml(empName)}</b>
      <ul style="margin:4px 0 0;padding-left:18px;font-size:12.5px;">
        ${byEmp[empName].map(r=>`<li>${escapeHtml(r.name)} — <b>${r.qty}</b>${r.total!==r.qty?' / '+r.total:''}${r.pharma?' <span class="reg-badge">Pharma</span>':''}</li>`).join('')}
      </ul></div>`).join('');
    textBody='Commande à préparer — '+v.name+' — '+fmtDate(todayStr())+'\n\n'+
      Object.keys(byEmp).map(empName=>empName+'\n'+byEmp[empName].map(r=>'  - '+r.name+' : '+r.qty).join('\n')).join('\n\n');
  }
  overlay.innerHTML=`<div class="modal wide"><h3>🛒 Commande à préparer — ${escapeHtml(v.name)}</h3>
    ${listHtml}
    <div class="modal-actions">
      <button class="btn ghost" id="ordClose">Fermer</button>
      ${rows.length?'<button class="btn primary" id="ordDownload">Télécharger .txt</button>':''}
    </div></div>`;
  document.body.appendChild(overlay);
  document.getElementById('ordClose').addEventListener('click',()=>overlay.remove());
  overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.remove();});
  const dl=document.getElementById('ordDownload');
  if(dl)dl.addEventListener('click',()=>downloadFile('commande_'+v.name.replace(/\s+/g,'_')+'.txt',textBody,'text/plain'));
}

  overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.remove();});
  document.getElementById('globalSearchClose').addEventListener('click',()=>overlay.remove());
  const runSearch=(q)=>{
    const resEl=document.getElementById('globalSearchResults');
    const n=normalizeTxt(q);
    if(n.length<2){ resEl.innerHTML='<p style="font-size:12px;color:var(--muted);">Tape au moins 2 caractères…</p>'; return; }
    let html='';
    // Véhicules
    const vehResults=[];
    state.vehicles.forEach(v=>{
      v.emplacements.forEach(emp=>{
        emp.articles.forEach(a=>{
          if(normalizeTxt(a.name).includes(n)) vehResults.push({vId:v.id,label:v.name+' — '+emp.name+' — '+a.name,qty:a.qty,status:a.status});
          (a.sousArticles||[]).forEach(s=>{ if(normalizeTxt(s.name).includes(n)) vehResults.push({vId:v.id,label:v.name+' — '+emp.name+' — '+a.name+' > '+s.name,qty:s.qty,status:s.status}); });
        });
      });
    });
    if(vehResults.length){
      html+=`<div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;margin:8px 0 4px;">Sur les véhicules (${vehResults.length})</div>`;
      vehResults.slice(0,50).forEach(r=>{
        html+=`<div class="article-row" style="grid-template-columns:1fr;padding:6px 0;"><div style="font-size:12.5px;cursor:pointer;" data-search-goto-vehicle="${r.vId}">${escapeHtml(r.label)} <span class="article-sub">(qté ${r.qty}${r.status?', '+(STATUS[r.status]?STATUS[r.status].label:r.status):''})</span></div></div>`;
      });
    }
    // Réserves
    let resCount=0; let resHtml='';
    Object.keys(RESERVE_CATS).forEach(cat=>{
      (state.reserves[cat]||[]).forEach(it=>{
        if(normalizeTxt(it.name).includes(n)||normalizeTxt(it.numero||'').includes(n)){
          resCount++;
          resHtml+=`<div class="article-row" style="grid-template-columns:1fr;padding:6px 0;"><div style="font-size:12.5px;cursor:pointer;" data-search-goto-reserve="${cat}">${RESERVE_CATS[cat].icon} ${escapeHtml(it.name)}${it.numero?' <span class="article-sub">(n° '+escapeHtml(it.numero)+')</span>':''} <span class="article-sub">— stock ${it.qty}${it.location==='reparation'?', en réparation':''}</span></div></div>`;
        }
      });
    });
    if(resCount){ html+=`<div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;margin:8px 0 4px;">Dans les réserves (${resCount})</div>`+resHtml; }
    if(!vehResults.length && !resCount) html='<p style="font-size:12.5px;color:var(--muted);">Aucun résultat.</p>';
    resEl.innerHTML=html;
    resEl.querySelectorAll('[data-search-goto-vehicle]').forEach(el=>el.addEventListener('click',()=>{
      overlay.remove(); currentView={type:'check',vehicleId:el.dataset.searchGotoVehicle}; render();
    }));
    resEl.querySelectorAll('[data-search-goto-reserve]').forEach(el=>el.addEventListener('click',()=>{
      overlay.remove(); currentView={type:'reserve',cat:el.dataset.searchGotoReserve,search:''}; render();
    }));
  };
  document.getElementById('globalSearchInput').addEventListener('input',e=>runSearch(e.target.value));
  setTimeout(()=>document.getElementById('globalSearchInput').focus(),50);
}
function openAddReserveItemModal(cat,isBottleCat){
  const overlay=document.createElement('div'); overlay.className='overlay';
  const defaultPressure = cat==='oxygene'?200:300;
  overlay.innerHTML=`<div class="modal"><h3>➕ Ajouter — ${RESERVE_CATS[cat].label}</h3>
    ${isBottleCat?`
      <div class="field"><label>Numéro de la bouteille (obligatoire)</label><input id="modRNumero"></div>
      <div class="field"><label>Volume (L)</label><input type="number" step="0.5" id="modRVolume"></div>
      <div class="field"><label>Pression (bar)</label><input type="number" id="modRPressure" value="${defaultPressure}"></div>
      <p style="font-size:11px;color:var(--muted);">Le nom est généré automatiquement : « Bouteille ${cat==='oxygene'?'Oxygène':'Air'} &lt;numéro&gt; ».</p>
    `:`
      <div class="field"><label>Nom de l'article</label><input id="modRName"></div>
      <div class="field"><label>Stock</label><input type="number" min="0" id="modRQty" value="1"></div>
      <div class="field"><label>Seuil</label><input type="number" min="0" id="modRMin" value="0"></div>
      <div class="field"><label>Suivi</label><select id="modRTrackMode"><option value="stock">Par quantité (stock)</option><option value="unique">Individuel (numéro unique)</option></select></div>
    `}
    <div class="modal-actions"><button class="btn ghost" id="modRCancel">Annuler</button><button class="btn primary" id="modRConfirm">Ajouter</button></div></div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.remove();});
  document.getElementById('modRCancel').addEventListener('click',()=>overlay.remove());
  document.getElementById('modRConfirm').addEventListener('click',async()=>{
    if(isBottleCat){
      const numero=document.getElementById('modRNumero').value.trim(); if(!numero){alert('Le numéro est obligatoire.');return;}
      const volumeL=document.getElementById('modRVolume').value;
      const pressureBar=document.getElementById('modRPressure').value;
      if(state.reserves[cat].some(it=>normalizeTxt(it.numero||'')===normalizeTxt(numero))){
        alert('Une bouteille avec ce numéro existe déjà dans cette réserve.'); return;
      }
      const name='Bouteille '+(cat==='oxygene'?'Oxygène':'Air')+' '+numero;
      state.reserves[cat].push({id:uid('r'),name,qty:1,qtyMin:0,expiry:'',comments:[],numero,volumeL,pressureBar,trackMode:'unique',location:'stock'});
    } else {
      const name=document.getElementById('modRName').value.trim(); if(!name){alert('Le nom est obligatoire.');return;}
      const qty=parseInt(document.getElementById('modRQty').value)||0;
      const qtyMin=parseInt(document.getElementById('modRMin').value)||0;
      const trackMode=document.getElementById('modRTrackMode').value;
      if(trackMode==='unique'){
        state.reserves[cat].push({id:uid('r'),name,qty:1,qtyMin:0,expiry:'',comments:[],numero:'',volumeL:'',pressureBar:'',trackMode:'unique',location:'stock'});
      } else {
        const nk=normalizeTxt(name);
        const existing=state.reserves[cat].find(it=>normalizeTxt(it.name)===nk && it.trackMode!=='unique');
        if(existing){
          existing.qty=(existing.qty||0)+qty;
          if(qtyMin>existing.qtyMin) existing.qtyMin=qtyMin;
          addComment(existing,'+'+qty+' ajouté le '+fmtDate(todayStr()));
        } else {
          state.reserves[cat].push({id:uid('r'),name,qty,qtyMin,expiry:'',comments:[],numero:'',volumeL:'',pressureBar:'',trackMode:'stock',location:'stock'});
        }
      }
    }
    await saveState(); overlay.remove(); render();
  });
}
function renderReserve(cat,search,sort){
  const meta=RESERVE_CATS[cat]; if(!meta){currentView={type:'dashboard'};return render();}
  const allItems=state.reserves[cat]||[];
  const isBottleCat = cat==='oxygene'||cat==='ari';
  search=search||'';
  sort=sort||'name_asc';
  let reservePage=1;

  const sortItems=(arr)=>{
    const out=arr.slice();
    switch(sort){
      case 'name_desc': out.sort((a,b)=>b.name.localeCompare(a.name,'fr')); break;
      case 'qtymin_asc': out.sort((a,b)=>(a.qtyMin||0)-(b.qtyMin||0)); break;
      case 'qtymin_desc': out.sort((a,b)=>(b.qtyMin||0)-(a.qtyMin||0)); break;
      case 'qty_asc': out.sort((a,b)=>(a.qty||0)-(b.qty||0)); break;
      case 'qty_desc': out.sort((a,b)=>(b.qty||0)-(a.qty||0)); break;
      case 'name_asc': default: out.sort((a,b)=>a.name.localeCompare(b.name,'fr')); break;
    }
    return out;
  };

  const buildListHtml=(filterText,sortVal)=>{
    const sn=normalizeTxt(filterText||'');
    let items=sn?allItems.filter(it=>normalizeTxt(it.name).includes(sn)||normalizeTxt(it.numero||'').includes(sn)):allItems.slice();
    sort=sortVal||sort;
    items=sortItems(items);
    const PAGE_SIZE=60;
    const pageItems=items.slice(0,reservePage*PAGE_SIZE);
    let h='';
    if(!items.length){ h+=`<p style="font-size:12.5px;color:var(--muted);padding:10px 0;">Aucune référence ne correspond à « ${escapeHtml(filterText)} ».</p>`; }
    pageItems.forEach(it=>{
      const isUnique = isBottleCat || it.trackMode==='unique';
      const low = !isUnique && it.qtyMin>0 && it.qty<it.qtyMin;
      const inRepair = it.location==='reparation';
      h+=`<div class="article-row" data-item="${it.id}" style="grid-template-columns:${isUnique?'1fr 130px 30px 30px':'1fr 70px 70px 30px 30px'};">
        <div>
          <div class="article-name">${escapeHtml(it.name)} ${low?'<span class="reg-badge overdue">Sous seuil</span>':''}${isBottleCat&&it.volumeL?` <span class="tag">${escapeHtml(it.volumeL)} L</span>`:''}${isBottleCat&&it.pressureBar?` <span class="tag">${escapeHtml(it.pressureBar)} bar</span>`:''}${isBottleCat&&it.pressureBar!==''&&parseFloat(it.pressureBar)<=0?` <span class="reg-badge overdue">Vide — ${cat==='ari'?'à recharger sur place':'à retourner en pharmacie'}</span>`:''}${inRepair?' <span class="reg-badge overdue">🔧 En réparation</span>':''}</div>

          ${renderCommentsBlock(it,'r:'+cat+':'+it.id)}
          ${it.currentVehicleLabel&&it.qty===0?`<div class="comment-text" style="background:#e8f0fb;border-color:#b8d0ef;color:var(--navy);"><b>📍 Sur :</b> ${escapeHtml(it.currentVehicleLabel)}</div>`:''}
          <div class="field-inline">

            ${!isBottleCat?`<label>Suivi</label><select data-set-r-trackmode="${it.id}"><option value="stock" ${it.trackMode!=='unique'?'selected':''}>Par quantité (stock)</option><option value="unique" ${it.trackMode==='unique'?'selected':''}>Individuel (numéro unique)</option></select>`:''}
          </div>

          : isUnique
          ? `<div style="text-align:center;"><label style="font-size:10px;color:var(--muted);display:block;">Disponibilité</label>
              ${it.qty>0
                ? '<span class="tag" style="background:var(--green);color:#fff;">En stock</span>'

    });
    if(items.length>pageItems.length){
      h+=`<button class="btn ghost" id="reserveShowMoreBtn" style="width:100%;margin-top:8px;">Afficher plus (${items.length-pageItems.length} restant(s) sur ${items.length})</button>`;

    if(isBottleCat){

      h+=`<div class="add-row"><input placeholder="Numéro de la bouteille (obligatoire)" id="newRNumero" style="width:200px;"><input type="number" placeholder="Volume (L)" step="0.5" style="width:100px;" id="newRVolume"><input type="number" placeholder="Pression (bar)" value="${defaultPressure}" style="width:120px;" id="newRPressure"><button class="btn small primary" data-add-r="${cat}">Ajouter la bouteille</button></div>

      <p style="font-size:11px;color:var(--muted);margin:6px 0 0;">"Individuel" pour un matériel avec numéro de série unique (groupe électrogène, désincarcérateur...) — une ligne = une unité, traçable. "Par quantité" pour du consommable interchangeable (tuyaux, lances...).</p>`;
    }
    return h;
  };

  const bindListEvents=()=>{
    const smb=document.getElementById('reserveShowMoreBtn');
    if(smb)smb.addEventListener('click',()=>{
      reservePage++;
      document.getElementById('reserveListContainer').innerHTML=buildListHtml(search,sort);
      bindListEvents();
    });
    app.querySelectorAll('[data-add-r]').forEach(el=>el.addEventListener('click',async()=>{
      if(isBottleCat){
        const numero=document.getElementById('newRNumero').value.trim(); if(!numero)return;
        const volumeL=document.getElementById('newRVolume').value;
        const pressureBar=document.getElementById('newRPressure').value;
        if(state.reserves[cat].some(it=>normalizeTxt(it.numero||'')===normalizeTxt(numero))){
          alert('Une bouteille avec ce numéro existe déjà dans cette réserve.'); return;
        }
        const name='Bouteille '+(cat==='oxygene'?'Oxygène':'Air')+' '+numero;
        state.reserves[cat].push({id:uid('r'),name,qty:1,qtyMin:0,expiry:'',comments:[],numero,volumeL,pressureBar});
      } else {
        const name=document.getElementById('newRName').value.trim(); if(!name)return;
        const qty=parseInt(document.getElementById('newRQty').value)||0;
        const qtyMin=parseInt(document.getElementById('newRMin').value)||0;
        const trackMode=document.getElementById('newRTrackMode').value;
        const nk=normalizeTxt(name);
        if(trackMode==='unique'){
          state.reserves[cat].push({id:uid('r'),name,qty:1,qtyMin:0,expiry:'',comments:[],numero:'',volumeL:'',pressureBar:'',trackMode:'unique',location:'stock'});
        } else {
          const existing=state.reserves[cat].find(it=>normalizeTxt(it.name)===nk && it.trackMode!=='unique');
          if(existing){
            existing.qty=(existing.qty||0)+qty;
            if(qtyMin>existing.qtyMin) existing.qtyMin=qtyMin;
            addComment(existing,'+'+qty+' ajouté le '+fmtDate(todayStr()));
          } else {
            state.reserves[cat].push({id:uid('r'),name,qty,qtyMin,expiry:'',comments:[],numero:'',volumeL:'',pressureBar:'',trackMode:'stock',location:'stock'});

/* ---------- Détection et fusion de doublons dans les réserves ---------- */
function levenshtein(a,b){
  const m=a.length,n=b.length;
  if(!m)return n; if(!n)return m;
  let prev=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){
    const cur=[i];
    for(let j=1;j<=n;j++){
      cur[j]=a[i-1]===b[j-1]?prev[j-1]:1+Math.min(prev[j-1],prev[j],cur[j-1]);
    }
    prev=cur;
  }
  return prev[n];
}
function areSimilarNames(n1,n2){
  const a=normalizeTxt(n1),b=normalizeTxt(n2);
  if(!a||!b||a===b) return a===b && a!=='';
  if(a.length>=4 && b.length>=4 && (a.startsWith(b)||b.startsWith(a))) return true;
  const dist=levenshtein(a,b);
  const threshold=Math.max(2,Math.floor(0.25*Math.min(a.length,b.length)));
  return dist<=threshold;
}
function duplicateReserveItem(cat,itemId){
  const items=state.reserves[cat]||[];
  const it=items.find(x=>x.id===itemId); if(!it)return;
  const clone=JSON.parse(JSON.stringify(it));
  clone.id=uid('r');
  clone.name=it.name+' (copie)';
  clone.comments=[];
  clone.currentVehicleLabel='';
  if(it.numero){
    const newNum=prompt('Ce type d\'élément a un numéro unique ("'+it.numero+'"). Indique le numéro de la copie :','');
    clone.numero=newNum?newNum.trim():'';
    if(clone.numero && items.some(x=>x.numero && normalizeTxt(x.numero)===normalizeTxt(clone.numero))){
      alert('⚠ Attention : le numéro "'+clone.numero+'" est déjà utilisé par un autre élément de cette réserve. La copie est créée quand même — pense à corriger.');
    }
  }
  items.push(clone);
  saveState(); render();
}
function findDuplicateGroups(){
  const groups=[];
  Object.keys(RESERVE_CATS).forEach(cat=>{
    const items=state.reserves[cat]||[];
    const used=new Set();
    for(let i=0;i<items.length;i++){
      if(used.has(items[i].id))continue;
      const cluster=[items[i]];
      for(let j=i+1;j<items.length;j++){
        if(used.has(items[j].id))continue;
        if(areSimilarNames(items[i].name,items[j].name)){ cluster.push(items[j]); used.add(items[j].id); }
      }
      if(cluster.length>1){ used.add(items[i].id); groups.push({cat,items:cluster}); }
    }
  });
  return groups;
}
function openDuplicatesModal(){
  const groups=findDuplicateGroups();
  const ignored=new Set();
  const overlay=document.createElement('div'); overlay.className='overlay';
  const renderGroup=(g,gi)=>{
    if(ignored.has(gi)) return '';
    return `
      <div class="tech-block" style="padding:12px;margin-bottom:10px;" id="dupGroup_${gi}">
        <div style="font-size:11px;color:var(--muted);text-transform:uppercase;margin-bottom:6px;">${RESERVE_CATS[g.cat].label}</div>
        ${g.items.map((it,ii)=>`<div style="display:flex;gap:8px;align-items:center;padding:4px 0;font-size:12.5px;">
          <input type="checkbox" data-dup-include="${gi}_${ii}" checked>
          <input type="radio" name="dupKeep_${gi}" value="${ii}" ${ii===0?'checked':''} data-dup-keep="${gi}">
          <label style="flex:1;">${escapeHtml(it.name)} <span class="article-sub">(stock ${it.qty}${it.numero?', n° '+escapeHtml(it.numero):''})</span></label>
        </div>`).join('')}
        <p style="font-size:10.5px;color:var(--muted);margin:4px 0 8px;">Case à gauche = inclure dans la fusion. Bouton radio = quel nom garder (parmi les inclus).</p>
        <div style="display:flex;gap:8px;">
          <button class="btn small primary" data-dup-merge="${gi}">Fusionner les éléments cochés</button>
          <button class="btn small ghost" data-dup-ignore="${gi}">Ce ne sont pas des doublons — ignorer</button>
        </div>
      </div>`;
  };
  const renderAll=()=>groups.map((g,gi)=>renderGroup(g,gi)).join('') || '<p style="font-size:12.5px;color:var(--muted);">Aucun groupe restant.</p>';
  overlay.innerHTML=`<div class="modal wide"><h3>🔍 Doublons probables</h3>
    <p style="font-size:12px;color:var(--muted);">Regroupés par ressemblance de nom (ex: "compresse" / "compresses stériles" / "compresses"). Décoche ce qui n'est pas concerné, choisis le nom à garder, puis fusionne — ou ignore le groupe si ce ne sont pas de vrais doublons.</p>
    <div id="dupList" style="max-height:400px;overflow-y:auto;">${groups.length?renderAll():'<p style="font-size:12.5px;color:var(--muted);">Aucun doublon probable détecté dans les réserves.</p>'}</div>
    <div class="modal-actions"><button class="btn ghost" id="dupClose">Fermer</button></div></div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.remove();});
  document.getElementById('dupClose').addEventListener('click',()=>overlay.remove());
  function bindGroupButtons(){
    overlay.querySelectorAll('[data-dup-ignore]').forEach(btn=>btn.addEventListener('click',()=>{
      const gi=btn.dataset.dupIgnore; ignored.add(gi);
      const el=document.getElementById('dupGroup_'+gi); if(el) el.remove();
    }));
    overlay.querySelectorAll('[data-dup-merge]').forEach(btn=>btn.addEventListener('click',async()=>{
      const gi=btn.dataset.dupMerge;
      const g=groups[gi];
      const includeFlags=g.items.map((it,ii)=>document.querySelector(`[data-dup-include="${gi}_${ii}"]`).checked);
      const includedIdx=g.items.map((it,ii)=>ii).filter(ii=>includeFlags[ii]);
      if(includedIdx.length<2){ alert('Coche au moins deux éléments à fusionner.'); return; }
      const keepRadio=overlay.querySelector(`input[name="dupKeep_${gi}"]:checked`);
      const keepIdx=parseInt(keepRadio.value);
      if(!includeFlags[keepIdx]){ alert('L\'élément dont tu gardes le nom doit être coché.'); return; }
      const keep=g.items[keepIdx];
      let totalQty=0, maxMin=0;
      let mergedComments=keep.comments?keep.comments.slice():[];
      includedIdx.forEach(ii=>{
        const it=g.items[ii]; totalQty+=(it.qty||0); if((it.qtyMin||0)>maxMin) maxMin=it.qtyMin;
        if(it!==keep && it.comments && it.comments.length) mergedComments=mergedComments.concat(it.comments);
      });
      keep.qty=totalQty;
      keep.qtyMin=maxMin;
      keep.comments=mergedComments;
      const toRemove=includedIdx.filter(ii=>ii!==keepIdx).map(ii=>g.items[ii].id);
      state.reserves[g.cat]=state.reserves[g.cat].filter(it=>!toRemove.includes(it.id));
      await saveState();
      document.getElementById('dupGroup_'+gi).remove();
    }));
  }
  bindGroupButtons();
}

function openOxygenReceiveModal(){

  let rows=[{numero:'',volumeL:'5',pressureBar:'200',expiry:''}];
  const renderRows=()=>rows.map((r,i)=>`<div class="article-row" style="grid-template-columns:1fr 70px 70px 130px 30px;">
      <input placeholder="N° bouteille" value="${escapeHtml(r.numero)}" data-oxy-row="${i}" data-oxy-field="numero">
      <input type="number" placeholder="Vol. L" value="${escapeHtml(r.volumeL)}" data-oxy-row="${i}" data-oxy-field="volumeL">
      <input type="number" placeholder="Bar" value="${escapeHtml(r.pressureBar)}" data-oxy-row="${i}" data-oxy-field="pressureBar">
      <input type="date" value="${r.expiry}" data-oxy-row="${i}" data-oxy-field="expiry">
      <button class="del-btn" data-oxy-del="${i}">✕</button>
    </div>`).join('');
  overlay.innerHTML=`<div class="modal wide"><h3>📦 Réceptionner une commande — Bouteilles d'oxygène</h3>
    <p style="font-size:12px;color:var(--muted);">Une ligne par bouteille reçue : numéro (obligatoire), volume, pression, et date de péremption si applicable.</p>
    <div id="oxyRecvList">${renderRows()}</div>
    <button class="btn small ghost" id="oxyAddRow" style="margin-top:8px;">+ Ajouter une bouteille</button>
    <div class="modal-actions"><button class="btn ghost" id="oxyRecvCancel">Annuler</button><button class="btn primary" id="oxyRecvConfirm">Valider la réception</button></div></div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.remove();});
  document.getElementById('oxyRecvCancel').addEventListener('click',()=>overlay.remove());
  function bind(){
    document.querySelectorAll('[data-oxy-row]').forEach(inp=>inp.addEventListener('change',()=>{
      rows[parseInt(inp.dataset.oxyRow)][inp.dataset.oxyField]=inp.value;
    }));
    document.querySelectorAll('[data-oxy-del]').forEach(btn=>btn.addEventListener('click',()=>{
      rows.splice(parseInt(btn.dataset.oxyDel),1); document.getElementById('oxyRecvList').innerHTML=renderRows(); bind();
    }));
  }
  bind();
  document.getElementById('oxyAddRow').addEventListener('click',()=>{
    rows.push({numero:'',volumeL:'5',pressureBar:'200',expiry:''});
    document.getElementById('oxyRecvList').innerHTML=renderRows(); bind();
  });
  document.getElementById('oxyRecvConfirm').addEventListener('click',async()=>{
    const valid=rows.filter(r=>r.numero&&r.numero.trim());
    if(!valid.length){ alert('Indique au moins un numéro de bouteille.'); return; }
    state.reserves.oxygene=state.reserves.oxygene||[];
    valid.forEach(r=>{
      state.reserves.oxygene.push({id:uid('r'),name:'Bouteille Oxygène '+r.numero.trim(),qty:1,qtyMin:0,expiry:r.expiry||'',
        comments:[{id:uid('cm'),text:'Reçue (commande) le '+fmtDate(todayStr()),date:todayStr()}],numero:r.numero.trim(),volumeL:r.volumeL||'',pressureBar:r.pressureBar||'',trackMode:'unique',location:'stock'});
    });
    await saveState(); overlay.remove(); render();
    alert(valid.length+' bouteille(s) ajoutée(s).');
  });
}
function openPharmaOrderModal(){
  const items=state.reserves.pharmacie||[];
  const need=items.filter(it=>it.qtyMin>0 && it.qty<it.qtyMin);
  const overlay=document.createElement('div'); overlay.className='overlay';
  let listHtml,textBody;
  if(!need.length){
    listHtml='<p style="font-size:12.5px;color:var(--muted);">Rien à commander — tous les stocks pharmacie sont au-dessus du seuil.</p>'; textBody='';
  } else {
    listHtml='<ul style="margin:4px 0 0;padding-left:18px;font-size:12.5px;">'+need.map(it=>`<li>${escapeHtml(it.name)} — stock ${it.qty} / seuil ${it.qtyMin} → commander <b>${it.qtyMin-it.qty}</b></li>`).join('')+'</ul>';
    textBody='Commande pharmacie — '+fmtDate(todayStr())+'\n\n'+need.map(it=>'  - '+it.name+' : '+(it.qtyMin-it.qty)).join('\n');
  }
  overlay.innerHTML=`<div class="modal wide"><h3>🛒 Commande pharmacie</h3>${listHtml}
    <div class="modal-actions"><button class="btn ghost" id="pordClose">Fermer</button>${need.length?'<button class="btn primary" id="pordDownload">Télécharger .txt</button>':''}</div></div>`;
  document.body.appendChild(overlay);
  document.getElementById('pordClose').addEventListener('click',()=>overlay.remove());
  overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.remove();});
  const dl=document.getElementById('pordDownload'); if(dl)dl.addEventListener('click',()=>downloadFile('commande_pharmacie.txt',textBody,'text/plain'));
}
function guessReserveCat(article){
  if(article.regType==='PHARMA') return 'pharmacie';
  if(article.regType==='O2') return 'oxygene';
  if(article.regType==='ARI') return 'ari';
  return 'petit';
}
function findBestReserveCat(name){
  // Cherche d'abord une référence de réserve dont le nom correspond, dans toutes les catégories,
  // pour éviter de tomber par défaut sur une catégorie vide simplement parce que le type
  // de suivi réglementaire de l'article n'a pas été renseigné dans la config du véhicule.
  const n=normalizeTxt(name);
  let bestCat=null;
  Object.keys(RESERVE_CATS).forEach(cat=>{
    (state.reserves[cat]||[]).forEach(it=>{
      if(it.qty>0){
        const itn=normalizeTxt(it.name);
        if(itn===n || itn.includes(n) || n.includes(itn)){ if(!bestCat) bestCat=cat; }
      }
    });
  });
  return bestCat;
}
function isBottleCategory(cat){return cat==='oxygene'||cat==='ari';}
function maskDateInput(el){
  el.addEventListener('input',()=>{
    let digits=el.value.replace(/\D/g,'').slice(0,8);
    let out=digits;
    if(digits.length>4) out=digits.slice(0,2)+'/'+digits.slice(2,4)+'/'+digits.slice(4);
    else if(digits.length>2) out=digits.slice(0,2)+'/'+digits.slice(2);
    el.value=out;
  });
}
function frDateToIso(fr){
  const m=(fr||'').trim().match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  if(!m) return null;
  const[,d,mo,y]=m;
  const iso=`${y}-${mo}-${d}`;
  const dt=new Date(iso);
  if(isNaN(dt)||dt.getMonth()+1!=parseInt(mo)) return null;
  return iso;
}
function isoDateToFr(iso){ return iso?fmtDate(iso):''; }
function openDateEntryModal(label,currentIso,cb){
  const overlay=document.createElement('div'); overlay.className='overlay';
  overlay.innerHTML=`<div class="modal"><h3>${escapeHtml(label)}</h3>
    <div class="field"><label>Date (JJ/MM/AAAA)</label><input id="dateEntryInput" inputmode="numeric" placeholder="JJ/MM/AAAA" value="${isoDateToFr(currentIso)}" style="font-family:var(--font-mono);font-size:16px;"></div>
    <div class="modal-actions"><button class="btn ghost" id="dateEntrySkip">Laisser inchangé</button><button class="btn primary" id="dateEntryOk">Valider</button></div></div>`;
  document.body.appendChild(overlay);
  const inp=document.getElementById('dateEntryInput');
  maskDateInput(inp);
  setTimeout(()=>inp.focus(),50);
  document.getElementById('dateEntrySkip').addEventListener('click',()=>{overlay.remove();cb(null);});
  overlay.addEventListener('click',e=>{if(e.target===overlay){overlay.remove();cb(null);}});
  const submit=()=>{
    if(!inp.value.trim()){ overlay.remove(); cb(null); return; }
    const iso=frDateToIso(inp.value);
    if(!iso){ alert('Date invalide — format attendu JJ/MM/AAAA (ex: 24/12/2026).'); return; }
    overlay.remove(); cb(iso);
  };
  document.getElementById('dateEntryOk').addEventListener('click',submit);
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();submit();}});
}
function openReservePicker(v,empId,artId,subId){
  const{a,emp}=findArt(v,empId+':'+artId);
  const target=subId?a.sousArticles.find(s=>s.id===subId):a;
  const missing=target.qtyMissing||target.qty||1;
  let cat=findBestReserveCat(target.name)||guessReserveCat(a);
  const overlay=document.createElement('div'); overlay.className='overlay';
  const renderList=(c,filterText)=>{
    let items=(state.reserves[c]||[]).filter(it=>it.qty>0);
    const sn=normalizeTxt(filterText||'');
    if(sn) items=items.filter(it=>normalizeTxt(it.name).includes(sn)||normalizeTxt(it.numero||'').includes(sn));
    if(!items.length) return '<p style="font-size:12px;color:var(--muted);">Aucun stock disponible'+(sn?' pour cette recherche':' dans cette réserve')+'.</p>';
    return items.map(it=>`<div class="article-row" style="grid-template-columns:1fr 60px;"><div>${escapeHtml(it.name)} <span class="article-sub">(stock ${it.qty}${it.numero?' · n° '+escapeHtml(it.numero):''})</span></div><button class="btn small primary" data-pick-r="${it.id}">Choisir</button></div>`).join('');
  };
  overlay.innerHTML=`<div class="modal wide"><h3>🔁 Remplacer depuis la réserve</h3>
    <p style="font-size:12.5px;color:var(--muted);">Item : <b>${escapeHtml(target.name)}</b> — quantité à remplacer : ${missing}</p>
    <div class="filters" style="margin-bottom:10px;" id="rPickCats">${Object.keys(RESERVE_CATS).map(c=>`<div class="chip ${c===cat?'active':''}" data-cat="${c}">${RESERVE_CATS[c].icon} ${RESERVE_CATS[c].label}</div>`).join('')}</div>
    <div class="field"><input id="rPickSearch" placeholder="Rechercher par nom ou numéro de bouteille…"></div>
    <div id="rPickList">${renderList(cat,'')}</div>
    <div class="modal-actions"><button class="btn ghost" id="rPickClose">Annuler</button></div></div>`;
  document.body.appendChild(overlay);
  document.getElementById('rPickClose').addEventListener('click',()=>overlay.remove());
  overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.remove();});
  document.getElementById('rPickSearch').addEventListener('input',e=>{
    document.getElementById('rPickList').innerHTML=renderList(cat,e.target.value); bindPicks();
  });
  function finalizePick(it,extra){
    it.qty=Math.max(0,it.qty-missing);
    target.status='ok'; target.qtyMissing=0; target.lastCheck=todayStr(); target.checkedBy=currentCheckerLabel();
    if(isContainerArt(target)) target.locked=true; // conteneur : reverrouillé une fois remplacé
    addComment(target,'Remplacé depuis réserve « '+RESERVE_CATS[cat].label+' » : '+it.name+(extra||''));
    // Traçabilité : indique sur quel engin/emplacement se trouve désormais cette référence de réserve.
    it.currentVehicleLabel=v.name+' — '+emp.name+' — '+target.name;
    return saveState();
  }
  function returnOldBottleIfNeeded(){
    // ARI : la bouteille vidée reste au centre, rechargée sur le compresseur, et retourne en réserve.
    // O2 : la bouteille vidée part chez le fournisseur pharmacie et sort du stock local — on ne la remet pas.
    const oldNum=target.invNum, oldVol=target.volumeL;
    if(cat==='ari' && oldNum){
      let oldEntry=(state.reserves.ari||[]).find(x=>x.numero===oldNum);
      if(!oldEntry){
        oldEntry={id:uid('r'),name:'Bouteille Air '+oldNum,qty:0,qtyMin:0,expiry:'',comments:[],numero:oldNum,volumeL:oldVol||'',pressureBar:''};
        state.reserves.ari.push(oldEntry);
      }
      oldEntry.qty=1;
      oldEntry.pressureBar='0';
      addComment(oldEntry,'Retour vidage le '+fmtDate(todayStr())+' — à recharger (compresseur du centre)');
    }
  }
  function finalizePickBottle(it,label){
    returnOldBottleIfNeeded();
    return finalizePick(it,label);
  }
  function bindPicks(){
    overlay.querySelectorAll('[data-pick-r]').forEach(el=>el.addEventListener('click',()=>{
      const it=(state.reserves[cat]||[]).find(x=>x.id===el.dataset.pickR); if(!it)return;
      if(isBottleCategory(cat)){
        if(it.numero){
          // Bouteille précise cochée dans la réserve : on reprend directement ses infos, pas de saisie.
          const label=' (bouteille n° '+it.numero+')';
          const newInvNum=it.numero, newVol=it.volumeL||'', newPres=it.pressureBar||'';
          finalizePickBottle(it,label).then(()=>{
            target.invNum=newInvNum; target.volumeL=newVol; target.pressureBar=newPres;
            saveState().then(()=>{overlay.remove();render();});
          });
        } else {
          const newNum=prompt('Numéro de la nouvelle bouteille installée (laisser vide si inconnu) :', target.invNum||'');
          if(newNum===null) return;
          const label=newNum.trim()?(' (bouteille n° '+newNum.trim()+')'):'';
          finalizePickBottle(it,label).then(()=>{
            if(newNum.trim()) target.invNum=newNum.trim();
            saveState().then(()=>{overlay.remove();render();});
          });
        }
      } else {
        // Le champ de date pertinent dépend du type d'item : les articles à suivi réglementaire (ex: péremption pharma)
        // utilisent regDueDate (c'est ce champ qui pilote le badge affiché), les autres utilisent expiry.
        const currentDate = target.regType ? target.regDueDate : target.expiry;
        openDateEntryModal('Nouvelle date de péremption pour « '+target.name+' »', currentDate, async(iso)=>{
          let extra='';
          if(iso){
            if(target.regType) target.regDueDate=iso; else target.expiry=iso;
            extra=' (péremption '+fmtDate(iso)+')';
          }
          await finalizePick(it,extra);
          overlay.remove(); render();
        });
      }
    }));
  }
  bindPicks();
  overlay.querySelectorAll('[data-cat]').forEach(el=>el.addEventListener('click',()=>{
    cat=el.dataset.cat;
    overlay.querySelectorAll('[data-cat]').forEach(c2=>c2.classList.toggle('active',c2.dataset.cat===cat));
    document.getElementById('rPickList').innerHTML=renderList(cat,document.getElementById('rPickSearch').value);
    bindPicks();
  }));
}

/* ---------- Récapitulatif journalier ---------- */
function renderDaily(dateStr){
  dateStr=dateStr||todayStr();
  let html=`<div class="back-link" id="backLink">← Retour au tableau de bord</div>
  <div class="detail-header">
    <div class="detail-title"><h2>📋 Récapitulatif</h2><div class="code">Un menu déroulant par véhicule — écarts et remplacements mis en évidence</div></div>
    <div class="detail-actions"><input type="date" id="dailyDatePicker" value="${dateStr}" style="padding:8px 10px;border:1px solid var(--line);border-radius:3px;"><button class="btn ghost small" id="printDailyBtn">🖨 Imprimer</button></div>
  </div>`;

  state.vehicles.forEach(v=>{
    const closure=(v.checkHistory||[]).filter(h=>h.date===dateStr);
    const techDone = v.techCheck && v.techCheck.lastCheck===dateStr;
    const changedLeaf=[]; const changedLock=[];
    v.emplacements.forEach(emp=>{
      emp.articles.forEach(a=>{
        const hasChildren=isContainerArt(a);
        if(hasChildren){
          if(a.lastCheck===dateStr) changedLock.push({emp:emp.name,name:a.name,locked:a.locked,comment:commentsTooltip(a),checkedBy:a.checkedBy,lockLabel:a.lockLabel});
        } else if(a.lastCheck===dateStr){
          changedLeaf.push({emp:emp.name,name:a.name,status:a.status,comment:commentsTooltip(a),checkedBy:a.checkedBy});
        }
        (a.sousArticles||[]).forEach(s=>{ if(s.lastCheck===dateStr) changedLeaf.push({emp:emp.name,name:a.name+' > '+s.name,status:s.status,comment:commentsTooltip(s),checkedBy:s.checkedBy}); });
      });
    });
    const anomalies=[
      ...changedLeaf.filter(c=>c.status==='manquant'||c.status==='perime'||c.status==='hs'),
      ...changedLock.filter(c=>!c.locked)
    ];
    const replaced=changedLeaf.filter(c=>c.status==='ok' && c.comment && c.comment.includes('Remplacé depuis réserve'));
    // Séparé en deux : activité MATÉRIEL (clôture ou items touchés) et activité ENGIN (indépendante) —
    // pour ne jamais laisser croire que le matériel a été vérifié simplement parce que l'engin l'a été.
    const hasMaterialActivity = closure.length>0 || changedLeaf.length>0 || changedLock.length>0;
    const hasActivity = hasMaterialActivity || techDone;
    // "Aucun écart" n'est affiché que si la vérification a été réellement CLÔTURÉE ce jour-là —
    // pas simplement parce que quelques items ont été touchés sans anomalie (inventaire en cours).
    const noDiscrepancy = closure.length>0 && anomalies.length===0 && replaced.length===0;
    const touchedCount = changedLeaf.length + changedLock.length;

    let badges='';
    if(closure.length) badges+=`<span class="tag">${closure[closure.length-1].pct}% conforme</span>`;
    if(anomalies.length) badges+=`<span class="tag" style="background:var(--red-dark);color:#fff;">${anomalies.length} écart(s)</span>`;
    if(replaced.length) badges+=`<span class="tag" style="background:var(--green);color:#fff;">${replaced.length} remplacé(s)</span>`;
    if(noDiscrepancy) badges+=`<span class="tag" style="background:var(--green);color:#fff;">✓ Aucun écart (matériel)</span>`;
    else if(!hasMaterialActivity) badges+=`<span class="tag" style="background:var(--grey);color:#fff;">Matériel non vérifié</span>`;
    if(hasMaterialActivity){
      badges+= closure.length
        ? `<span class="tag" style="background:var(--navy-3);color:#fff;">🔒 Matériel clôturé</span>`
        : `<span class="tag" style="background:var(--steel);color:#fff;">🔓 Matériel en cours</span>`;
    }
    const tdue=techDueInfo(v);
    if(techDone){
      badges += techOverallOk(v)
        ? `<span class="tag" style="background:var(--green);color:#fff;">✓ Engin OK</span>`
        : `<span class="tag" style="background:var(--red-dark);color:#fff;">⚠ Engin — anomalie(s)</span>`;
    }
    else if(tdue.due) badges+=`<span class="tag" style="background:var(--red-dark);color:#fff;">🔧 Engin en retard</span>`;

    html+=`<details class="emp-block" style="padding:0;">
      <summary style="cursor:pointer;padding:12px 14px;background:var(--paper);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;font-family:var(--font-head);font-size:15px;color:var(--navy);">
        <span>${escapeHtml(v.name)}</span><span style="display:flex;gap:6px;flex-wrap:wrap;">${badges}</span>
      </summary>
      <div class="emp-body">`;

    if(!hasActivity){
      html+=`<p style="font-size:12.5px;color:var(--muted);">Aucune vérification enregistrée pour cet engin le ${fmtDate(dateStr)}.</p>`;
    } else if(!hasMaterialActivity){
      html+=`<p style="font-size:12.5px;color:var(--muted);">Matériel non vérifié ce jour-là (seule la vérification engin a été faite — voir ci-dessous).</p>`;
    } else if(noDiscrepancy){
      html+=`<div class="comment-text" style="background:#e8f5ec;border-color:#b7dfc4;color:var(--green-dark);"><b>✅ Aucun écart constaté</b> — inventaire vérifié sans anomalie${closure.length?' ('+closure[closure.length-1].pct+'% conforme, par '+escapeHtml(closure[closure.length-1].checkedBy)+')':''}.</div>`;
    } else {
      if(!closure.length){
        html+=`<div class="comment-text" style="background:#eef4fb;border-color:#b8d0ef;color:var(--navy);"><b>🔓 Vérification en cours</b> — ${touchedCount} item(s) contrôlé(s) aujourd'hui, pas encore clôturée. Ce qui suit ne concerne que ce qui a été vérifié jusqu'ici, pas l'inventaire complet.</div>`;
      }
      if(anomalies.length){
        html+=`<div style="margin-top:4px;"><b style="font-size:12.5px;color:var(--red-dark);">⚠ Écarts constatés (${anomalies.length})</b><ul style="margin:4px 0 0;padding-left:18px;font-size:12px;">`;
        anomalies.forEach(c=>{
          const label = c.status ? (STATUS[c.status]?STATUS[c.status].label:c.status) : ('Non '+(c.lockLabel||'complet').toLowerCase());
          html+=`<li>${escapeHtml(c.emp)} — ${escapeHtml(c.name)} : <b>${label}</b>${c.checkedBy?' ('+escapeHtml(c.checkedBy)+')':''}${c.comment?' — 💬 '+escapeHtml(c.comment):''}</li>`;
        });
        html+=`</ul></div>`;
      }
      if(replaced.length){
        html+=`<div style="margin-top:10px;"><b style="font-size:12.5px;color:var(--green-dark);">🔁 Remplacés depuis la réserve (${replaced.length})</b><ul style="margin:4px 0 0;padding-left:18px;font-size:12px;">`;
        replaced.forEach(c=>{
          html+=`<li>${escapeHtml(c.emp)} — ${escapeHtml(c.name)}${c.checkedBy?' ('+escapeHtml(c.checkedBy)+')':''}${c.comment?' — 💬 '+escapeHtml(c.comment):''}</li>`;
        });
        html+=`</ul></div>`;
      }
    }
    if(closure.length){
      html+=`<p style="font-size:11.5px;color:var(--muted);">Clôturé par : <b>${escapeHtml(closure[closure.length-1].checkedBy)}</b> <button class="btn small ghost" data-add-checker-closure="${v.id}" style="margin-left:6px;">+ Ajouter un nom</button></p>`;
    }
    if(techDone){
      const techAnoms=techCheckAnomalies(v);
      html+=`<p style="font-size:12.5px;margin-top:10px;"><b>🔧 Vérification engin effectuée</b> — par ${escapeHtml(v.techCheck.verifiedBy||'Non renseigné')}${v.techCheck.commentaire?' — "'+escapeHtml(v.techCheck.commentaire)+'"':''} <button class="btn small ghost" data-add-checker-tech="${v.id}" style="margin-left:6px;">+ Ajouter un nom</button></p>`;
      if(techAnoms.length){
        html+=`<div class="comment-text" style="background:#fdecec;border-color:#f3b8b8;color:var(--red-dark);"><b>⚠ Point(s) signalé(s) sur l'engin :</b> ${techAnoms.map(escapeHtml).join(', ')} <button class="btn small primary" style="margin-left:6px;" data-goto-tech="${v.id}">🔧 Accéder à la vérification</button></div>`;
      }
    }
    html+=`<button class="btn ghost small" style="margin-top:10px;" data-view-full="${v.id}">Voir l'inventaire complet →</button>`;
    html+=`</div></details>`;
  });

  app.innerHTML=html;
  document.getElementById('backLink').addEventListener('click',()=>{currentView={type:'dashboard'};render();});
  document.getElementById('dailyDatePicker').addEventListener('change',e=>{currentView={type:'daily',date:e.target.value};render();});
  document.getElementById('printDailyBtn').addEventListener('click',()=>window.print());
  app.querySelectorAll('[data-view-full]').forEach(el=>el.addEventListener('click',()=>{currentView={type:'check',vehicleId:el.dataset.viewFull};render();}));
  app.querySelectorAll('[data-add-checker-closure]').forEach(el=>el.addEventListener('click',async()=>{
    const vh=state.vehicles.find(x=>x.id===el.dataset.addCheckerClosure); if(!vh)return;
    const name=prompt('Nom de l\'agent à ajouter à la vérification matériel de « '+vh.name+' » (déjà clôturée) :',''); if(!name||!name.trim())return;
    const hist=(vh.checkHistory||[]).filter(h=>h.date===dateStr);
    if(!hist.length)return;
    const last=hist[hist.length-1];
    last.checkedBy = last.checkedBy && last.checkedBy!=='Non renseigné' ? last.checkedBy+', '+name.trim() : name.trim();
    await saveState(); render();
  }));
  app.querySelectorAll('[data-add-checker-tech]').forEach(el=>el.addEventListener('click',async()=>{
    const vh=state.vehicles.find(x=>x.id===el.dataset.addCheckerTech); if(!vh)return;
    const name=prompt('Nom de l\'agent à ajouter à la vérification engin de « '+vh.name+' » :',''); if(!name||!name.trim())return;
    const cur=vh.techCheck.verifiedBy;
    vh.techCheck.verifiedBy = cur && cur!=='Non renseigné' ? cur+', '+name.trim() : name.trim();
