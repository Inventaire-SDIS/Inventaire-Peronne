/* ---- Fonctionnement hors-ligne : le Service Worker met l'application en cache pour qu'elle
   démarre même sans réseau (ex: garage, sous-sol). Les DONNÉES restent gérées par Firestore,
   qui possède son propre cache hors-ligne activé plus bas. ---- */
(function(){
  if(!('serviceWorker' in navigator)) return;
  const swCode=`
    const CACHE='inventaire-cis-v1';
    self.addEventListener('install',e=>{ self.skipWaiting(); });
    self.addEventListener('activate',e=>{ e.waitUntil(self.clients.claim()); });
    self.addEventListener('fetch',e=>{
      const req=e.request;
      if(req.method!=='GET') return;
      const url=new URL(req.url);
      // Jamais de cache pour Firestore/Google : les données doivent toujours venir du réseau
      // (Firestore gère lui-même son propre mode hors-ligne).
      if(url.hostname.includes('googleapis.com')||url.hostname.includes('gstatic.com')||url.hostname.includes('firebaseio.com')) return;
      e.respondWith(
        fetch(req).then(res=>{
          if(res && res.status===200 && (url.origin===location.origin || url.hostname.includes('cdnjs'))){
            const copy=res.clone();
            caches.open(CACHE).then(c=>c.put(req,copy)).catch(()=>{});
          }
          return res;
        }).catch(()=> caches.match(req).then(r=> r || caches.match('./')))
      );
    });
  `;
  const blob=new Blob([swCode],{type:'text/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(blob),{scope:'./'})
    .then(()=>console.log('[PWA] Mode hors-ligne actif : l\'application démarre même sans réseau.'))
    .catch(e=>console.log('[PWA] Service Worker non enregistré :',e));
})();

      },
      async delete(key, shared){
        if(!shared){ localStorage.removeItem('sp-local-'+key); return {key, deleted:true, shared:false}; }
        await db.collection(SHARED_COLLECTION).doc(key).delete();
        return {key, deleted:true, shared:true};
      },
      async list(prefix, shared){
        if(!shared){
          const keys=[];
          for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k && k.indexOf('sp-local-'+(prefix||''))===0) keys.push(k.replace('sp-local-','')); }
          return {keys, prefix, shared:false};
        }
        const snap = await db.collection(SHARED_COLLECTION).get();
        const keys = snap.docs.map(d=>d.id).filter(k=>!prefix || k.indexOf(prefix)===0);
        return {keys, prefix, shared:true};
      },
      async transact(key, updaterFn){
        // Lecture + écriture strictement atomiques côté serveur : si un autre appareil écrit entre
        // les deux, Firestore relance automatiquement updaterFn avec la toute dernière version —
        // aucune écriture concurrente ne peut donc jamais en écraser silencieusement une autre.
        const ref = db.collection(SHARED_COLLECTION).doc(key);
        return db.runTransaction(async tx=>{
          const doc = await tx.get(ref);
          const currentValue = doc.exists ? doc.data().value : null;
          const newValue = await updaterFn(currentValue);
          tx.set(ref, {value: newValue, updatedAt: Date.now()});
          return newValue;
        });
      }
    };
    console.log("[Firebase] Connecte : les donnees partagees sont maintenant synchronisees via Firestore, projet "+FIREBASE_CONFIG_PLACEHOLDER.projectId+".");
  }catch(e){
    console.error("[Firebase] Erreur d'initialisation, retour au stockage Claude par defaut :", e);
  }
})();
</script>

.voice-overlay > *{pointer-events:auto;}
.voice-overlay .vname{font-family:var(--font-head);font-size:13px;color:#fff;text-transform:uppercase;letter-spacing:1px;background:rgba(11,26,46,.85);padding:5px 12px;border-radius:14px;}
.voice-overlay .vitem{font-family:var(--font-head);font-size:20px;margin:12px 0 6px;max-width:600px;background:rgba(11,26,46,.85);padding:8px 16px;border-radius:8px;}
.voice-overlay .vhint{font-size:12px;color:#cfe0ec;margin-bottom:14px;background:rgba(11,26,46,.7);padding:5px 12px;border-radius:14px;}
.voice-mic{width:52px;height:52px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:12px;transition:transform .2s;box-shadow:0 2px 10px rgba(0,0,0,.4);}
.voice-mic.listening{animation:pulse 1.1s infinite;}
.voice-progress{font-family:var(--font-mono);font-size:11px;color:#fff;margin-top:6px;background:rgba(11,26,46,.75);padding:3px 10px;border-radius:12px;}
.voice-close{position:fixed;top:16px;right:20px;background:rgba(11,26,46,.85);color:#fff;font-size:20px;border-radius:50%;width:34px;height:34px;z-index:61;}
@keyframes pulse{0%{transform:scale(1);}50%{transform:scale(1.12);}100%{transform:scale(1);}}
@keyframes blinkAlert{0%,100%{opacity:1;}50%{opacity:.35;}}
.blink-alert{animation:blinkAlert 1.1s infinite;font-weight:700;}
.voice-comment-box{background:#fff;color:var(--ink);padding:16px;border-radius:6px;max-width:480px;width:100%;margin-top:10px;pointer-events:auto;}

/* Tech check form */
.tech-block{background:#fff;border:1px solid var(--line);padding:16px;margin-bottom:14px;}
.tech-block h4{font-family:var(--font-head);font-size:14px;color:var(--navy);margin:0 0 12px;text-transform:uppercase;letter-spacing:.5px;}
.tech-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;}
.tech-field label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.3px;}
.tech-field input,.tech-field select{width:100%;padding:8px 9px;border:1px solid var(--line);border-radius:3px;font-size:13px;}
.tech-check-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin-top:10px;}
.tech-check-item{font-size:12.5px;display:flex;gap:7px;align-items:center;}
.tech-slider{display:flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:12px;}
.tech-slider input[type=range]{flex:1;}
.tech-textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:3px;font-size:13px;font-family:var(--font-body);min-height:70px;resize:vertical;}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(15,34,55,.55);display:flex;align-items:flex-start;justify-content:center;z-index:65;padding:18px;overflow-y:auto;}
.modal{background:#fff;width:100%;max-width:440px;padding:22px;border-radius:4px;max-height:85vh;overflow-y:auto;margin-top:56px;margin-bottom:24px;}
.modal.wide{max-width:600px;}
.modal h3{font-family:var(--font-head);font-size:17px;color:var(--navy);margin:0 0 14px;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin-bottom:4px;}
.field input,.field select{width:100%;padding:8px 9px;border:1px solid var(--line);border-radius:3px;font-size:13px;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}
.qr-box{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 0;}
.qr-url{font-family:var(--font-mono);font-size:10px;color:var(--muted);word-break:break-all;text-align:center;}
.import-drop{border:2px dashed var(--line);border-radius:4px;padding:24px;text-align:center;color:var(--muted);font-size:12.5px;}

.loading-note{text-align:center;color:var(--muted);font-size:12px;padding:20px;}
@media print{
  details{display:block !important;}
  details:not([open]) > *:not(summary){display:block !important;}
  .topbar,.detail-actions,.card-actions,.mode-tabs,.back-link,.btn,
  .check-lock-btn,.comment-btn,.reorder-col,.del-btn,.field-inline,input,select,.gauge-row,.summary-strip,
  #expandAllBtn,#collapseAllBtn,.dash-header button{display:none !important;}
  .check-status-btn:not(.active),.status-btn:not(.active){display:none !important;}
  body{background:#fff;color:#000;}
  .emp-block,.card{border:1px solid #ccc !important;box-shadow:none !important;break-inside:avoid;}
}
@media (max-width:700px){
  .article-row{grid-template-columns:22px 1fr;}
  .status-buttons,.qty-col{grid-column:2;}
  .summary-strip{grid-template-columns:repeat(2,1fr);}
}
</style>
</head>

function performMaterialSoftReset(v){
  // Remet "à vérifier" tout ce qui était conforme — mais préserve intégralement les anomalies
  // (manquant/périmé/HS) déjà signalées, qui ne doivent jamais disparaître silencieusement.
  // Sacs/conteneurs plombés : ils restent plombés d'un cycle à l'autre (le nom et la date de la
  // dernière vérification restent affichés) — SAUF s'ils contiennent une bouteille ARI, auquel cas la
  // présence de la bouteille doit être revérifiée à chaque nouvel inventaire, donc on décoche.
  v.emplacements.forEach(emp=>{
    emp.articles.forEach(a=>{
      const hasChildren=isContainerArt(a);
      if(hasChildren){
        const hasAri=(a.sousArticles||[]).some(s=>s.regType==='ARI') || a.regType==='ARI';
        if(a.locked && hasAri){ a.locked=false; a.lastCheck=''; a.checkedBy=''; }
        // sinon (plombé, sans ARI) : on ne touche à rien, il reste plombé avec son nom/date d'origine.
      } else if(a.status==='ok'){
        a.status='verifier'; a.lastCheck=''; a.checkedBy='';
        if(a.regType==='O2'||a.regType==='ARI') a.pressureBar=''; // pression réelle à remesurer à chaque cycle
      }
      (a.sousArticles||[]).forEach(s=>{
        if(s.status==='ok'){
          s.status='verifier'; s.lastCheck=''; s.checkedBy='';
          if(s.regType==='O2'||s.regType==='ARI') s.pressureBar='';
        }
      });
    });
  });
}
function shiftedDailyKey(){
  // Pour les véhicules quotidiens, le "jour" de vérification bascule à 8h00 (heure locale) plutôt
  // qu'à minuit — un contrôle fait à 7h se rattache encore à la veille, pas à un nouveau cycle.
  const now=new Date();
  const shifted = now.getHours()<8 ? new Date(now.getFullYear(),now.getMonth(),now.getDate()-1) : new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const pad=n=>String(n).padStart(2,'0');
  return shifted.getFullYear()+'-'+pad(shifted.getMonth()+1)+'-'+pad(shifted.getDate());
}
function currentMaterialCycleKey(v){
  const freq=v.checkFrequency||'hebdomadaire';
  const today=todayStr();
  if(freq==='quotidien') return 'q:'+shiftedDailyKey();
  if(freq==='mensuel'){
    const occ=v.checkMonthlyOccurrence!==undefined?v.checkMonthlyOccurrence:'first';
    const wd=v.checkMonthlyWeekday!==undefined?v.checkMonthlyWeekday:0;
    return 'm:'+monthlyOccurrenceDate(today,occ,wd);
  }
  return 'w:'+mondayOfWeek(today);
}
function resetMaterialCheckIfNeeded(v){
  // La vérification matériel se réinitialise selon SON PROPRE cycle (quotidien = chaque jour à partir
  // de 8h00, hebdomadaire/mensuel = chaque semaine/mois) — mais seulement ce qui était "conforme" ou
  // "complet" repasse "à vérifier". Un manquant/périmé/HS resté non résolu N'EST JAMAIS effacé.
  const cycleKey=currentMaterialCycleKey(v);
  // CRUCIAL : si on a déjà traité ce cycle précis (qu'une remise à zéro ait eu lieu ou non), on ne
  // refait rien — sinon, tant que la vérification n'est pas clôturée, chaque contrôle périodique (toutes
  // les 5 min) effacerait à nouveau la progression du jour en cochant "conforme" → "à vérifier" en boucle,
  // y compris pendant qu'un agent est activement en train de cocher les items.
  if(v.lastMaterialResetCycle===cycleKey) return false;
  const freq=v.checkFrequency||'hebdomadaire';
  const today=todayStr();
  const hist=v.checkHistory||[];
  const last=hist.length?hist[hist.length-1]:null;
  let shouldReset=false;
  if(freq==='quotidien'){
    shouldReset = !!last && last.date<shiftedDailyKey();
  } else if(freq==='mensuel'){
    const occ=v.checkMonthlyOccurrence!==undefined?v.checkMonthlyOccurrence:'first';
    const wd=v.checkMonthlyWeekday!==undefined?v.checkMonthlyWeekday:0;
    const targetDate=monthlyOccurrenceDate(today,occ,wd);
    shouldReset = !!last && last.date<targetDate && today>=targetDate;
  } else {
    const monday=mondayOfWeek(today);
    shouldReset = !!last && last.date<monday;
  }
  v.lastMaterialResetCycle=cycleKey; // marque ce cycle comme traité, quoi qu'il arrive
  if(!shouldReset) return false;
  performMaterialSoftReset(v);
  return true;
}
async function maybeRestartOnReopen(v){
  // Signale aux autres appareils qu'un agent travaille sur cet engin, pour éviter que deux personnes
  // fassent le même inventaire en double sans le savoir. Le marqueur expire tout seul après 45 min.
  const others = v.activeChecker && (Date.now()-v.activeChecker.since < 45*60*1000) ? v.activeChecker : null;
  if(others && !readOnlySkip(v)){
    const mins=Math.round((Date.now()-others.since)/60000);
    if(!confirm('⚠ '+escapeHtml(others.name)+' a commencé une vérification de « '+v.name+' » il y a '+mins+' min.\n\nContinuer quand même ? (vous risquez de faire le travail en double)')){
      currentView={type:'dashboard'};
      return;
    }
  }
  // Si l'inventaire matériel du véhicule est déjà clôturé pour le cycle en cours (ex: déjà fait ce
  // matin), on DEMANDE avant de relancer une vérification fraîche — pour ne jamais remettre à zéro
  // un inventaire déjà clôturé sans confirmation explicite de l'agent. Refuser = simple consultation,
  // rien n'est modifié. Le pourcentage du tableau de bord ne bougera de toute façon qu'à la nouvelle clôture.
  if(readOnlySkip(v)) return;
  const due=checkDueInfo(v);
  if(!due.due && v.checkHistory && v.checkHistory.length){
    const already=confirm('« '+v.name+' » a déjà été vérifié pour cette période ('+checkDueInfo(v).label+').\n\nVeux-tu recommencer une nouvelle vérification complète ? (les éléments déjà confirmés repasseront "à vérifier" — les anomalies en cours restent affichées)\n\nAnnuler = juste consulter l\'inventaire tel quel, sans rien réinitialiser.');
    if(already){
      performMaterialSoftReset(v);
      v.lastMaterialResetCycle=currentMaterialCycleKey(v); // évite qu'un contrôle automatique ne refasse la même chose juste après
      await flushSave(); // immédiat : referme tout de suite la fenêtre de risque avec un autre appareil
    }
  }
}

function readOnlySkip(v){ return isVehicleReadOnlyForMe(v) || v.outOfService; }
function resetWeeklyTechCheckIfNeeded(v){
  // Les cases de la vérification engin se décochent automatiquement à chaque nouvelle semaine
  // (lundi) — l'agent doit revérifier activement et recocher, pas juste re-sauvegarder l'ancien état.
  const t=v.techCheck; if(!t || !t.lastCheck) return false;
  const lastMonday=mondayOfWeek(t.lastCheck);
  const curMonday=mondayOfWeek(todayStr());
  if(lastMonday<curMonday){
    t.huileOk=false; t.liquideOk=false; t.laveGlaceOk=false; t.adblueOk=false;
    t.essuieGlacesOk=false; t.pareBriseOk=false; t.retroOk=false;
    t.sig={lumineux:false,sonore:false,croisement:false,route:false,brouillard:false,stop:false};
    t.lastCheck=''; t.verifiedBy='';
    return true;
  }
  return false;
}

async function checkAndApplyScheduledResets(isInitialLoad){
  // Centralise la remise à zéro automatique (quotidienne à 8h, hebdomadaire/mensuelle selon la
  // fréquence) — appelée au chargement ET périodiquement pendant que l'appli reste ouverte, pour ne
  // pas dépendre d'un rechargement de page qui peut ne jamais arriver (mode hors-ligne, onglet laissé
  // ouvert toute la journée).
  let anyReset=false;
  state.vehicles.forEach(v=>{
    if(resetWeeklyTechCheckIfNeeded(v)) anyReset=true;
    if(resetMaterialCheckIfNeeded(v)) anyReset=true;
    ensureVehicleShape(v);
  });
  ensureReservesShape();
  if(isInitialLoad){
    // Référence de comparaison fixée maintenant, APRÈS la remise à zéro éventuelle — toute sauvegarde
    // ultérieure comparera l'état local à CE point de départ. Uniquement au chargement : la fixer à
    // nouveau lors d'un contrôle périodique effacerait la mémoire de modifications locales en attente
    // de synchronisation, qui sembleraient alors "déjà connues" et pourraient être perdues.
    lastSyncedState=JSON.parse(JSON.stringify(state));
  }
  if(anyReset && !loadFailed){
    // Immédiat (pas différé) pour que ce soit visible par tous les appareils au plus vite, et pour
    // refermer au plus tôt la fenêtre pendant laquelle un autre appareil pourrait travailler sur une
    // version pas encore réinitialisée.
    await flushSave();
    render(); // reflète tout de suite la remise à zéro à l'écran, même si personne n'a encore rien touché
  }
  return anyReset;
}
function migrateComment(obj){
  // Ancien format : un seul texte concaténé avec " — ". Nouveau format : liste de commentaires,
  // chacun effaçable individuellement. On convertit une fois, sans perdre l'historique existant.
  if(obj.comments===undefined){
    obj.comments=[];
    if(obj.comment){
      String(obj.comment).split(' — ').forEach(txt=>{ if(txt.trim()) obj.comments.push({id:uid('cm'),text:txt.trim(),date:''}); });
    }
  }
}
function addComment(obj,text){
  if(!obj.comments) obj.comments=[];
  if(text && text.trim()) obj.comments.push({id:uid('cm'),text:text.trim(),date:todayStr()});
}
function commentsTooltip(obj){ return (obj.comments||[]).map(c=>c.text).join(' — '); }
function renderCommentsBlock(obj,ctxKey){
  if(!obj.comments || !obj.comments.length) return '';
  return `<div class="comment-text">`+obj.comments.map(c=>
    `<div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start;padding:2px 0;">
      <span>💬 ${escapeHtml(c.text)}${c.date?` <span style="color:var(--muted);font-size:10px;">(${fmtDate(c.date)})</span>`:''}</span>
      <button class="del-btn" style="font-size:12px;padding:0 4px;flex-shrink:0;" data-del-comment="${ctxKey}:${c.id}">✕</button>
    </div>`
  ).join('')+`</div>`;
}

  if(!Array.isArray(state.repairers)) state.repairers=[];

  if(!Array.isArray(state.repairDestinations)) state.repairDestinations=['Atelier interne','Pôle logistique'];
  if(state.adminPasswordHash===undefined) state.adminPasswordHash='';
  if(!Array.isArray(state.centres)) state.centres=[];
  if(!Array.isArray(state.hospitalTracking)) state.hospitalTracking=[];
  if(!Array.isArray(state.garages)) state.garages=['Atelier départemental'];
  if(!Array.isArray(state.roadClosures)) state.roadClosures=[];
  if(!Array.isArray(state.consignes)) state.consignes=[];
  if(!Array.isArray(state.problemReports)) state.problemReports=[];
  if(!Array.isArray(state.ideas)) state.ideas=[];
  // Migration : un simple "traité/pas traité" devient un vrai statut à plusieurs étapes.
  [...state.problemReports,...state.ideas].forEach(r=>{
    if(!r.status) r.status = r.resolved ? 'mis_en_place' : 'nouveau';
  });
}

/* ---------- Protection admin (verrou sur la configuration) ---------- */
let adminUnlocked=false; // reinitialisé a chaque chargement de page, jamais persiste
function adminAccessible(){ return adminUnlocked || !state.adminPasswordHash; }
async function sha256Hex(text){
  const enc=new TextEncoder().encode(text);
  const buf=await crypto.subtle.digest('SHA-256',enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function requireAdmin(cb){
  if(adminUnlocked || !state.adminPasswordHash){ cb(); return; }
  openAdminUnlockModal(cb);
}
function openAdminUnlockModal(cb){
  const overlay=document.createElement('div'); overlay.className='overlay';
  overlay.innerHTML=`<div class="modal"><h3>🔒 Configuration protégée</h3>
    <p style="font-size:12.5px;color:var(--muted);">Un mot de passe administrateur est requis pour accéder à la configuration.</p>
    <div class="field"><label>Mot de passe</label><input type="password" id="adminPwInput"></div>
    <p id="adminPwError" style="color:var(--red-dark);font-size:12px;display:none;">Mot de passe incorrect.</p>
    <div class="modal-actions"><button class="btn ghost" id="adminPwCancel">Annuler</button><button class="btn primary" id="adminPwOk">Déverrouiller</button></div></div>`;
  document.body.appendChild(overlay);
  const inp=document.getElementById('adminPwInput');
  setTimeout(()=>inp.focus(),50);
  overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.remove();});
  document.getElementById('adminPwCancel').addEventListener('click',()=>overlay.remove());
  const submit=async()=>{
    const h=await sha256Hex(inp.value);
    if(h===state.adminPasswordHash){ adminUnlocked=true; overlay.remove(); cb(); }
    else{ document.getElementById('adminPwError').style.display='block'; inp.value=''; inp.focus(); }
  };
  document.getElementById('adminPwOk').addEventListener('click',submit);
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();submit();}});
}
function openAdminSettingsModal(){
  const hasPw=!!state.adminPasswordHash;
  const overlay=document.createElement('div'); overlay.className='overlay';
  overlay.innerHTML=`<div class="modal"><h3>🔒 Sécurité</h3>
    <p style="font-size:12.5px;color:var(--muted);">${hasPw?'La configuration (véhicules, emplacements, réserves...) est protégée par mot de passe.':'Aucun mot de passe défini — la configuration est libre pour tout le monde.'}</p>
    <p style="font-size:11px;color:var(--muted);">Attention : ce mot de passe protège contre les erreurs de manipulation, pas contre une personne cherchant vraiment à le contourner (le code est visible dans le navigateur). Pour une vraie sécurité sur la version serveur, il faudra aussi restreindre les règles Firestore.</p>
    ${hasPw?`<div class="field"><label>Mot de passe actuel</label><input type="password" id="curPw"></div>`:''}
    <div class="field"><label>${hasPw?'Nouveau mot de passe (laisser vide pour retirer la protection)':'Définir un mot de passe'}</label><input type="password" id="newPw"></div>
    <div class="modal-actions">
      ${adminUnlocked?'<button class="btn ghost" id="lockNowBtn">Verrouiller maintenant</button>':''}
      <button class="btn ghost" id="secClose">Fermer</button>
      <button class="btn primary" id="secSave">Enregistrer</button>
    </div></div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.remove();});
  document.getElementById('secClose').addEventListener('click',()=>overlay.remove());
  const lockBtn=document.getElementById('lockNowBtn');
  if(lockBtn) lockBtn.addEventListener('click',()=>{ adminUnlocked=false; document.body.classList.remove('admin-unlocked'); overlay.remove(); render(); alert('Configuration verrouillée.'); });
  document.getElementById('secSave').addEventListener('click',async()=>{
    if(hasPw){
      const cur=document.getElementById('curPw').value;
      const curHash=await sha256Hex(cur);
      if(curHash!==state.adminPasswordHash){ alert('Mot de passe actuel incorrect.'); return; }
    }
    const newPw=document.getElementById('newPw').value;
    state.adminPasswordHash = newPw ? await sha256Hex(newPw) : '';
    await saveState(); overlay.remove();
    updateSecurityIcon();
    alert(newPw?'Mot de passe enregistré.':'Protection retirée — la configuration est de nouveau libre.');
  });

async function importSeedCatalogue(){

async function loadState(){
  let res=null, callSucceeded=false;
  for(let attempt=0;attempt<3;attempt++){
    try{
      res=await window.storage.get(STORAGE_KEY,true);
      callSucceeded=true;
      break;
    }catch(e){
      console.error('Tentative de chargement '+(attempt+1)+' échouée :',e);
      if(attempt<2) await new Promise(r=>setTimeout(r,800)); // petite pause avant de retenter
    }
  }
  try{
    if(!callSucceeded){
      throw new Error('Aucune réponse après 3 tentatives');
    }
    if(res&&res.value){
      state=JSON.parse(res.value);
      // La référence de comparaison (lastSyncedState) sera fixée PLUS BAS, une fois la remise à zéro
      // automatique éventuelle appliquée — la capturer ici, avant, créait une faille : une sauvegarde
      // ultérieure pouvait comparer un état "après remise à zéro" à une référence "avant", les jugeait
      // différents, et une fusion malheureuse pouvait alors faire revenir en arrière un inventaire en
      // cours ailleurs. C'est le bug du 8h00 du matin.
    } else {
      // Réponse reçue mais vraiment vide (premier lancement) : on initialise avec l'exemple et on sauvegarde.
      state=defaultData(); await saveState();
    }
  }catch(e){
    // ERREUR DE LECTURE persistante — surtout NE JAMAIS écraser les données existantes avec
    // l'exemple par défaut dans ce cas : on ne sait pas si elles existent, on n'a juste pas réussi à
    // les récupérer. On affiche un état temporaire SANS le sauvegarder, et on prévient clairement.
    console.error('Erreur de chargement des données :', e);
    state=defaultData();
    loadFailed=true;
  }
  if(loadFailed){
    alert('⚠ Impossible de récupérer tes données enregistrées (problème de connexion). Ce que tu vois actuellement est temporaire et ne sera PAS sauvegardé. Recharge la page une fois la connexion rétablie avant de continuer à travailler — surtout ne rien modifier ici pour l\'instant.');
  }
  await checkAndApplyScheduledResets(true);
  if(state.centres.length===0){
    const found=new Set();
    state.vehicles.forEach(v=>{ if(v.cis) found.add(v.cis); });
    state.centres=Array.from(found);
  }
  try{
    const c=await window.storage.get(CHECKER_KEY,false);
    if(c&&c.value){
      try{ const parsed=JSON.parse(c.value); checkerNames=Array.isArray(parsed)?parsed:[String(parsed)]; }
      catch(e2){ checkerNames=c.value.trim()?[c.value.trim()]:[]; await saveCheckers(); } // ancien format (simple texte) -> on le convertit et on le réécrit
    } else checkerNames=[];
  }catch(e){checkerNames=[];}
  updateCheckerPill();
  try{
    const mc=await window.storage.get(MY_CENTRE_KEY,false);
    myCentre=mc&&mc.value?mc.value:'';
  }catch(e){myCentre='';}
  updateMyCentrePill();
  updateSecurityIcon();
  if(!loadFailed) maybeCreateDailyBackup(); // filet de sécurité, en tâche de fond, sans bloquer l'affichage
  // Si les notifications de consignes étaient déjà activées lors d'une session précédente, on
  // initialise le compteur de référence dès maintenant — sinon aucune notification ne se
  // déclencherait tant que le réglage n'est pas re-basculé manuellement.
  if(localStorage.getItem('sp-notif-consignes')==='1'){
    lastKnownConsigneCount=(state.consignes||[]).filter(c=>!c.done).length;
  }
  const params=new URLSearchParams(window.location.search);
  const vId=params.get('v'),mode=params.get('mode');
  if(vId&&state.vehicles.find(v=>v.id===vId)){currentView={type:mode==='config'?'config':'check',vehicleId:vId};}
  render();
}
const DAILY_BACKUP_PREFIX='sp-inv-daily-backup-';
const DAILY_BACKUP_KEEP_DAYS=30;
async function maybeCreateDailyBackup(){
  // Filet de sécurité indépendant des données actives : une copie complète par jour, conservée
  // DAILY_BACKUP_KEEP_DAYS jours, pour pouvoir revenir en arrière en cas de problème (bug, erreur
  // de manipulation...) sans dépendre uniquement d'une sauvegarde manuelle faite au bon moment.
  if(!state || !Array.isArray(state.vehicles)) return;
  const key=DAILY_BACKUP_PREFIX+todayStr();
  try{
    const existing=await window.storage.get(key,true);
    if(existing && existing.value) return; // déjà fait aujourd'hui
  }catch(e){ return; } // en cas de doute sur l'état existant, on ne force pas une écriture
  try{
    await window.storage.set(key,JSON.stringify(state),true);
    pruneOldDailyBackups();
  }catch(e){ console.error('Sauvegarde quotidienne automatique échouée :',e); }
}
async function pruneOldDailyBackups(){
  try{
    const res=await window.storage.list(DAILY_BACKUP_PREFIX,true);
    if(!res || !res.keys) return;
    const dates=res.keys.map(k=>k.replace(DAILY_BACKUP_PREFIX,'')).sort();
    const cutoffIdx=dates.length-DAILY_BACKUP_KEEP_DAYS;
    if(cutoffIdx<=0) return;
    const toDelete=dates.slice(0,cutoffIdx);
    for(const d of toDelete){ try{ await window.storage.delete(DAILY_BACKUP_PREFIX+d,true); }catch(e){} }
  }catch(e){ console.error('Nettoyage des anciennes sauvegardes échoué :',e); }
}

let syncStatus='ok'; // 'ok' | 'saving' | 'error'
let syncRetryTimer=null;
function updateSyncIndicator(){
  const el=document.getElementById('syncStatus'); if(!el)return;
  if(syncStatus==='pending'){ el.textContent='⏳ Modifs en attente…'; el.className='sync-status pending'; }
  else if(syncStatus==='saving'){ el.textContent='💾 Enregistrement…'; el.className='sync-status saving'; }
  else if(syncStatus==='error'){ el.textContent='⚠ Non synchronisé — nouvelle tentative…'; el.className='sync-status error'; }
  else { el.textContent='💾 Enregistré'; el.className='sync-status ok'; }
}
let lastSyncedState=null; // dernière version connue comme synchronisée (chargée ou sauvegardée) — sert de référence pour détecter ce qui a vraiment changé localement
function mergeArraysByIdDiff(localArr,baselineArr,remoteArr){
  // Pour chaque élément déjà présent côté serveur : si son contenu local est identique à la dernière
  // version connue (le "baseline"), il n'a pas été touché ici — on garde la version DISTANTE (plus
  // fraîche, potentiellement modifiée par un autre agent). S'il diffère du baseline, il a été modifié
  // ici — on garde la version LOCALE. Ça évite qu'une sauvegarde depuis un écran quelconque n'écrase
  // le travail d'un autre agent sur un élément qu'on n'a jamais touché.
  // Suppression : si un élément était dans NOTRE référence (baseline) mais a disparu localement, c'est
  // qu'on l'a supprimé volontairement ici — on respecte cette suppression, il ne doit pas revenir.
  // S'il n'était PAS dans notre référence et est absent localement, c'est qu'il a été créé ailleurs
  // entre-temps : on le garde, ce n'est pas une suppression de notre part.
  if(!Array.isArray(remoteArr)) remoteArr=[];
  if(!Array.isArray(localArr)) localArr=[];
  if(!Array.isArray(baselineArr)) baselineArr=[];
  const baselineById={}; baselineArr.forEach(x=>{ if(x&&x.id) baselineById[x.id]=x; });
  const localById={}; localArr.forEach(x=>{ if(x&&x.id) localById[x.id]=x; });
  const result=[];
  remoteArr.forEach(r=>{
    if(!r||!r.id){ result.push(r); return; }
    const loc=localById[r.id];
    const base=baselineById[r.id];
    if(loc===undefined){
      if(base!==undefined) return; // supprimé ici volontairement → on ne le remet pas
      result.push(r); // créé ailleurs entre-temps → on le garde
      return;
    }
    if(JSON.stringify(base||null)===JSON.stringify(loc)) result.push(r); // pas modifié ici → garder le distant
    else result.push(loc); // modifié ici → garder notre version
  });
  const remoteIds=new Set(remoteArr.filter(r=>r&&r.id).map(r=>r.id));
  localArr.forEach(l=>{ if(l&&l.id&&!remoteIds.has(l.id)) result.push(l); }); // créations locales absentes du distant
  return result;
}
function mergeStateForSave(remoteState){
  // Fusionne l'état local dans la dernière version distante connue : on ne garde du local que ce qui
  // a vraiment changé depuis la dernière synchro (comparé au baseline), le reste vient du distant.
  const baseline=lastSyncedState||remoteState;
  remoteState.vehicles=mergeArraysByIdDiff(state.vehicles,baseline.vehicles,remoteState.vehicles);
  if(remoteState.reserves && state.reserves){
    Object.keys(RESERVE_CATS).forEach(cat=>{
      remoteState.reserves[cat]=mergeArraysByIdDiff((state.reserves||{})[cat],(baseline.reserves||{})[cat],remoteState.reserves[cat]);
    });
  }
  remoteState.repairs=mergeArraysByIdDiff(state.repairs,baseline.repairs,remoteState.repairs);
  remoteState.hospitalTracking=mergeArraysByIdDiff(state.hospitalTracking,baseline.hospitalTracking,remoteState.hospitalTracking);
  remoteState.roadClosures=mergeArraysByIdDiff(state.roadClosures,baseline.roadClosures,remoteState.roadClosures);
  remoteState.consignes=mergeArraysByIdDiff(state.consignes,baseline.consignes,remoteState.consignes);
  remoteState.problemReports=mergeArraysByIdDiff(state.problemReports,baseline.problemReports,remoteState.problemReports);
  remoteState.ideas=mergeArraysByIdDiff(state.ideas,baseline.ideas,remoteState.ideas);
  ['adminPasswordHash','garages','hospitals','hospitalServices','repairers','repairDestinations','centres'].forEach(k=>{
    if(JSON.stringify(state[k])!==JSON.stringify(baseline[k])) remoteState[k]=state[k];
  });
  return remoteState;
}
async function doActualSave(){
  syncStatus='saving'; updateSyncIndicator();
  try{
    if(window.storage.transact){
      // Transaction atomique côté serveur : lecture + fusion + écriture en une seule opération que
      // Firestore relance automatiquement si un autre appareil a écrit entre-temps — élimine
      // complètement le risque qu'une sauvegarde en écrase une autre, même en cas d'écritures
      // simultanées venant de plusieurs agents à la même seconde.
      const finalValue=await window.storage.transact(STORAGE_KEY, async(currentValue)=>{
        const remoteState = currentValue ? JSON.parse(currentValue) : null;
        const merged = remoteState ? mergeStateForSave(remoteState) : state;
        return JSON.stringify(merged);
      });
      state=JSON.parse(finalValue);
    } else {
      // Stockage sans transaction disponible (ex: mode sans Firebase) : on retombe sur la fusion
      // manuelle lecture-puis-écriture, moins robuste en cas de forte concurrence mais fonctionnelle.
      try{
        const fresh=await window.storage.get(STORAGE_KEY,true);
        if(fresh && fresh.value){
          const remoteState=JSON.parse(fresh.value);
          if(remoteState) state=mergeStateForSave(remoteState);
        }
      }catch(e){ console.error('Fusion avant sauvegarde impossible, on sauvegarde quand même la copie locale :',e); }
      await window.storage.set(STORAGE_KEY,JSON.stringify(state),true);
    }
    lastSyncedState=JSON.parse(JSON.stringify(state));
    // IMPORTANT : la sauvegarde vient de remplacer entièrement les objets en mémoire par une copie
    // fraîche. Sans ce ré-affichage, l'écran et ses boutons resteraient accrochés à l'ancienne copie
    // (désormais orpheline) — toute action suivante (ex: ajouter un 2e emplacement) modifierait alors
    // une copie fantôme jamais sauvegardée. render() est sans danger ici : il préserve le défilement
    // et le champ en cours de saisie sur la même vue.
    render();
    syncStatus='ok'; updateSyncIndicator();
    if(syncRetryTimer){ clearTimeout(syncRetryTimer); syncRetryTimer=null; }
  }catch(e){
    console.error(e);
    syncStatus='error'; updateSyncIndicator();
    // Nouvelle tentative automatique tant que l'erreur persiste — la dernière version de "state" en
    // mémoire est toujours renvoyée, donc rien n'est perdu tant que l'onglet reste ouvert.
    if(!syncRetryTimer){ syncRetryTimer=setTimeout(()=>{ syncRetryTimer=null; flushSave(); },5000); }
  }
}
// Sauvegarde différée : on regroupe les modifications rapprochées en une seule écriture réseau,
// plutôt que de solliciter le serveur à chaque clic — plus fluide, moins de trafic, et moins
// d'occasions de collision entre plusieurs agents. Jamais plus de SAVE_MAX_WAIT_MS sans synchroniser,
// et synchronisation immédiate forcée aux moments clés (clôture, changement d'écran, fermeture).
const SAVE_DEBOUNCE_MS=6000;
const SAVE_MAX_WAIT_MS=45000;
let pendingSaveTimer=null;
let pendingSaveMaxTimer=null;
let pendingSavePromise=null;
function scheduleSave(){
  syncStatus='pending'; updateSyncIndicator();
  if(pendingSaveTimer) clearTimeout(pendingSaveTimer);
  pendingSaveTimer=setTimeout(flushSave,SAVE_DEBOUNCE_MS);
  if(!pendingSaveMaxTimer) pendingSaveMaxTimer=setTimeout(flushSave,SAVE_MAX_WAIT_MS);
}
async function flushSave(){
  if(pendingSaveTimer){clearTimeout(pendingSaveTimer);pendingSaveTimer=null;}
  if(pendingSaveMaxTimer){clearTimeout(pendingSaveMaxTimer);pendingSaveMaxTimer=null;}
  if(!pendingSavePromise) pendingSavePromise=doActualSave().finally(()=>{pendingSavePromise=null;});
  return pendingSavePromise;
}
async function saveState(){
  scheduleSave();
}
window.addEventListener('online',()=>{ if(syncStatus==='error') flushSave(); });
window.addEventListener('beforeunload',()=>{ if(pendingSaveTimer||pendingSaveMaxTimer) flushSave(); });
document.addEventListener('visibilitychange',()=>{ if(document.hidden && (pendingSaveTimer||pendingSaveMaxTimer)) flushSave(); });

// Gestion générique des menus "⋯ Plus" contextuels (dashboard, vérification) : un seul écouteur
// global, fonctionne quel que soit le nombre de re-rendus de la page.
document.addEventListener('click',e=>{
  const toggle=e.target.closest('.dropdown-toggle');
  if(toggle){
    const menu=toggle.closest('.actions-dropdown');
    const wasOpen=menu.classList.contains('open');
    document.querySelectorAll('.actions-dropdown.open').forEach(m=>m.classList.remove('open'));
    if(!wasOpen) menu.classList.add('open');
    return;
  }
  if(!e.target.closest('.dropdown-panel') && !e.target.closest('.dropdown-toggle')){
    // Ferme aussi bien un clic totalement extérieur qu'un clic sur le fond assombri du tiroir mobile
    // (qui appartient techniquement à .actions-dropdown via ::before, donc pas détecté par closest ci-dessus).
    document.querySelectorAll('.actions-dropdown.open').forEach(m=>m.classList.remove('open'));
  }
  // Retour au tableau de bord : on force la synchronisation immédiate de ce qui était en attente,
  // plutôt que de laisser ça traîner pendant qu'un autre véhicule est ouvert.
  if(e.target.closest('#backLink') && (pendingSaveTimer||pendingSaveMaxTimer)){ flushSave(); }
});

/* ---------- Stats ---------- */
function leafStatus(article){return article.locked?'ok':article.status;}
function isContainerArt(a){
  // Décidé indépendamment du contenu du tableau sousArticles : décocher "conteneur" ne doit
  // JAMAIS effacer les sous-articles existants, juste changer la façon dont l'article est traité/affiché.
  return a.isContainer!==undefined ? a.isContainer : !!(a.sousArticles && a.sousArticles.length);
}
function articleAllStatuses(article){
  if(isContainerArt(article) && article.sousArticles && article.sousArticles.length){
    if(article.locked) return article.sousArticles.map(()=>'ok');
    return article.sousArticles.map(s=>s.status);
  }
  return [leafStatus(article)];
}
function isSoonOrOverdue(dateStr){ // returns 'overdue' | 'soon' | null
  if(!dateStr) return null;
  const d=daysUntil(dateStr);
  if(d<0) return 'overdue';
  if(d<30) return 'soon';
  return null;
}
function empStats(emp){
  let total=0,ok=0,verifier=0,manquant=0,perime=0,hs=0,soon=0,overdue=0;
  emp.articles.forEach(a=>{
    const statuses=articleAllStatuses(a);
    statuses.forEach(s=>{total++;if(s==='ok')ok++;else if(s==='verifier')verifier++;else if(s==='manquant')manquant++;else if(s==='perime')perime++;else if(s==='hs')hs++;});
    const r1=isSoonOrOverdue(a.regDueDate); if(r1==='soon')soon++; else if(r1==='overdue')overdue++;
    const r2=isSoonOrOverdue(a.expiry); if(r2==='soon')soon++; else if(r2==='overdue')overdue++;
    (a.sousArticles||[]).forEach(s=>{const r3=isSoonOrOverdue(s.expiry); if(r3==='soon')soon++; else if(r3==='overdue')overdue++;});
  });
  const pct=total?Math.round((ok/total)*100):100;
  let overall='ok'; if(manquant||perime||hs)overall='bad'; else if(verifier)overall='warn';
  return {total,ok,verifier,manquant,perime,hs,pct,overall,soon,overdue};
}
function vehicleStats(v){
  let total=0,ok=0,verifier=0,manquant=0,perime=0,hs=0,soon=0,overdue=0;
  v.emplacements.forEach(e=>{const s=empStats(e);total+=s.total;ok+=s.ok;verifier+=s.verifier;manquant+=s.manquant;perime+=s.perime;hs+=s.hs;soon+=s.soon;overdue+=s.overdue;});
  const pct=total?Math.round((ok/total)*100):100;
  let overall='ok'; if(manquant||perime||hs)overall='bad'; else if(verifier)overall='warn';
  return {total,ok,verifier,manquant,perime,hs,pct,overall,soon,overdue};
}
function displayedVehicleStats(v){
  // Le tableau de bord affiche le résultat de la DERNIÈRE clôture, pas l'état en cours de retouche —
  // pour qu'une réouverture "recommencer ce soir" ne fasse pas chuter l'affichage avant la nouvelle validation.
  const hist=v.checkHistory||[];
  const live=vehicleStats(v);
  if(hist.length){
    const last=hist[hist.length-1];
    return Object.assign({},live,{pct:last.pct, overall:last.overall||(last.pct===100?'ok':last.pct>=60?'warn':'bad')});
  }
  return live;
}
function gaugeColor(pct){if(pct>=90)return'var(--green)';if(pct>=60)return'var(--amber)';return'var(--red)';}
function vehicleGasTotals(v){
  let o2=0,hasO2=false,ari=0,hasAri=false;
  v.emplacements.forEach(e=>e.articles.forEach(a=>{
    if(a.regType==='O2'){ hasO2=true; if(a.volumeL&&a.pressureBar) o2+=parseFloat(a.volumeL)*parseFloat(a.pressureBar)*(a.qty||1); }
    if(a.regType==='ARI'){ hasAri=true; if(a.volumeL&&a.pressureBar) ari+=parseFloat(a.volumeL)*parseFloat(a.pressureBar)*(a.qty||1); }
  }));
  return {o2:hasO2?Math.round(o2):null, ari:hasAri?Math.round(ari):null};
}

/* ---------- Render dispatch ---------- */
let lastRenderedViewKey=null;
function render(){
  const key=currentView.type+':'+(currentView.vehicleId||currentView.cat||currentView.date||'');
  const sameView = (key===lastRenderedViewKey);
  // Sur un re-affichage de la MÊME vue (ex: on vient de cocher un item, ou une sauvegarde en arrière-
  // plan vient de rafraîchir les données), on conserve la position de défilement ET le champ en cours
  // de saisie — sinon la page "saute" en haut et on peut perdre du texte en train d'être tapé.
  const scrollY = sameView ? window.scrollY : 0;
  const activeEl = document.activeElement;
  // Préservation générique par id (plutôt qu'une liste fermée de champs) : couvre aussi bien la
  // pression d'une bouteille en vérification que le nom d'un nouvel emplacement en Configuration.
  const activeId = sameView && activeEl && activeEl.id ? activeEl.id : null;
  const activeDataAttrs = sameView && activeEl && activeEl.dataset ? Object.assign({},activeEl.dataset) : null;
  const activeTag = activeEl ? activeEl.tagName : null;
  const activeSelStart = (activeId||activeDataAttrs) && activeEl.selectionStart!==undefined ? activeEl.selectionStart : null;
  const activeValue = (activeId||activeDataAttrs) && 'value' in activeEl ? activeEl.value : null;
  if(!sameView){ window.scrollTo(0,0); lastRenderedViewKey=key; }
  if(currentView.type==='dashboard')renderDashboard();
  else if(currentView.type==='config')renderConfig(currentView.vehicleId);
  else if(currentView.type==='check')renderCheck(currentView.vehicleId);
  else if(currentView.type==='tech')renderTech(currentView.vehicleId);
  else if(currentView.type==='reserve')renderReserve(currentView.cat,currentView.search,currentView.sort);
  else if(currentView.type==='daily')renderDaily(currentView.date);
  else if(currentView.type==='repairs')renderRepairs();
  else if(currentView.type==='hospitalTracking')renderHospitalTracking();
  else if(currentView.type==='help')renderHelp(currentView.tab);
  else if(currentView.type==='feedback')renderFeedback(currentView.search);
  if(sameView){
    window.scrollTo(0,scrollY);
    let el=null;
    if(activeId && (activeTag==='INPUT'||activeTag==='TEXTAREA')) el=document.getElementById(activeId);
    else if(activeDataAttrs && Object.keys(activeDataAttrs).length){
      const firstKey=Object.keys(activeDataAttrs)[0];
      const attrName='data-'+firstKey.replace(/[A-Z]/g,m=>'-'+m.toLowerCase());
      el=document.querySelector(`[${attrName}="${activeDataAttrs[firstKey]}"]`);
    }
    if(el && (el.tagName==='INPUT'||el.tagName==='TEXTAREA')){
      // On ne redonne le focus que si le champ n'a pas déjà été recréé vide par le re-rendu (cas d'un
      // champ d'ajout qui se vide après validation) — sinon on écraserait une valeur déjà traitée.
      if(activeValue && el.value==='') el.value=activeValue;
      el.focus();
      if(activeSelStart!==null && el.setSelectionRange){ try{ el.setSelectionRange(activeSelStart,activeSelStart); }catch(e){} }
    }
  }
}
const APP_VERSION='1.39.2'; // à incrémenter à chaque modification livrée
const WEEKDAY_LABELS=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
function weekdayIndex(dateStr){ const d=new Date(dateStr); return (d.getDay()+6)%7; } // 0=Lundi ... 6=Dimanche
function mondayOfWeek(dateStr){
  const d=new Date(dateStr);
  const idx=(d.getDay()+6)%7; // 0=Lundi
  d.setDate(d.getDate()-idx);
  return d.toISOString().slice(0,10);
}
function checkDueInfo(v){
  const hist=v.checkHistory||[];
  const last=hist.length?hist[hist.length-1]:null;
  const freq=v.checkFrequency||'hebdomadaire';
  const today=todayStr();
  if(freq==='quotidien'){
    if(!last) return {due:true,label:'Jamais vérifié',lastDate:null};
    const days=Math.floor((new Date(today)-new Date(last.date))/(1000*60*60*24));
    return {due:days>=1,label: days<=0?'Vérifié aujourd\'hui':days+' jour(s) depuis la dernière vérif.',lastDate:last.date};
  }
  if(freq==='mensuel'){
    const occ=v.checkMonthlyOccurrence!==undefined?v.checkMonthlyOccurrence:'first';
    const wd=v.checkMonthlyWeekday!==undefined?v.checkMonthlyWeekday:0;
    const targetDate=monthlyOccurrenceDate(today,occ,wd);
    if(today<targetDate){
      return {due:false,label:'Prévu le '+fmtDate(targetDate)+' ('+MONTHLY_OCC_LABELS[occ]+' '+WEEKDAY_LABELS[wd]+' du mois)',lastDate:last?last.date:null};
    }
    const doneSince=last && last.date>=targetDate;
    if(doneSince) return {due:false,label:'Vérifié le '+fmtDate(last.date),lastDate:last.date};
    return {due:true,label: last?('Non fait depuis le '+fmtDate(targetDate)):'Jamais vérifié',lastDate:last?last.date:null};
  }
  // Hebdomadaire : due si aucune vérification n'a eu lieu CETTE semaine (lundi-dimanche) ET que le jour
  // programmé est déjà arrivé (pas de rappel avant le jour prévu).
  const monday=mondayOfWeek(today);
  const doneThisWeek=hist.filter(h=>h.date>=monday).sort((a,b)=>a.date<b.date?1:-1)[0];
  const scheduledIdx=v.checkWeekday!==undefined?v.checkWeekday:0; // défaut lundi
  const todayIdx=weekdayIndex(today);
  if(doneThisWeek){
    return {due:false,label:'Vérifié cette semaine ('+fmtDate(doneThisWeek.date)+')',lastDate:doneThisWeek.date};
  }
  if(todayIdx>=scheduledIdx){
    return {due:true,label: last?('Non fait cette semaine — prévu '+WEEKDAY_LABELS[scheduledIdx]):'Jamais vérifié',lastDate:last?last.date:null};
  }
  return {due:false,label:'À faire '+WEEKDAY_LABELS[scheduledIdx]+' cette semaine',lastDate:last?last.date:null};
}
function techScheduleColor(v){
  if(v.hasEngine===false) return 'grey';
  const info=techDueInfo(v);
  if(!info.due) return v.techCheck&&v.techCheck.lastCheck ? 'green' : 'grey';
  return isTechCheckDayToday(v) ? 'orange' : 'red';
}
function verificationScheduleColor(v){
  // Orange = à vérifier aujourd'hui · Vert = déjà vérifié pour ce cycle · Rouge = en retard sur la
  // date prévue · Gris = vérification prévue un autre jour (pas encore dû).
  const due=checkDueInfo(v);
  const today=todayStr();
  const freq=v.checkFrequency||'hebdomadaire';
  if(!due.due) return due.label.startsWith('Vérifié')?'green':'grey';
  if(freq==='quotidien') return 'orange'; // pour un quotidien, "dû" = "dû aujourd'hui" par définition
  if(freq==='hebdomadaire'){
    const scheduledIdx=v.checkWeekday!==undefined?v.checkWeekday:0;
    return weekdayIndex(today)===scheduledIdx ? 'orange' : 'red';
  }
  if(freq==='mensuel'){
    const occ=v.checkMonthlyOccurrence!==undefined?v.checkMonthlyOccurrence:'first';
    const wd=v.checkMonthlyWeekday!==undefined?v.checkMonthlyWeekday:0;
    const targetDate=monthlyOccurrenceDate(today,occ,wd);
    return today===targetDate ? 'orange' : 'red';
  }
  return 'red';
}
function renderGauge(value,threshold,idPrefix){
  value=Math.max(0,Math.min(100,value||0));
  threshold=threshold||25;
  const belowThreshold=value<=threshold;
  const fillColor=value<=10?'var(--red-dark)':belowThreshold?'var(--red)':(value<=50?'var(--amber)':'var(--green)');
  return `<div style="position:relative;">
    <div style="position:relative;height:16px;border-radius:8px;overflow:hidden;background:linear-gradient(to right, #f3c9c9 0%, #f3c9c9 10%, #e6e9ec 10%, #e6e9ec 100%);border:1px solid var(--line);">
      <div style="position:absolute;top:0;left:0;height:100%;width:${value}%;background:${fillColor};transition:width .2s;"></div>
      <div style="position:absolute;left:25%;top:0;bottom:0;width:1px;background:rgba(0,0,0,.28);"></div>
      <div style="position:absolute;left:50%;top:0;bottom:0;width:1px;background:rgba(0,0,0,.28);"></div>
      <div style="position:absolute;left:75%;top:0;bottom:0;width:1px;background:rgba(0,0,0,.28);"></div>
      ${threshold>10?`<div style="position:absolute;left:${threshold}%;top:-3px;bottom:-3px;width:2px;background:var(--navy);"></div>`:''}
    </div>
    <div style="display:flex;justify-content:space-between;font-size:9.5px;color:var(--muted);margin-top:2px;"><span>0</span><span>25</span><span>50</span><span>75</span><span>100</span></div>
    ${belowThreshold?`<div style="font-size:11px;color:var(--red-dark);font-weight:700;margin-top:2px;">⚠ Sous le seuil mini (${threshold}%)</div>`:''}
  </div>`;
}
function wrongLocationCount(v){

  v.emplacements.forEach(e=>e.articles.forEach(a=>{
    if(a.wrongLocation)n++;
    (a.sousArticles||[]).forEach(s=>{if(s.wrongLocation)n++;});

function techCheckAnomalies(v){
  if(v.hasEngine===false) return [];
  const t=v.techCheck; if(!t || !t.lastCheck) return [];
  const labels=[];
  if(!t.huileOk) labels.push('Niveau d\'huile');
  if(!t.liquideOk) labels.push('Liquide de refroidissement');
  if(!t.laveGlaceOk) labels.push('Lave-glace');
  if(v.hasAdblue!==false && !t.adblueOk) labels.push('AdBlue (voyant)');
  if(!t.essuieGlacesOk) labels.push('Essuie-glaces');
  if(!t.pareBriseOk) labels.push('Pare-brise');
  if(!t.retroOk) labels.push('Rétroviseurs');
  if(t.sig){
    if(!t.sig.lumineux) labels.push('Avertisseur lumineux');
    if(!t.sig.sonore) labels.push('Avertisseur sonore');
    if(!t.sig.croisement) labels.push('Feux de croisement');
    if(!t.sig.route) labels.push('Feux de route');
    if(!t.sig.brouillard) labels.push('Feux de brouillard');
    if(!t.sig.stop) labels.push('Feux STOP');
  }
  const today=todayStr();
  if(t.carburant<(v.fuelMinThreshold!==undefined?v.fuelMinThreshold:75)) labels.push('Carburant bas ('+t.carburant+'%)');
  if(v.hasAdblue!==false && t.adblue<(v.adblueMinThreshold!==undefined?v.adblueMinThreshold:10)) labels.push('AdBlue bas ('+t.adblue+'%)');
  if(v.hasEmulseur && (t.emulseur||0)<(v.emulseurMinThreshold!==undefined?v.emulseurMinThreshold:98)) labels.push('Émulseur bas ('+(t.emulseur||0)+'%)');
  if(v.hasAdditif && (t.additif||0)<(v.additifMinThreshold!==undefined?v.additifMinThreshold:98)) labels.push('Additif bas ('+(t.additif||0)+'%)');
  if(t.ctDate && t.ctDate<today) labels.push('Contrôle technique dépassé');
  if(t.vidangeDate && t.vidangeDate<today) labels.push('Vidange/entretien dépassé');
  return labels;
}
function techOverallOk(v){
  return v.techCheck && v.techCheck.lastCheck && techCheckAnomalies(v).length===0;
}
function isTechCheckDayToday(v){
  if(v.hasEngine===false) return false;
  const freq=v.techCheckFrequency||'hebdomadaire';
  const today=todayStr();
  if(freq==='hebdomadaire') return weekdayIndex(today)===(v.techCheckWeekday!==undefined?v.techCheckWeekday:0);
  if(freq==='mensuel'){
    const occ=v.techCheckMonthlyOccurrence!==undefined?v.techCheckMonthlyOccurrence:'first';
    const wd=v.techCheckMonthlyWeekday!==undefined?v.techCheckMonthlyWeekday:0;
    return monthlyOccurrenceDate(today,occ,wd)===today;
  }
  return false;
}
function techDueInfo(v){
  if(v.hasEngine===false) return {due:false,label:'Non motorisé — pas de vérification engin',lastDate:null};
  const t=v.techCheck||{};
  const freq=v.techCheckFrequency||'hebdomadaire';
  const last=t.lastCheck;
  const today=todayStr();
  if(freq==='mensuel'){
    const occ=v.techCheckMonthlyOccurrence!==undefined?v.techCheckMonthlyOccurrence:'first';
    const wd=v.techCheckMonthlyWeekday!==undefined?v.techCheckMonthlyWeekday:0;
    const targetDate=monthlyOccurrenceDate(today,occ,wd); // date prévue ce mois-ci (AAAA-MM-JJ)
    if(today<targetDate){
      return {due:false,label:'Prévu le '+fmtDate(targetDate)+' ('+MONTHLY_OCC_LABELS[occ]+' '+WEEKDAY_LABELS[wd]+' du mois)',lastDate:last||null};
    }
    // La date prévue de ce mois est passée ou aujourd'hui : due si pas encore fait depuis cette date.
    const doneSince=last && last>=targetDate;
    if(doneSince) return {due:false,label:'Vérifié le '+fmtDate(last),lastDate:last};
    return {due:true,label: last?('Non fait depuis le '+fmtDate(targetDate)):'Jamais vérifié',lastDate:last||null};
  }
  // Hebdomadaire : due si aucune vérification n'a eu lieu cette semaine ET que le jour programmé est arrivé.
  const monday=mondayOfWeek(today);
  const scheduledIdx=v.techCheckWeekday!==undefined?v.techCheckWeekday:0;
  const todayIdx=weekdayIndex(today);
  const doneThisWeek=last && last>=monday;
  if(doneThisWeek) return {due:false,label:'Vérifié cette semaine ('+fmtDate(last)+')',lastDate:last};
  if(todayIdx>=scheduledIdx) return {due:true,label: last?('Non fait cette semaine — prévu '+WEEKDAY_LABELS[scheduledIdx]):'Jamais vérifié',lastDate:last||null};
  return {due:false,label:'À faire '+WEEKDAY_LABELS[scheduledIdx]+' cette semaine',lastDate:last||null};
}
const MONTHLY_OCC_LABELS={first:'1er',second:'2e',third:'3e',fourth:'4e',last:'dernier'};
function monthlyOccurrenceDate(refDateStr,occurrence,weekday){
  // Renvoie la date (AAAA-MM-JJ) du N-ième [jour de semaine] du mois de refDateStr. weekday: 0=Lundi..6=Dimanche.
  const ref=new Date(refDateStr+'T00:00:00');
  const year=ref.getFullYear(), month=ref.getMonth();
  if(occurrence==='last'){
    const lastOfMonth=new Date(year,month+1,0);
    let d=new Date(lastOfMonth);
    while((d.getDay()+6)%7!==weekday) d.setDate(d.getDate()-1);
    return d.toISOString().slice(0,10);
  }
  const occIdx={first:0,second:1,third:2,fourth:3}[occurrence]||0;
  let d=new Date(year,month,1);
  while((d.getDay()+6)%7!==weekday) d.setDate(d.getDate()+1);
  d.setDate(d.getDate()+occIdx*7);
  return d.toISOString().slice(0,10);
}
function buildWeeklyAlerts(){
  const today=todayStr();
  const monday=mondayOfWeek(today);
  const prevMonday=new Date(monday+'T00:00:00'); prevMonday.setDate(prevMonday.getDate()-7);
  const prevMondayStr=prevMonday.toISOString().slice(0,10);
  const todayIdx=weekdayIndex(today); // 0=Lundi
  const alerts=[]; // {vehicleId, vehicleName, type, label, severity:'overdue'|'upcoming'}
  const pushed=new Set();
  const push=a=>{ const k=a.vehicleId+':'+a.type; if(pushed.has(k))return; pushed.add(k); alerts.push(a); };
  state.vehicles.forEach(v=>{
    // Un engin prêté à un autre centre ou actuellement en panne n'a pas besoin d'être rappelé
    // à la vérification — il n'est simplement pas disponible pour ça.
    if(v.outOfService || (v.currentCis && v.currentCis!==v.cis)) return;
    const due=checkDueInfo(v);
    if(v.checkFrequency!=='quotidien'){
      if(due.due) push({vehicleId:v.id,vehicleName:v.name,type:'Vérification matériel',label:due.label,severity:'overdue'});
      else if(due.label.startsWith('À faire')) push({vehicleId:v.id,vehicleName:v.name,type:'Vérification matériel',label:due.label,severity:'upcoming'});
    }
    // Filet de sécurité indépendant du jour programmé : si aucune vérification matériel n'a eu lieu
    // du tout cette semaine, on le signale à partir de mardi — sauf si la semaine précédente était
    // déjà manquée aussi, auquel cas on le signale sans attendre (c'est déjà en retard).
    const hist=v.checkHistory||[];
    const doneThisWeek=hist.some(h=>h.date>=monday);
    if(!doneThisWeek){
      const doneLastWeek=hist.some(h=>h.date>=prevMondayStr && h.date<monday);
      if(todayIdx>=1 || !doneLastWeek){
        push({vehicleId:v.id,vehicleName:v.name,type:'Vérification matériel',label:'Jamais vérifié cette semaine',severity:'overdue'});
      }
    }
    const tdue=techDueInfo(v);
    if(tdue.due) push({vehicleId:v.id,vehicleName:v.name,type:'Vérification engin',label:tdue.label,severity:'overdue'});
    else if(tdue.label.startsWith('À faire')||tdue.label.startsWith('Prévu')) push({vehicleId:v.id,vehicleName:v.name,type:'Vérification engin',label:tdue.label,severity:'upcoming'});
  });
  return alerts;
}
function buildMaintenanceAlerts(){
  // Contrôle technique / entretien : fenêtre de rappel de 30 jours (pas limitée à la semaine en cours).
  const today=todayStr();
  const horizon=new Date(today); horizon.setDate(horizon.getDate()+30);
  const horizonStr=horizon.toISOString().slice(0,10);
  const alerts=[];
  state.vehicles.forEach(v=>{
    if(v.outOfService || (v.currentCis && v.currentCis!==v.cis)) return;
    const t=v.techCheck;
    if(!t) return;
    [['ctDate','Contrôle technique'],['vidangeDate','Vidange / entretien']].forEach(([field,label])=>{
      const d=t[field];
      if(!d) return;
      const daysLeft=daysUntil(d);
      if(d<today) alerts.push({vehicleId:v.id,vehicleName:v.name,type:label,label:'Dépassé depuis le '+fmtDate(d),severity:'overdue',critical:true});
      else if(d<=horizonStr) alerts.push({vehicleId:v.id,vehicleName:v.name,type:label,label:'Prévu le '+fmtDate(d),severity:'upcoming',critical:daysLeft<=15});
    });
  });
  return alerts;
}

function isVehicleReadOnlyForMe(v){
  // Lecture seule pour le centre de rattachement pendant que l'engin est géré ailleurs.
  return !!(myCentre && v.cis && v.cis===myCentre && v.currentCis && v.currentCis!==myCentre);
}

function bindVehicleDragDrop(){
  let draggedId=null;
  app.querySelectorAll('[data-vehicle-drag]').forEach(card=>{
    card.addEventListener('dragstart',e=>{
      draggedId=card.dataset.vehicleDrag;
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed='move';
    });
    card.addEventListener('dragend',()=>{ card.classList.remove('dragging'); });
    card.addEventListener('dragover',e=>{ e.preventDefault(); card.classList.add('drag-over'); });
    card.addEventListener('dragleave',()=>{ card.classList.remove('drag-over'); });
    card.addEventListener('drop',async e=>{
      e.preventDefault(); card.classList.remove('drag-over');
      const targetId=card.dataset.vehicleDrag;
      if(!draggedId || draggedId===targetId)return;
      const fromIdx=state.vehicles.findIndex(v=>v.id===draggedId);
      const toIdx=state.vehicles.findIndex(v=>v.id===targetId);
      if(fromIdx<0||toIdx<0)return;
      const[moved]=state.vehicles.splice(fromIdx,1);
      state.vehicles.splice(toIdx,0,moved);
      render(); saveState();
    });
  });
}

function toggleConsigneNotifications(){
  if(localStorage.getItem('sp-notif-consignes')==='1'){
    localStorage.setItem('sp-notif-consignes','0');
    updateMenuStaticLabels();
    alert('Notifications désactivées.');
    return;
  }
  if(!('Notification' in window)){ alert('Ton navigateur ne supporte pas les notifications.'); return; }
  Notification.requestPermission().then(perm=>{
    if(perm==='granted'){
      localStorage.setItem('sp-notif-consignes','1');
      lastKnownConsigneCount=(state.consignes||[]).filter(c=>!c.done).length;
      updateMenuStaticLabels();
      alert('Notifications activées — tant que cet onglet reste ouvert (même en arrière-plan), tu seras prévenu des nouvelles consignes. Attention : si tu fermes complètement l\'appli ou le téléphone, ça ne fonctionnera plus (ce n\'est pas une vraie notification "push" comme une appli installée depuis un store).');
    } else {
      alert('Autorisation refusée par le navigateur.');
    }
  });
}
let lastKnownConsigneCount=null;
async function pollConsignesForNotification(){
  if(localStorage.getItem('sp-notif-consignes')!=='1') return;
  if(!('Notification' in window) || Notification.permission!=='granted') return;
  try{
    const res=await window.storage.get(STORAGE_KEY,true);
    if(!res||!res.value) return;
    const remote=JSON.parse(res.value);
    const active=(remote.consignes||[]).filter(c=>!c.done);
    if(lastKnownConsigneCount!==null && active.length>lastKnownConsigneCount){
      const newest=active[active.length-1];
      new Notification('Nouvelle consigne',{body:(newest.createdBy?newest.createdBy+' : ':'')+newest.text});
    }
    lastKnownConsigneCount=active.length;
  }catch(e){}
}

async function duplicateVehicle(id){
  const v=state.vehicles.find(x=>x.id===id); if(!v)return;
  const name=prompt('Nom du nouvel engin (copie de "'+v.name+'") :', v.name+' bis');
  if(!name)return;
  const clone=JSON.parse(JSON.stringify(v));
  clone.id=uid('v'); clone.name=name; clone.immat=''; clone.invNumber=''; clone.techCheck=defaultTechCheck(); clone.checkHistory=[]; clone.loanHistory=[]; clone.currentCis=clone.cis; clone.outOfService=false; clone.outOfServiceInfo=null; clone.breakdownHistory=[];
  const resetArticle=a=>{a.id=uid('a');a.status='verifier';a.locked=false;a.lastCheck='';a.checkedBy='';a.comments=[];(a.sousArticles||[]).forEach(s=>{s.id=uid('s');s.status='verifier';s.lastCheck='';s.checkedBy='';s.comments=[];});};
  clone.emplacements.forEach(e=>{e.id=uid('e');e.articles.forEach(resetArticle);});
  state.vehicles.push(clone); render(); saveState();
}

/* ---------- QR ---------- */
function openQrModal(vehicleId){
  const v=state.vehicles.find(x=>x.id===vehicleId); if(!v)return;
  const base=window.location.origin+window.location.pathname;
  const url=base+'?v='+vehicleId+'&mode=check';
  const overlay=document.createElement('div'); overlay.className='overlay';
  overlay.innerHTML=`<div class="modal"><h3>QR — ${escapeHtml(v.name)}</h3>
    <div class="qr-box"><div id="qrHolder"></div><div class="qr-url">${escapeHtml(url)}</div></div>
    <p style="font-size:11.5px;color:var(--muted);">À coller sur le véhicule une fois l'application hébergée sur son adresse définitive : ce QR ouvre directement la fiche de vérification de cet engin en mode terrain.</p>
    <div class="modal-actions"><button class="btn ghost" id="qrClose">Fermer</button></div></div>`;
  document.body.appendChild(overlay);
  document.getElementById('qrClose').addEventListener('click',()=>overlay.remove());
  overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.remove();});
  try{ new QRCode(document.getElementById('qrHolder'),{text:url,width:180,height:180}); }
  catch(e){ document.getElementById('qrHolder').textContent='(QR indisponible hors-ligne)'; }
}

/* ---------- Commande / réserve pharmacie ---------- */
function buildOrderRows(v){
  const rows=[];
  v.emplacements.forEach(emp=>{
    emp.articles.forEach(a=>{
      if(isContainerArt(a)&&a.sousArticles&&a.sousArticles.length){
        a.sousArticles.forEach(s=>{
          if((s.status==='manquant'||s.status==='perime')&&(s.qtyMissing||s.qty)>0){
            rows.push({emp:emp.name,name:a.name+' > '+s.name,qty:s.qtyMissing||s.qty,total:s.qty,pharma:a.regType==='PHARMA'});
          }
        });
      } else if((a.status==='manquant'||a.status==='perime')&&(a.qtyMissing||a.qty)>0){
        rows.push({emp:emp.name,name:a.name,qty:a.qtyMissing||a.qty,total:a.qty,pharma:a.regType==='PHARMA'});
      }
    });
  });
  return rows;
}
function openOrderModal(v){
  const rows=buildOrderRows(v);
  const overlay=document.createElement('div'); overlay.className='overlay';
  let listHtml, textBody;
  if(!rows.length){
    listHtml='<p style="font-size:12.5px;color:var(--muted);">Rien à commander pour le moment — aucun item manquant ou périmé.</p>';
    textBody='';
  } else {
    const byEmp={};
    rows.forEach(r=>{(byEmp[r.emp]=byEmp[r.emp]||[]).push(r);});
    listHtml=Object.keys(byEmp).map(empName=>`
      <div style="margin-bottom:10px;"><b style="font-family:var(--font-head);font-size:13px;color:var(--navy);">${escapeHtml(empName)}</b>
      <ul style="margin:4px 0 0;padding-left:18px;font-size:12.5px;">
        ${byEmp[empName].map(r=>`<li>${escapeHtml(r.name)} — <b>${r.qty}</b>${r.total!==r.qty?' / '+r.total:''}${r.pharma?' <span class="reg-badge">Pharma</span>':''}</li>`).join('')}
      </ul></div>`).join('');
    textBody='Commande à préparer — '+v.name+' — '+fmtDate(todayStr())+'\n\n'+
      Object.keys(byEmp).map(empName=>empName+'\n'+byEmp[empName].map(r=>'  - '+r.name+' : '+r.qty).join('\n')).join('\n\n');
  }
  overlay.innerHTML=`<div class="modal wide"><h3>🛒 Commande à préparer — ${escapeHtml(v.name)}</h3>
    ${listHtml}
    <div class="modal-actions">
      <button class="btn ghost" id="ordClose">Fermer</button>
      ${rows.length?'<button class="btn primary" id="ordDownload">Télécharger .txt</button>':''}
    </div></div>`;
  document.body.appendChild(overlay);
  document.getElementById('ordClose').addEventListener('click',()=>overlay.remove());
  overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.remove();});
  const dl=document.getElementById('ordDownload');
  if(dl)dl.addEventListener('click',()=>downloadFile('commande_'+v.name.replace(/\s+/g,'_')+'.txt',textBody,'text/plain'));
}

function openGlobalSearchModal(){
  const overlay=document.createElement('div'); overlay.className='overlay';
  overlay.innerHTML=`<div class="modal wide"><h3>🔍 Recherche globale</h3>
    <div class="field"><input id="globalSearchInput" placeholder="Nom d'article, numéro..." autofocus></div>
    <div id="globalSearchResults" style="max-height:400px;overflow-y:auto;margin-top:10px;"><p style="font-size:12px;color:var(--muted);">Tape au moins 2 caractères…</p></div>
    <div class="modal-actions"><button class="btn ghost" id="globalSearchClose">Fermer</button></div></div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.remove();});
  document.getElementById('globalSearchClose').addEventListener('click',()=>overlay.remove());
  const runSearch=(q)=>{
    const resEl=document.getElementById('globalSearchResults');
    const n=normalizeTxt(q);
    if(n.length<2){ resEl.innerHTML='<p style="font-size:12px;color:var(--muted);">Tape au moins 2 caractères…</p>'; return; }
    let html='';
    // Véhicules
    const vehResults=[];
    state.vehicles.forEach(v=>{
      v.emplacements.forEach(emp=>{
        emp.articles.forEach(a=>{
          if(normalizeTxt(a.name).includes(n)) vehResults.push({vId:v.id,label:v.name+' — '+emp.name+' — '+a.name,qty:a.qty,status:a.status});
          (a.sousArticles||[]).forEach(s=>{ if(normalizeTxt(s.name).includes(n)) vehResults.push({vId:v.id,label:v.name+' — '+emp.name+' — '+a.name+' > '+s.name,qty:s.qty,status:s.status}); });
        });
      });
    });
    if(vehResults.length){
      html+=`<div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;margin:8px 0 4px;">Sur les véhicules (${vehResults.length})</div>`;
      vehResults.slice(0,50).forEach(r=>{
        html+=`<div class="article-row" style="grid-template-columns:1fr;padding:6px 0;"><div style="font-size:12.5px;cursor:pointer;" data-search-goto-vehicle="${r.vId}">${escapeHtml(r.label)} <span class="article-sub">(qté ${r.qty}${r.status?', '+(STATUS[r.status]?STATUS[r.status].label:r.status):''})</span></div></div>`;
      });
    }
    // Réserves
    let resCount=0; let resHtml='';
    Object.keys(RESERVE_CATS).forEach(cat=>{
      (state.reserves[cat]||[]).forEach(it=>{
        if(normalizeTxt(it.name).includes(n)||normalizeTxt(it.numero||'').includes(n)){
          resCount++;
          resHtml+=`<div class="article-row" style="grid-template-columns:1fr;padding:6px 0;"><div style="font-size:12.5px;cursor:pointer;" data-search-goto-reserve="${cat}">${RESERVE_CATS[cat].icon} ${escapeHtml(it.name)}${it.numero?' <span class="article-sub">(n° '+escapeHtml(it.numero)+')</span>':''} <span class="article-sub">— ${it.currentVehicleLabel&&it.qty===0?'📍 '+escapeHtml(it.currentVehicleLabel):'stock '+it.qty+(it.location==='reparation'?', en réparation':'')}</span></div></div>`;
        }
      });
    });
    if(resCount){ html+=`<div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;margin:8px 0 4px;">Dans les réserves (${resCount})</div>`+resHtml; }
    if(!vehResults.length && !resCount) html='<p style="font-size:12.5px;color:var(--muted);">Aucun résultat.</p>';
    resEl.innerHTML=html;
    resEl.querySelectorAll('[data-search-goto-vehicle]').forEach(el=>el.addEventListener('click',()=>{
      overlay.remove(); currentView={type:'check',vehicleId:el.dataset.searchGotoVehicle}; render();
    }));
    resEl.querySelectorAll('[data-search-goto-reserve]').forEach(el=>el.addEventListener('click',()=>{
      overlay.remove(); currentView={type:'reserve',cat:el.dataset.searchGotoReserve,search:''}; render();
    }));
  };
  document.getElementById('globalSearchInput').addEventListener('input',e=>runSearch(e.target.value));
  setTimeout(()=>document.getElementById('globalSearchInput').focus(),50);
}
