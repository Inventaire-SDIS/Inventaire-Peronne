/* ---------- Scan QR / code-barres (API native, si disponible) ---------- */
async function openBarcodeScanner(onResult){
  if(!('BarcodeDetector' in window)){
    alert('Le scan direct n\'est pas disponible sur ce navigateur (fonctionne sur Chrome Android à jour). Tu peux saisir le numéro manuellement.');
    return;
  }
  let stream;
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
  }catch(e){
    alert('Impossible d\'accéder à la caméra (autorisation refusée ou indisponible).');
    return;
  }
  const overlay=document.createElement('div'); overlay.className='voice-overlay'; overlay.id='scanOverlay';
  overlay.innerHTML=`<button class="voice-close" id="scanClose">✕</button>
    <div class="vname">Scanner un QR / code-barres</div>
    <video id="scanVideo" autoplay playsinline style="width:100%;max-width:420px;border-radius:8px;margin-top:14px;"></video>
    <div class="vhint" id="scanHint" style="margin-top:14px;">Cadre le code dans l'image…</div>`;
  document.body.appendChild(overlay);
  const video=document.getElementById('scanVideo');
  video.srcObject=stream;
  let stopped=false;
  const stopAll=()=>{
    stopped=true;
    stream.getTracks().forEach(t=>t.stop());
    const ov=document.getElementById('scanOverlay'); if(ov)ov.remove();
  };
  document.getElementById('scanClose').addEventListener('click',stopAll);
  let detector;
  try{
    detector=new window.BarcodeDetector({formats:['qr_code','code_128','ean_13','ean_8','code_39','codabar']});
  }catch(e){
    document.getElementById('scanHint').textContent='Formats non supportés sur ce navigateur.';
    return;
  }
  const scanLoop=async()=>{
    if(stopped)return;
    try{
      const codes=await detector.detect(video);
      if(codes && codes.length){
        const value=codes[0].rawValue;
        document.getElementById('scanHint').textContent='Détecté : '+value;
        setTimeout(()=>{ stopAll(); onResult(value); },400);
        return;
      }
    }catch(e){ /* frame pas encore prête, on continue */ }
    requestAnimationFrame(scanLoop);
  };
  video.addEventListener('loadedmetadata',()=>scanLoop());
}

function openSendToRepairModal(itemLabel,onConfirm){

  overlay.innerHTML=`<div class="modal"><h3>🔧 Envoyer en réparation</h3>
    <p style="font-size:12.5px;color:var(--muted);">Item : <b>${escapeHtml(itemLabel)}</b></p>

    html+=`</div></div>`;
  }
  app.innerHTML=html;
  document.getElementById('backLink').addEventListener('click',()=>{currentView={type:'dashboard'};render();});
  app.querySelectorAll('[data-repair-return]').forEach(el=>el.addEventListener('click',()=>{
    const r=state.repairs.find(x=>x.id===el.dataset.repairReturn); if(!r)return;
    openReturnFromRepairModal(r);
  }));
  app.querySelectorAll('[data-repair-undo-return]').forEach(el=>el.addEventListener('click',()=>requireAdmin(async()=>{
    const r=state.repairs.find(x=>x.id===el.dataset.repairUndoReturn); if(!r)return;
    if(!confirm('Annuler ce retour ? L\'item repassera "en réparation". Le stock de réserve éventuellement ajouté au retour ne sera PAS retiré automatiquement — à corriger manuellement si besoin.')) return;
    r.returned=false; r.dateRetour='';
    if(r.sourceType==='reserve'){
      const it=(state.reserves[r.cat]||[]).find(x=>x.id===r.reserveItemId);
      if(it){ it.location='reparation'; }
    }
    await saveState(); render();
  })));
  app.querySelectorAll('[data-repair-del]').forEach(el=>el.addEventListener('click',()=>requireAdmin(async()=>{
    if(!confirm('Supprimer définitivement cette entrée du suivi réparations ?')) return;
    state.repairs=state.repairs.filter(x=>x.id!==el.dataset.repairDel);
    await saveState(); render();
  })));
}
function openReturnFromRepairModal(r){
  if(r.sourceType==='reserve'){
    // Retour direct dans la même réserve d'origine, pas de choix à faire.
    finalizeRepairReturn(r,r.cat);
    return;
  }
  const guessed=findBestReserveCat(r.itemLabel)||'';
  const overlay=document.createElement('div'); overlay.className='overlay';
  overlay.innerHTML=`<div class="modal"><h3>✓ Retour de réparation</h3>
    <p style="font-size:12.5px;color:var(--muted);">Item : <b>${escapeHtml(r.itemLabel)}</b>${r.numero?' (n° '+escapeHtml(r.numero)+')':''} — provenait de : ${escapeHtml(r.sourceLabel)}</p>
    <p style="font-size:12px;color:var(--muted);">Le matériel qui revient de réparation retourne en réserve par défaut (pas directement sur le véhicule, au cas où il aurait déjà été remplacé entre-temps). Choisis la réserve qui doit l'accueillir :</p>
    <div class="field"><label>Réserve de destination</label><select id="retCat">${Object.keys(RESERVE_CATS).map(c=>`<option value="${c}" ${c===guessed?'selected':''}>${RESERVE_CATS[c].icon} ${RESERVE_CATS[c].label}</option>`).join('')}</select></div>
    <div class="modal-actions"><button class="btn ghost" id="retCancel">Annuler</button><button class="btn primary" id="retConfirm">Confirmer le retour</button></div></div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.remove();});
  document.getElementById('retCancel').addEventListener('click',()=>overlay.remove());
  document.getElementById('retConfirm').addEventListener('click',()=>{
    const cat=document.getElementById('retCat').value;
    overlay.remove();
    finalizeRepairReturn(r,cat);
  });
}
async function finalizeRepairReturn(r,cat){
  const applyReturn=async(controlDate)=>{
    if(r.sourceType==='reserve'){
      const it=(state.reserves[r.cat]||[]).find(x=>x.id===r.reserveItemId);
      if(it){
        it.location='stock';
        if(it.trackMode!=='unique') it.qty=(it.qty||0)+1;
        if(controlDate) it.expiry=controlDate;
      }
    } else {
      state.reserves[cat]=state.reserves[cat]||[];
      const isUnique=!!r.numero;
      if(isUnique){
        state.reserves[cat].push({id:uid('r'),name:r.itemLabel,qty:1,qtyMin:0,expiry:controlDate||'',
          comments:[{id:uid('cm'),text:'De retour de réparation le '+fmtDate(todayStr())+(r.sourceLabel?' (provenait de '+r.sourceLabel+')':''),date:todayStr()}],
          numero:r.numero,volumeL:'',pressureBar:'',trackMode:'unique',location:'stock'});
      } else {
        const nk=normalizeTxt(r.itemLabel);
        const existing=state.reserves[cat].find(it=>normalizeTxt(it.name)===nk && it.trackMode!=='unique');
        if(existing){
          existing.qty=(existing.qty||0)+1;
          if(controlDate) existing.expiry=controlDate;
        } else {
          state.reserves[cat].push({id:uid('r'),name:r.itemLabel,qty:1,qtyMin:0,expiry:controlDate||'',
            comments:[{id:uid('cm'),text:'De retour de réparation le '+fmtDate(todayStr()),date:todayStr()}],numero:'',volumeL:'',pressureBar:'',trackMode:'stock',location:'stock'});
        }
      }
    }
    r.returned=true; r.dateRetour=todayStr(); r.cat=cat;
    await saveState(); render();
    alert('Marqué de retour'+(cat?' — ajouté à la réserve « '+RESERVE_CATS[cat].label+' ».':'.'));
  };
  // Bouteilles ARI : contrôle annuel — proposer de saisir la nouvelle date au retour.
  if(cat==='ari'){
    openDateEntryModal('Nouvelle date de contrôle annuel (bouteille ARI)',null,(iso)=>applyReturn(iso));
  } else {
    applyReturn(null);
  }
}

function findArt(v,key){const[empId,artId]=key.split(':');const emp=v.emplacements.find(e=>e.id===empId);const a=emp.articles.find(x=>x.id===artId);return{emp,a};}
function moveInArray(arr,id,dir){
  dir=dir||-1; const i=arr.findIndex(x=>x.id===id); if(i<0)return;
  const j=i+dir; if(j<0||j>=arr.length)return;
  const tmp=arr[i]; arr[i]=arr[j]; arr[j]=tmp;
}

function compressImage(file){
  return new Promise((resolve)=>{
    const img=new Image(); const reader=new FileReader();
    reader.onload=e=>{img.src=e.target.result;};
    img.onload=()=>{
      const maxW=500; const scale=Math.min(1,maxW/img.width);
      const canvas=document.createElement('canvas'); canvas.width=img.width*scale; canvas.height=img.height*scale;
      canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
      resolve(canvas.toDataURL('image/jpeg',0.6));
    };
    reader.readAsDataURL(file);
  });
}

/* ---------- CHECK VIEW (mode terrain) ---------- */
function isFullyChecked(v){
  for(const emp of v.emplacements){
    for(const a of emp.articles){
      const hasChildren=isContainerArt(a);
      if(hasChildren){
        if(!a.locked){
          for(const s of a.sousArticles){ if(s.status==='verifier') return false; }
        }
      } else if(a.status==='verifier'){ return false; }
    }
  }
  return true;
}
async function closeVehicleCheck(v){
  const st=vehicleStats(v);
  v.checkHistory=v.checkHistory||[];
  v.checkHistory.push({date:todayStr(),pct:st.pct,checkedBy:currentCheckerLabel()});
  if(v.checkHistory.length>50) v.checkHistory=v.checkHistory.slice(-50);
  await saveState();
  // Le nom de l'agent est réinitialisé une fois la vérification clôturée, pour que le prochain contrôle
  // (souvent fait par quelqu'un d'autre) ne reste pas attribué par erreur à la personne précédente.
  checkerNames=[]; activeCheckContext=null; await saveCheckers(); updateCheckerPill();
  // Une fois clôturé : ne laisser ouverts que les emplacements qui ont encore une anomalie, replier le reste.
  const remaining=buildAnomaliesList(v);
  checkOpenEmps = remaining.length ? new Set(remaining.map(x=>x.empId)) : new Set();
  return st;
}
function maybeOfferClosure(v){
  if(v.emplacements.some(e=>e.articles.length) && isFullyChecked(v)){
    setTimeout(()=>{
      if(confirm('Tous les items de « '+v.name+' » ont été vérifiés. Clôturer la vérification maintenant ?')){
        closeVehicleCheck(v).then(st=>{ render(); alert('Vérification clôturée pour aujourd\'hui ('+st.pct+'% conforme).'); });
      }
    },150);
  }
}
function buildAnomaliesList(v){
  const list=[];
  v.emplacements.forEach(emp=>{
    emp.articles.forEach(a=>{
      const hasChildren=isContainerArt(a);
      if(hasChildren){
        // "Non verrouillé" n'est une anomalie que si le conteneur a déjà été vérifié au moins une fois
        // (a.lastCheck renseigné) et qu'il n'est PAS complet. Un conteneur jamais encore contrôlé
        // (import initial, nouvel article...) est simplement "à vérifier", pas une anomalie.
        if(!a.locked && a.lastCheck) list.push({empId:emp.id,artId:a.id,subId:null,label:emp.name+' — '+a.name,statusLabel:'Non '+(a.lockLabel||'complet').toLowerCase(),type:'lock'});
        a.sousArticles.forEach(s=>{
          if(s.status==='manquant'||s.status==='perime'||s.status==='hs') list.push({empId:emp.id,artId:a.id,subId:s.id,label:emp.name+' — '+a.name+' > '+s.name,statusLabel:STATUS[s.status].label,type:'leaf'});
        });
      } else if(a.status==='manquant'||a.status==='perime'||a.status==='hs'){
        list.push({empId:emp.id,artId:a.id,subId:null,label:emp.name+' — '+a.name,statusLabel:STATUS[a.status].label,type:'leaf'});
      }
    });
  });
  return list;
}

        <input type="range" min="0" max="100" value="${v.techCheck.carburant||0}" id="dailyFuelRange"${readOnly?' disabled':''} style="width:100%;margin-top:6px;">
      </div>
      ${v.hasAdblue===false?'':`<div>
        <div style="display:flex;justify-content:space-between;font-size:11.5px;font-weight:600;margin-bottom:4px;"><span>AdBlue</span><span id="dailyAdblueVal">${v.techCheck.adblue||0}%</span></div>
        <div id="dailyAdblueGauge">${renderGauge(v.techCheck.adblue||0,v.adblueMinThreshold,'adb')}</div>
        <input type="range" min="0" max="100" value="${v.techCheck.adblue||0}" id="dailyAdblueRange"${readOnly?' disabled':''} style="width:100%;margin-top:6px;">
      </div>`}
    </div>`}
    ${readOnly?'':`<button class="btn small ghost" id="carroReportBtn" style="margin-top:12px;">🚗 Signaler un problème carrosserie (photo)</button>`}
    ${v.techCheck.carrosseriePhotos&&v.techCheck.carrosseriePhotos.length?`<div style="margin-top:10px;">${renderCarrosseriePhotos(v)}</div>`:''}
  </div>`;

  v.emplacements.forEach(emp=>{
    const es=empStats(emp);
    const isOpen=checkOpenEmps.has(emp.id);
    html+=`<div class="check-emp">
      <div class="check-emp-head" data-toggle-emp="${emp.id}"><span>${escapeHtml(emp.name)}</span><span class="pct" style="color:${es.overall==='ok'?'#8fd6ac':es.overall==='warn'?'#ffd699':'#ff9e9e'};">${es.pct}%</span></div>`;
    if(isOpen){
      if((emp.photos||[]).length){html+=`<div class="check-emp-photos">${emp.photos.map(p=>`<img src="${p}" style="cursor:pointer;" onclick="openPhotoLightbox(this.src)">`).join('')}</div>`;}
      emp.articles.forEach(a=>{
        const hasChildren=isContainerArt(a);
        const isBottle=a.regType==='O2'||a.regType==='ARI';
        const o2Liters=isBottle && a.volumeL && a.pressureBar ? Math.round(parseFloat(a.volumeL)*parseFloat(a.pressureBar)) : null;
        const gasLabel=a.regType==='ARI'?'L air':'L O2';
        const dis=readOnly?' disabled':'';
        html+=`<div class="check-article">
          <div class="check-article-name">${escapeHtml(a.name)} <span class="article-sub">(qté ${a.qty})</span> ${a.regType?`<span class="reg-badge ${isSoonOrOverdue(a.regDueDate)==='overdue'?'overdue':(isSoonOrOverdue(a.regDueDate)==='soon'?'soon':'')}">${REG_TYPES[a.regType]}${a.regDueDate?' — '+fmtDate(a.regDueDate):''}</span>`:''}${a.wrongLocation?' <span class="reg-badge overdue">📍 Mauvais emplacement signalé</span>':''}
            <button class="comment-btn ${a.comments&&a.comments.length?'has-comment':''}"${dis} title="Ajouter un commentaire" data-comment-art="${emp.id}:${a.id}">💬</button>
            <button class="comment-btn ${a.wrongLocation?'has-comment':''}"${dis} title="${a.wrongLocation?'Retirer le signalement':'Signaler un mauvais emplacement'}" data-wrong-loc-art="${emp.id}:${a.id}">📍</button>
          </div>
          ${isBottle?`<div class="field-inline"><label>N° bouteille</label><input value="${escapeHtml(a.invNum||'')}"${dis} style="width:130px;" placeholder="numéro" data-set-check-o2num="${emp.id}:${a.id}"><label>Pression (bar)</label><input type="number" min="0"${dis} style="width:65px;" value="${a.pressureBar||''}" data-set-check-o2pres="${emp.id}:${a.id}">${a.volumeL?`<span class="article-sub">× ${a.volumeL} L</span>`:''}${o2Liters!==null?`<span class="tag">≈ ${o2Liters} ${gasLabel} disponible</span>`:'<span class="article-sub">(renseigner le volume en Configurer)</span>'}</div>`:''}
          ${renderCommentsBlock(a,'art:'+emp.id+':'+a.id)}
          ${(a.photos||[]).length?`<div class="check-art-photos">${a.photos.map(p=>`<img src="${p}" style="cursor:pointer;" onclick="openPhotoLightbox(this.src)">`).join('')}</div>`:''}`;
        if(hasChildren){
          html+=`<button class="check-lock-btn ${a.locked?'active':''}"${dis} data-toggle-lock="${emp.id}:${a.id}">${a.locked?'✓ '+(a.lockLabel||'Complet')+' — validé':'Marquer '+(a.lockLabel||'complet')}</button>`;
          if(!a.locked){
            html+=`<div class="check-sub-list">`;
            a.sousArticles.forEach(sub=>{
              const subReg=isSoonOrOverdue(sub.expiry);
              html+=`<div class="check-sub-row"><span>${escapeHtml(sub.name)} <span class="article-sub">(qté ${sub.qty})</span> ${sub.expiry?`<span class="reg-badge ${subReg==='overdue'?'overdue':(subReg==='soon'?'soon':'')}">Péremption ${fmtDate(sub.expiry)}</span>`:''}${sub.wrongLocation?' <span class="reg-badge overdue">📍 Mauvais emplacement</span>':''} <button class="comment-btn ${sub.comments&&sub.comments.length?'has-comment':''}"${dis} title="Ajouter un commentaire" data-comment-sub="${emp.id}:${a.id}:${sub.id}">💬</button> <button class="comment-btn ${sub.wrongLocation?'has-comment':''}"${dis} title="${sub.wrongLocation?'Retirer le signalement':'Signaler un mauvais emplacement'}" data-wrong-loc-sub="${emp.id}:${a.id}:${sub.id}">📍</button> <button class="comment-btn ${sub.expiry?'has-comment':''}"${dis} title="${sub.expiry?'Modifier la péremption':'Ajouter une péremption (si applicable)'}" data-set-sub-expiry-btn="${emp.id}:${a.id}:${sub.id}">📅</button></span>
                <div class="check-status-buttons check-sub-status-buttons">
                ${Object.keys(STATUS).map(k=>`<button class="check-status-btn ${sub.status===k?'active '+k:''}"${dis} data-set-sub-status="${emp.id}:${a.id}:${sub.id}:${k}">${STATUS[k].short}</button>`).join('')}
                </div></div>
                ${(sub.status==='manquant'||sub.status==='perime'||sub.status==='hs')?`<div class="field-inline"><label>Qté manquante</label><input type="number" min="0" max="${sub.qty}"${dis} style="width:55px;" value="${sub.qtyMissing||sub.qty}" data-set-sub-missing="${emp.id}:${a.id}:${sub.id}"><span class="article-sub">/ ${sub.qty}</span>${readOnly?'':`<button class="btn small ghost" data-pick-reserve-sub="${emp.id}:${a.id}:${sub.id}">🔁 Piocher en réserve</button><button class="btn small ghost" data-send-repair-sub="${emp.id}:${a.id}:${sub.id}">🔧 Envoyer en réparation</button>`}</div>`:''}
                ${renderCommentsBlock(sub,'sub:'+emp.id+':'+a.id+':'+sub.id)}`;
            });
            html+=`</div>`;
          } else {
            html+=`<div class="check-meta">Contrôlé le ${fmtDate(a.lastCheck)}${a.checkedBy?' — '+escapeHtml(a.checkedBy):''}</div>`;
          }
        } else {
          html+=`<div class="check-status-buttons">${Object.keys(STATUS).map(k=>`<button class="check-status-btn ${a.status===k?'active '+k:''}"${dis} data-set-art-status="${emp.id}:${a.id}:${k}">${STATUS[k].short}</button>`).join('')}</div>
          ${(a.status==='manquant'||a.status==='perime'||a.status==='hs')?`<div class="field-inline"><label>Qté manquante</label><input type="number" min="0" max="${a.qty}"${dis} style="width:55px;" value="${a.qtyMissing||a.qty}" data-set-art-missing="${emp.id}:${a.id}"><span class="article-sub">/ ${a.qty}</span>${readOnly?'':`<button class="btn small ghost" data-pick-reserve-art="${emp.id}:${a.id}">🔁 Piocher en réserve</button><button class="btn small ghost" data-send-repair-art="${emp.id}:${a.id}">🔧 Envoyer en réparation</button>`}</div>`:''}
          <div class="check-meta">Contrôlé le ${fmtDate(a.lastCheck)}${a.checkedBy?' — '+escapeHtml(a.checkedBy):''}${a.expiry?' · Péremption '+fmtDate(a.expiry):''}</div>`;
        }
        html+=`</div>`;
      });
    }
    html+=`</div>`;
  });
  html+= readOnly? '' : `<button id="closeCheckBtnFloat" class="fab-close" title="Clôturer la vérification">✓ Clôturer</button>`;
  app.innerHTML=html;
  document.getElementById('backLink').addEventListener('click',()=>{currentView={type:'dashboard'};checkOpenEmps=null;render();});
  const toConfigBtn=document.getElementById('toConfigTab'); if(toConfigBtn) toConfigBtn.addEventListener('click',()=>requireAdmin(()=>{currentView={type:'config',vehicleId:v.id};render();}));
  const toTechBtn=document.getElementById('toTechTab'); if(toTechBtn) toTechBtn.addEventListener('click',()=>{currentView={type:'tech',vehicleId:v.id};render();});
  const voiceBtn=document.getElementById('voiceModeBtn'); if(voiceBtn) voiceBtn.addEventListener('click',()=>startVoiceInventory(v));
  const voiceSetBtn=document.getElementById('voiceSettingsBtn'); if(voiceSetBtn) voiceSetBtn.addEventListener('click',openVoicePickerModal);
  document.getElementById('orderBtn').addEventListener('click',()=>openOrderModal(v));
  const intBtn=document.getElementById('interventionBtn'); if(intBtn) intBtn.addEventListener('click',()=>openInterventionModal(v));
  document.getElementById('expandAllBtn').addEventListener('click',()=>{checkOpenEmps=new Set(v.emplacements.map(e=>e.id)); render();});
  document.getElementById('printCheckBtn').addEventListener('click',()=>{checkOpenEmps=new Set(v.emplacements.map(e=>e.id)); render(); setTimeout(()=>window.print(),200);});
  const fuelRange=document.getElementById('dailyFuelRange');
  if(fuelRange){
    fuelRange.addEventListener('input',e=>{
      document.getElementById('dailyFuelVal').textContent=e.target.value+'%';
      document.getElementById('dailyFuelGauge').innerHTML=renderGauge(parseInt(e.target.value),v.fuelMinThreshold,'fuel');
    });
    fuelRange.addEventListener('change',async e=>{ v.techCheck.carburant=parseInt(e.target.value)||0; await saveState(); });
  }
  const adblueRange=document.getElementById('dailyAdblueRange');
  if(adblueRange){
    adblueRange.addEventListener('input',e=>{
      document.getElementById('dailyAdblueVal').textContent=e.target.value+'%';
      document.getElementById('dailyAdblueGauge').innerHTML=renderGauge(parseInt(e.target.value),v.adblueMinThreshold,'adb');
    });
    adblueRange.addEventListener('change',async e=>{ v.techCheck.adblue=parseInt(e.target.value)||0; await saveState(); });
  }
  const carroBtn=document.getElementById('carroReportBtn');
  if(carroBtn) carroBtn.addEventListener('click',()=>openAddCarrosseriePhotoModal(v));
  app.querySelectorAll('[data-del-carro-photo]').forEach(el=>el.addEventListener('click',()=>requireAdmin(async()=>{
    if(!confirm('Retirer cette photo carrosserie ?'))return;
    v.techCheck.carrosseriePhotos=v.techCheck.carrosseriePhotos.filter(p=>p.id!==el.dataset.delCarroPhoto);
    await saveState(); render();
  })));
  document.getElementById('collapseAllBtn').addEventListener('click',()=>{checkOpenEmps=new Set(); render();});
  const closeBtn=document.getElementById('closeCheckBtn');
  if(closeBtn) closeBtn.addEventListener('click',async()=>{
    const st=await closeVehicleCheck(v);
    render();
    alert('Vérification clôturée pour aujourd\'hui ('+st.pct+'% conforme).');
  });
  const closeBtnFloat=document.getElementById('closeCheckBtnFloat');
  if(closeBtnFloat) closeBtnFloat.addEventListener('click',async()=>{
    const st=await closeVehicleCheck(v);
    render();
    alert('Vérification clôturée pour aujourd\'hui ('+st.pct+'% conforme).');
  });
  app.querySelectorAll('[data-pick-reserve-art]').forEach(el=>el.addEventListener('click',()=>{
    const[empId,artId]=el.dataset.pickReserveArt.split(':'); openReservePicker(v,empId,artId,null);
  }));
  app.querySelectorAll('[data-pick-reserve-sub]').forEach(el=>el.addEventListener('click',()=>{
    const[empId,artId,subId]=el.dataset.pickReserveSub.split(':'); openReservePicker(v,empId,artId,subId);
  }));
  app.querySelectorAll('[data-send-repair-art]').forEach(el=>el.addEventListener('click',()=>{
    const[empId,artId]=el.dataset.sendRepairArt.split(':'); const{a,emp}=findArt(v,empId+':'+artId);
    openSendToRepairModal(a.name,async(info)=>{
      state.repairs.push({id:uid('rep'),itemLabel:a.name,numero:a.invNum||'',sourceType:'vehicule',sourceLabel:v.name+' — '+emp.name,destination:info.destination,motif:info.motif,dateEnvoi:info.date,dateRetour:'',returned:false});
      addComment(a,'Envoyé en réparation ('+info.destination+') le '+fmtDate(info.date));
      await saveState(); render();
    });
  }));
  app.querySelectorAll('[data-send-repair-sub]').forEach(el=>el.addEventListener('click',()=>{
    const[empId,artId,subId]=el.dataset.sendRepairSub.split(':'); const{a,emp}=findArt(v,empId+':'+artId);
    const sub=a.sousArticles.find(s=>s.id===subId);
    openSendToRepairModal(a.name+' > '+sub.name,async(info)=>{
      state.repairs.push({id:uid('rep'),itemLabel:a.name+' > '+sub.name,numero:sub.invNum||'',sourceType:'vehicule',sourceLabel:v.name+' — '+emp.name,destination:info.destination,motif:info.motif,dateEnvoi:info.date,dateRetour:'',returned:false});
      addComment(sub,'Envoyé en réparation ('+info.destination+') le '+fmtDate(info.date));
      await saveState(); render();
    });
  }));
  app.querySelectorAll('[data-anomaly-pick]').forEach(el=>el.addEventListener('click',()=>{
    const[empId,artId,subId]=el.dataset.anomalyPick.split(':'); openReservePicker(v,empId,artId,subId||null);
  }));
  app.querySelectorAll('[data-set-check-o2num]').forEach(el=>el.addEventListener('change',async()=>{
    const{a}=findArt(v,el.dataset.setCheckO2num); a.invNum=el.value; await saveState(); render();
  }));
  app.querySelectorAll('[data-set-check-o2pres]').forEach(el=>el.addEventListener('change',async()=>{
    const{a}=findArt(v,el.dataset.setCheckO2pres); a.pressureBar=el.value; await saveState(); render();
  }));
  app.querySelectorAll('[data-comment-art]').forEach(el=>el.addEventListener('click',async(ev)=>{
    ev.stopPropagation();
    const{a}=findArt(v,el.dataset.commentArt);
    const c=prompt('Nouveau commentaire pour "'+a.name+'" :','');
    if(c!==null && c.trim()){addComment(a,c);await saveState();render();}
  }));
  app.querySelectorAll('[data-comment-sub]').forEach(el=>el.addEventListener('click',async(ev)=>{
    ev.stopPropagation();
    const[empId,artId,subId]=el.dataset.commentSub.split(':'); const{a}=findArt(v,empId+':'+artId);
    const sub=a.sousArticles.find(s=>s.id===subId);
    const c=prompt('Nouveau commentaire pour "'+sub.name+'" :','');
    if(c!==null && c.trim()){addComment(sub,c);await saveState();render();}
  }));
  app.querySelectorAll('[data-del-comment]').forEach(el=>el.addEventListener('click',async(ev)=>{
    ev.stopPropagation();
    const parts=el.dataset.delComment.split(':');
    let obj=null;
    if(parts[0]==='art'){ const{a}=findArt(v,parts[1]+':'+parts[2]); obj=a; }
    else if(parts[0]==='sub'){ const{a}=findArt(v,parts[1]+':'+parts[2]); obj=a.sousArticles.find(s=>s.id===parts[3]); }
    if(!obj||!obj.comments)return;
    const commentId=parts[parts.length-1];
    obj.comments=obj.comments.filter(c=>c.id!==commentId);
    await saveState(); render();
  }));
  app.querySelectorAll('[data-wrong-loc-art]').forEach(el=>el.addEventListener('click',()=>{
    const{a}=findArt(v,el.dataset.wrongLocArt);
    a.wrongLocation=!a.wrongLocation;
    if(a.wrongLocation){ const note=prompt('Précision sur l\'emplacement (optionnel) — où devrait-il être selon toi ?',''); if(note&&note.trim())addComment(a,'📍 Mauvais emplacement signalé : '+note.trim()); else addComment(a,'📍 Mauvais emplacement signalé'); }
    render(); saveState();
  }));
  app.querySelectorAll('[data-wrong-loc-sub]').forEach(el=>el.addEventListener('click',()=>{
    const[empId,artId,subId]=el.dataset.wrongLocSub.split(':'); const{a}=findArt(v,empId+':'+artId);
    const sub=a.sousArticles.find(s=>s.id===subId);
    sub.wrongLocation=!sub.wrongLocation;
    if(sub.wrongLocation){ const note=prompt('Précision sur l\'emplacement (optionnel) — où devrait-il être selon toi ?',''); if(note&&note.trim())addComment(sub,'📍 Mauvais emplacement signalé : '+note.trim()); else addComment(sub,'📍 Mauvais emplacement signalé'); }
    render(); saveState();
  }));
  app.querySelectorAll('[data-toggle-emp]').forEach(el=>el.addEventListener('click',()=>{
    const id=el.dataset.toggleEmp; if(checkOpenEmps.has(id))checkOpenEmps.delete(id); else checkOpenEmps.add(id); render();
  }));
  app.querySelectorAll('[data-toggle-lock]').forEach(el=>el.addEventListener('click',()=>requireChecker({vehicleId:v.id,type:'material'},()=>{
    const[empId,artId]=el.dataset.toggleLock.split(':'); const{a}=findArt(v,empId+':'+artId);
    a.locked=!a.locked;
    if(a.locked){a.lastCheck=todayStr();a.checkedBy=currentCheckerLabel();}
    render(); maybeOfferClosure(v); saveState();
  })));
  app.querySelectorAll('[data-set-art-status]').forEach(el=>el.addEventListener('click',()=>requireChecker({vehicleId:v.id,type:'material'},()=>{
    const[empId,artId,status]=el.dataset.setArtStatus.split(':'); const{a}=findArt(v,empId+':'+artId);
    a.status=status; a.lastCheck=todayStr(); a.checkedBy=currentCheckerLabel();
    if((status==='manquant'||status==='perime')&&!a.qtyMissing) a.qtyMissing=a.qty;
    if(status!=='manquant'&&status!=='perime') a.qtyMissing=0;
    render(); maybeOfferClosure(v); saveState();
  })));
  app.querySelectorAll('[data-set-sub-status]').forEach(el=>el.addEventListener('click',()=>requireChecker({vehicleId:v.id,type:'material'},()=>{
    const[empId,artId,subId,status]=el.dataset.setSubStatus.split(':'); const{a}=findArt(v,empId+':'+artId);
    const sub=a.sousArticles.find(s=>s.id===subId); sub.status=status; sub.lastCheck=todayStr(); sub.checkedBy=currentCheckerLabel();
    if((status==='manquant'||status==='perime')&&!sub.qtyMissing) sub.qtyMissing=sub.qty;
    if(status!=='manquant'&&status!=='perime') sub.qtyMissing=0;
    render(); maybeOfferClosure(v); saveState();
  })));
  app.querySelectorAll('[data-set-art-missing]').forEach(el=>el.addEventListener('change',async()=>{
    const{a}=findArt(v,el.dataset.setArtMissing); a.qtyMissing=Math.max(0,Math.min(a.qty,parseInt(el.value)||0)); await saveState();
  }));
  app.querySelectorAll('[data-set-sub-missing]').forEach(el=>el.addEventListener('change',async()=>{
    const[empId,artId,subId]=el.dataset.setSubMissing.split(':'); const{a}=findArt(v,empId+':'+artId);
    const sub=a.sousArticles.find(s=>s.id===subId); sub.qtyMissing=Math.max(0,Math.min(sub.qty,parseInt(el.value)||0)); await saveState();
  }));
  app.querySelectorAll('[data-set-sub-expiry-btn]').forEach(el=>el.addEventListener('click',()=>{
    const[empId,artId,subId]=el.dataset.setSubExpiryBtn.split(':'); const{a}=findArt(v,empId+':'+artId);
    const sub=a.sousArticles.find(s=>s.id===subId);
    openDateEntryModal('Péremption pour « '+sub.name+' » (laisser vide si non applicable)',sub.expiry,async(iso)=>{
      if(iso===null)return; // "Laisser inchangé" : on ne touche à rien
      sub.expiry=iso; await saveState(); render();
    });
  }));
}

/* ---------- TECH CHECK VIEW (vérification engin) ---------- */
function renderTech(vehicleId){
  const v=state.vehicles.find(x=>x.id===vehicleId); if(!v){currentView={type:'dashboard'};return render();}
  if(v.hasEngine===false){currentView={type:'check',vehicleId:v.id};return render();}
  const t=v.techCheck=v.techCheck||defaultTechCheck();
  const isElec=t.motorisation==='Électrique';
  let html=`<div class="back-link" id="backLink">← Retour au tableau de bord</div>
  <div class="detail-header">
    <div class="detail-title"><h2>${escapeHtml(v.name)}</h2><div class="code">Vérification de l'engin${t.lastCheck?' · dernière le '+fmtDate(t.lastCheck)+(t.verifiedBy?' — '+escapeHtml(t.verifiedBy):''):''}</div></div>
    <div class="detail-actions"><button class="btn ghost small" id="toCheckTab2">Vérification matériel</button><button class="btn ghost small" id="toConfigTab2">Configurer</button></div>
  </div>
  <div class="mode-tabs"><div class="mode-tab" id="toCheckTab3">Vérification matériel</div><div class="mode-tab active">Vérification engin</div></div>

  <div class="tech-block"><h4>Moteur & niveaux</h4>
    <div class="tech-grid">
      <div class="tech-field"><label>Kilométrage (km)</label><input type="number" id="tKm" value="${t.km}" placeholder="Ex: 42000"></div>
      <div class="tech-field"><label>Motorisation</label><select id="tMoto"><option ${t.motorisation==='Thermique'?'selected':''}>Thermique</option><option ${t.motorisation==='Électrique'?'selected':''}>Électrique</option><option ${t.motorisation==='Hybride'?'selected':''}>Hybride</option></select></div>
      <div class="tech-field"><label>Heure moteur (h)</label><input type="number" id="tHm" value="${t.heureMoteur}" placeholder="Ex: 134.5"></div>
      <div class="tech-field"><label>Heure de pompe (h)</label><input type="number" id="tHp" value="${t.heurePompe}" placeholder="Ex: 12.0"></div>
      <div class="tech-field"><label>Prochain contrôle technique</label><input type="date" id="tCt" value="${t.ctDate}"></div>
      <div class="tech-field"><label>Prochaine vidange</label><input type="date" id="tVid" value="${t.vidangeDate}"></div>
    </div>
    <div style="margin-top:14px;"><div style="display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;margin-bottom:4px;"><span>⛽ Carburant</span><span id="tCarbVal">${t.carburant}%</span></div>
      <div id="tCarbGauge">${renderGauge(t.carburant,v.fuelMinThreshold,'tfuel')}</div>
      <input type="range" min="0" max="100" id="tCarb" value="${t.carburant}" style="width:100%;margin-top:6px;">
    </div>
    ${v.hasAdblue===false?'':`<div style="margin-top:14px;"><div style="display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;margin-bottom:4px;"><span>🧪 AdBlue</span><span id="tAdbVal">${t.adblue}%</span></div>
      <div id="tAdbGauge">${renderGauge(t.adblue,v.adblueMinThreshold,'tadb')}</div>
      <input type="range" min="0" max="100" id="tAdb" value="${t.adblue}" style="width:100%;margin-top:6px;">
    </div>`}
    <div class="tech-check-list">
      <label class="tech-check-item"><input type="checkbox" id="tHuile" ${t.huileOk?'checked':''}> Niveau d'huile OK</label>
      <label class="tech-check-item"><input type="checkbox" id="tLiq" ${t.liquideOk?'checked':''}> Liquide de refroidissement OK</label>
      <label class="tech-check-item"><input type="checkbox" id="tLave" ${t.laveGlaceOk?'checked':''}> Lave-glace OK</label>
      ${v.hasAdblue===false?'':`<label class="tech-check-item"><input type="checkbox" id="tAdbOk" ${t.adblueOk?'checked':''}> AdBlue (voyant) OK</label>`}
    </div>

/* ---------- VOICE MODE (inventaire vocal) ---------- */
function buildVoiceQueue(v){
  const queue=[];
  v.emplacements.forEach(emp=>{
    emp.articles.forEach(a=>{
      const hasChildren=isContainerArt(a);
      if(hasChildren){
        queue.push({type:'lock',empId:emp.id,artId:a.id,label:a.name,lockLabel:a.lockLabel||'complet',comment:commentsTooltip(a)});
      } else {
        queue.push({type:'art',empId:emp.id,artId:a.id,label:a.name,qty:a.qty,comment:commentsTooltip(a)});
      }
    });
  });
  return queue;
}
function normalizeTxt(s){return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();}
function classifyAnswer(txt){
  const n=normalizeTxt(txt);
  if(/\b(conforme|ok|present|oui|positif)\b/.test(n)) return 'ok';
  if(/\b(manquant|absent|non|negatif|manque)\b/.test(n)) return 'manquant';
  if(/\b(perime|perimee)\b/.test(n)) return 'perime';
  if(/\b(hs|hors\s?service)\b/.test(n)) return 'hs';
  return null;
}
const ANSWER_LABEL={ok:'Conforme',manquant:'Manquant',perime:'Périmé',hs:'H.S.'};
const LETTER_NAMES={A:'a',B:'bé',C:'cé',D:'dé',E:'e',F:'effe',G:'gé',H:'ache',I:'i',J:'ji',K:'ka',L:'elle',M:'emme',N:'enne',O:'o',P:'pé',Q:'ku',R:'erre',S:'esse',T:'té',U:'u',V:'vé',W:'double vé',X:'iks',Y:'i grec',Z:'zède'};
function spellOut(text){
  // épelle phonétiquement les majuscules isolées et sigles (L, M, ARI, VSAV...) sans utiliser de points,
  // car "M." "Dr." etc. sont lus comme des abréviations (Monsieur...) par la synthèse vocale française.
  return String(text).replace(/\b[A-Z]{1,6}\b/g, m=> m.split('').map(ch=>LETTER_NAMES[ch]||ch).join(' '));
}
let voiceState=null;
let voiceMicStream=null;
let voiceResumeMap={};
async function startVoiceInventory(v){
  if(!('speechSynthesis' in window)){alert('La synthèse vocale n\'est pas disponible sur ce navigateur. Utilise Chrome sur Android ou sur ordinateur.');return;}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){alert('La reconnaissance vocale n\'est pas disponible sur ce navigateur (nécessite Chrome + autorisation micro).');return;}
  const queue=buildVoiceQueue(v);
  if(!queue.length){alert('Aucun item à contrôler pour cet engin.');return;}
  let startIndex=voiceResumeMap[v.id]||0;
  if(startIndex>=queue.length) startIndex=0;
  voiceState={v,queue,index:startIndex,recognition:new SR()};
  voiceState.recognition.lang='fr-FR'; voiceState.recognition.continuous=false; voiceState.recognition.interimResults=false;
  const overlay=document.createElement('div'); overlay.className='voice-overlay'; overlay.id='voiceOverlay';
  overlay.innerHTML=`<button class="voice-close" id="voiceClose">✕</button>
    <div class="vname">${escapeHtml(v.name)} — Inventaire vocal</div>
    <div class="voice-mic" id="voiceMic">🎤</div>
    <div class="vitem" id="voiceItemText">Préparation…</div>
    <div class="vhint" id="voiceHint">Réponses possibles : Oui (conforme) · Manquant · Périmé · H.S.</div>
    <div class="voice-progress" id="voiceProgress"></div>
    ${startIndex>0?'<button class="btn ghost small" id="voiceRestartBtn" style="margin-top:14px;">🔁 Recommencer depuis le début</button>':''}`;
  document.body.appendChild(overlay);
  document.getElementById('voiceClose').addEventListener('click',stopVoiceInventory);
  const rb=document.getElementById('voiceRestartBtn');
  if(rb)rb.addEventListener('click',()=>{voiceState.index=0;voiceResumeMap[v.id]=0;rb.remove();voiceAskCurrentItem();});
  voiceAskCurrentItem();
}
function stopVoiceInventory(){
  if(voiceState){
    try{voiceState.recognition.abort();}catch(e){}
    speechSynthesis.cancel();
    // Mémorise la position pour reprendre au même endroit au prochain lancement sur ce véhicule.
    if(voiceState.index<voiceState.queue.length) voiceResumeMap[voiceState.v.id]=voiceState.index;
    else voiceResumeMap[voiceState.v.id]=0;
  }
  const ov=document.getElementById('voiceOverlay'); if(ov)ov.remove();
  voiceState=null; render();
  // Le flux micro (voiceMicStream) reste ouvert volontairement pour ne pas redemander l'autorisation

  // au prochain lancement du mode vocal dans cette même session de navigation.
}
let preferredVoiceURI=localStorage.getItem('sp-voice-uri')||'';
function pickBestFrenchVoice(){
  const voices=speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.toLowerCase().startsWith('fr'));
  if(!voices.length) return null;
  if(preferredVoiceURI){ const m=voices.find(v=>v.voiceURI===preferredVoiceURI); if(m) return m; }
  // Les voix réseau (Google, Microsoft Online...) sonnent nettement plus naturelles que les voix
  // système locales — on les préfère par défaut si aucun choix explicite n'a été fait.
  const network=voices.find(v=>!v.localService && /google|microsoft|online|natural/i.test(v.name));
  return network || voices.find(v=>!v.localService) || voices[0];
}
function speak(text,cb){
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text); u.lang='fr-FR'; u.rate=0.98; u.pitch=1.0;
  const voice=pickBestFrenchVoice(); if(voice) u.voice=voice;
  u.onend=()=>{if(cb)cb();};
  speechSynthesis.speak(u);
}
if('speechSynthesis' in window){
  speechSynthesis.onvoiceschanged=()=>{ /* voix chargées de façon asynchrone par le navigateur */ };
}
function openVoicePickerModal(){
  const voices=speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.toLowerCase().startsWith('fr'));
  const overlay=document.createElement('div'); overlay.className='overlay';
  overlay.innerHTML=`<div class="modal"><h3>🔊 Choisir la voix</h3>
    <p style="font-size:12px;color:var(--muted);">Les voix marquées "réseau" sont généralement bien plus naturelles que les voix système locales, mais nécessitent une connexion internet.</p>
    <div id="voiceList" style="max-height:280px;overflow-y:auto;margin:10px 0;"></div>
    <div class="modal-actions"><button class="btn ghost" id="voiceTestBtn">🔈 Tester</button><button class="btn primary" id="voicePickerClose">Fermer</button></div></div>`;
  document.body.appendChild(overlay);
  const listEl=overlay.querySelector('#voiceList');
  if(!voices.length){
    listEl.innerHTML='<p style="font-size:12.5px;color:var(--muted);">Aucune voix française détectée sur cet appareil. Réessaie dans quelques secondes (chargement asynchrone), ou vérifie les paramètres vocaux du système.</p>';
  } else {
    listEl.innerHTML=voices.map(v=>`<label style="display:flex;gap:8px;align-items:center;padding:6px 0;font-size:12.5px;cursor:pointer;">
      <input type="radio" name="voicePick" value="${escapeHtml(v.voiceURI)}" ${(preferredVoiceURI?preferredVoiceURI===v.voiceURI:v===pickBestFrenchVoice())?'checked':''}>
      ${escapeHtml(v.name)} ${!v.localService?'<span class="tag" style="background:var(--green);color:#fff;">réseau</span>':'<span class="tag">local</span>'}
    </label>`).join('');
  }
  overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.remove();});

    if(checked){ preferredVoiceURI=checked.value; localStorage.setItem('sp-voice-uri',preferredVoiceURI); }
    speak('Bonjour, ceci est un test de la voix sélectionnée pour l\'inventaire vocal.');
  });
  listEl.addEventListener('change',e=>{
    if(e.target.name==='voicePick'){ preferredVoiceURI=e.target.value; localStorage.setItem('sp-voice-uri',preferredVoiceURI); }
  });
}
function listenOnce(onResult){
  const mic=document.getElementById('voiceMic'); if(mic)mic.classList.add('listening');
  const rec=voiceState.recognition;
  let settled=false;
  const finish=(val)=>{ if(settled)return; settled=true; if(mic)mic.classList.remove('listening'); onResult(val); };
  rec.onresult=(e)=>{const txt=e.results[0][0].transcript.toLowerCase().trim(); finish(txt);};
  rec.onerror=()=>{ finish(''); };
  rec.onend=()=>{ if(mic)mic.classList.remove('listening'); };
  const tryStart=(retried)=>{
    try{ rec.start(); }
    catch(err){
      // La reconnaissance précédente n'a pas fini de se fermer : on retente une fois après une courte pause
      // au lieu de considérer silencieusement que rien n'a été dit.
      if(!retried) setTimeout(()=>tryStart(true),300);
      else finish('');
    }
  };
  tryStart(false);
}function voiceAskCurrentItem(){
  if(!voiceState)return;
  const{queue,index}=voiceState;
  if(index>=queue.length){
    document.getElementById('voiceItemText').textContent='Inventaire terminé.';
    document.getElementById('voiceHint').textContent='';
    document.getElementById('voiceProgress').textContent=queue.length+' / '+queue.length;
    voiceResumeMap[voiceState.v.id]=0;
    speak('Inventaire terminé pour '+spellOut(voiceState.v.name)+'.',()=>{setTimeout(stopVoiceInventory,1800);});
    return;
  }
  const item=queue[index];
  document.getElementById('voiceItemText').textContent=item.label+(item.qty?' (qté '+item.qty+')':'');
  document.getElementById('voiceProgress').textContent=(index+1)+' / '+queue.length;
  document.getElementById('voiceHint').textContent = item.type==='lock'
    ? 'Réponses possibles : Oui (= '+item.lockLabel+') · Manquant · Périmé · H.S.'
    : 'Réponses possibles : Oui (conforme) · Manquant · Périmé · H.S.';
  let phrase=spellOut(item.label)+'.';
  if(item.comment) phrase+=' Commentaire existant : '+item.comment+'.';
  speak(phrase,()=>listenOnce(txt=>voiceHandleAnswer(txt)));
}
function resetVoiceRecognition(){
  // Recrée l'objet de reconnaissance vocale : après plusieurs échecs, l'instance peut rester
  // bloquée dans un état incohérent côté navigateur — repartir d'un objet neuf débloque la situation
  // au lieu de laisser le mode vocal tourner en boucle sans jamais réussir à écouter.
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  try{ voiceState.recognition.abort(); }catch(e){}
  voiceState.recognition=new SR();
  voiceState.recognition.lang='fr-FR'; voiceState.recognition.continuous=false; voiceState.recognition.interimResults=false;
}
async function voiceHandleAnswer(txt){
  if(!voiceState)return;
  const item=voiceState.queue[voiceState.index];
  const v=voiceState.v;
  const answer=classifyAnswer(txt);
  if(!answer){
    voiceState.failCount=(voiceState.failCount||0)+1;
    if(voiceState.failCount>=2){
      voiceState.failCount=0;
      resetVoiceRecognition();
      speak('Je relance le micro. Répète : conforme, manquant, périmé, ou H.S.',()=>listenOnce(t=>voiceHandleAnswer(t)));
    } else {
      speak('Je n\'ai pas compris.',()=>listenOnce(t=>voiceHandleAnswer(t)));
    }
    return;
  }
  voiceState.failCount=0;
  let needsComment=false;
  if(item.type==='lock'){
    const{a}=findArt(v,item.empId+':'+item.artId);
    if(answer==='ok'){ a.locked=true; a.lastCheck=todayStr(); a.checkedBy=currentCheckerLabel('Vocal'); }
    else{ a.locked=false; addComment(a,ANSWER_LABEL[answer]); needsComment=true; }
  } else {
    const{a}=findArt(v,item.empId+':'+item.artId);
    a.status=answer; a.lastCheck=todayStr(); a.checkedBy=currentCheckerLabel('Vocal');
    if(answer==='manquant'||answer==='perime'){ if(!a.qtyMissing) a.qtyMissing=a.qty; } else { a.qtyMissing=0; }
    needsComment = (answer==='manquant'||answer==='perime'||answer==='hs');
  }
  await saveState();
  if(needsComment){
    speak('Voulez-vous ajouter un commentaire ?',()=>listenOnce(t=>voiceHandleCommentChoice(t)));
  } else {
    voiceState.index++; voiceAskCurrentItem();
  }
}
function voiceHandleCommentChoice(txt){
  if(!voiceState)return;
  const n=normalizeTxt(txt);
  const yes=/\b(oui|ok)\b/.test(n);
  if(yes){
    speak('Dictez votre commentaire.',()=>listenOnce(t=>voiceHandleCommentText(t)));
  } else {
    voiceState.index++; voiceAskCurrentItem();
  }
}
async function voiceHandleCommentText(txt,retryCount){
  if(!voiceState)return;
  retryCount=retryCount||0;
  if(!txt||!txt.trim()){
    if(retryCount>=2){
      speak('Je n\'ai toujours pas entendu, on continue sans commentaire.',()=>{voiceState.index++; voiceAskCurrentItem();});
      return;
    }
    speak('Je n\'ai rien entendu, redis ton commentaire.',()=>listenOnce(t=>voiceHandleCommentText(t,retryCount+1)));
    return;
  }
  const item=voiceState.queue[voiceState.index];
  const v=voiceState.v;
  const{a}=findArt(v,item.empId+':'+item.artId);
  addComment(a,txt);
  await saveState();
  speak('Commentaire enregistré.',()=>{voiceState.index++; voiceAskCurrentItem();});
}

/* ---------- Retour d'intervention (déclaration rapide sans refaire tout l'inventaire) ---------- */
function flattenVehicleItems(v){
  const list=[];
  v.emplacements.forEach(emp=>emp.articles.forEach(a=>{
    if(a.sousArticles&&a.sousArticles.length){
      a.sousArticles.forEach(s=>list.push({empId:emp.id,artId:a.id,subId:s.id,label:emp.name+' — '+a.name+' > '+s.name,qty:s.qty}));
    } else {
      list.push({empId:emp.id,artId:a.id,subId:null,label:emp.name+' — '+a.name,qty:a.qty});
    }
  }));
  return list;
}

      const row=cb.closest('.article-row');
      const sel=row.querySelector('[data-int-status]');
      const hosp=row.querySelector('[data-int-hospital]');
      if(cb.checked){ selected[k]=sel.value; sel.disabled=false; hosp.disabled=false; }
      else { delete selected[k]; sel.disabled=true; hosp.disabled=true; hosp.checked=false; delete leftAtHospital[k]; updateHospitalBlockVisibility(); }
    }));
    document.querySelectorAll('[data-int-status]').forEach(sel=>sel.addEventListener('change',()=>{
      selected[sel.dataset.intStatus]=sel.value;
    }));
    document.querySelectorAll('[data-int-hospital]').forEach(cb=>cb.addEventListener('change',()=>{
      leftAtHospital[cb.dataset.intHospital]=cb.checked; updateHospitalBlockVisibility();
    }));
  }
  bindRows();
  updateHospitalBlockVisibility();
  document.getElementById('intSearch').addEventListener('input',e=>{
    document.getElementById('intList').innerHTML=renderRows(e.target.value); bindRows();
  });
  document.getElementById('intHospitalSelect').addEventListener('change',e=>{
    document.getElementById('intHospitalNew').style.display=e.target.value==='__new__'?'inline-block':'none';
  });
  document.getElementById('intServiceSelect').addEventListener('change',e=>{
    document.getElementById('intServiceNew').style.display=e.target.value==='__new__'?'inline-block':'none';
  });
  document.getElementById('intSave').addEventListener('click',async()=>{
    const keys=Object.keys(selected);
    if(!keys.length){ overlay.remove(); return; }
    let hospitalNote='';
    const anyLeft=keys.some(k=>leftAtHospital[k]);
    if(anyLeft){
      let hosp=document.getElementById('intHospitalSelect').value;
      if(hosp==='__new__'){ hosp=document.getElementById('intHospitalNew').value.trim(); if(hosp && !state.hospitals.includes(hosp)) state.hospitals.push(hosp); }
      let svc=document.getElementById('intServiceSelect').value;
      if(svc==='__new__'){ svc=document.getElementById('intServiceNew').value.trim(); if(svc && !state.hospitalServices.includes(svc)) state.hospitalServices.push(svc); }
      if(hosp) hospitalNote='Resté à '+hosp+(svc?' ('+svc+')':'');
    }
    keys.forEach(k=>{
      const[empId,artId,subId]=k.split(':');
      const{a}=findArt(v,empId+':'+artId);
      const target=subId?a.sousArticles.find(s=>s.id===subId):a;
      target.status=selected[k];
      target.qtyMissing=target.qty;
      target.lastCheck=todayStr();
      target.checkedBy=currentCheckerLabel();
      // La mention hôpital ne s'applique QUE si cette ligne précise a été cochée "resté à l'hôpital" —
      // les autres items signalés (perdu, cassé, utilisé...) restent avec une note générique.
      const note='Retour intervention'+(leftAtHospital[k]&&hospitalNote?' — '+hospitalNote:'');
      addComment(target,note);
      if(leftAtHospital[k]){
        let hosp=document.getElementById('intHospitalSelect').value; if(hosp==='__new__') hosp=document.getElementById('intHospitalNew').value.trim();
        let svc=document.getElementById('intServiceSelect').value; if(svc==='__new__') svc=document.getElementById('intServiceNew').value.trim();
        state.hospitalTracking.push({id:uid('ht'),itemLabel:target.name,vehicleId:v.id,vehicleName:v.name,
          hospital:hosp,service:svc,dateLeft:todayStr(),returned:false,dateReturned:''});
      }
    });
    await saveState(); overlay.remove(); render();
    alert(keys.length+' item(s) signalé(s).');
  });
}

/* ---------- Export ---------- */
function downloadFile(filename,content,mime){
  const blob=new Blob([content],{type:mime}); const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}
function exportJson(v){downloadFile(`inventaire_${v.name.replace(/\s+/g,'_')}.json`,JSON.stringify(v,null,2),'application/json');}
function xmlEsc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;');}
function exportAxis(v){
  const headers=['Engin','CIS','Emplacement','Article','Qté article','Lot article','N° inventaire article','Péremption article','Sous-article','Qté sous-article','Lot sous-article','N° inventaire sous-article','Péremption sous-article'];
  let rows=[];
  rows.push('<Row>'+headers.map(h=>`<Cell ss:StyleID="sHeader"><Data ss:Type="String">${xmlEsc(h)}</Data></Cell>`).join('')+'</Row>');
  const cellS=v=>`<Cell ss:StyleID="sText"><Data ss:Type="String">${xmlEsc(v)}</Data></Cell>`;
  const cellN=v=>`<Cell ss:StyleID="sInt"><Data ss:Type="Number">${v||0}</Data></Cell>`;
  v.emplacements.forEach(emp=>{
    emp.articles.forEach(a=>{
      if(a.sousArticles&&a.sousArticles.length){
        a.sousArticles.forEach(s=>{
          rows.push('<Row>'+cellS(v.name)+cellS(v.cis)+cellS(emp.name)+cellS(a.name)+cellN(a.qty)+cellS(a.lot)+cellS(a.invNum)+cellS(a.expiry||'—')+cellS(s.name)+cellN(s.qty)+cellS(s.lot)+cellS(s.invNum)+cellS(s.expiry||'—')+'</Row>');
        });
      } else {
        rows.push('<Row>'+cellS(v.name)+cellS(v.cis)+cellS(emp.name)+cellS(a.name)+cellN(a.qty)+cellS(a.lot)+cellS(a.invNum)+cellS(a.expiry||'—')+cellS('')+cellN(0)+cellS('')+cellS('')+cellS('')+'</Row>');
      }
    });
  });
  const xml=`<?xml version="1.0" encoding="UTF-8"?>
<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet" xmlns:html="http://www.w3.org/TR/REC-html40">
<Styles><Style ss:ID="sHeader"><Font ss:Bold="1"/><Interior ss:Color="#DCE6F1" ss:Pattern="Solid"/></Style><Style ss:ID="sText"/><Style ss:ID="sInt"><NumberFormat ss:Format="0"/></Style></Styles>
<Worksheet ss:Name="${xmlEsc(v.name.slice(0,31))}"><Table>
${rows.join('\n')}
</Table></Worksheet></Workbook>`;
  downloadFile(`Export_${v.name.replace(/\s+/g,'_')}.xls`,xml,'application/vnd.ms-excel');
}

/* ---------- Import ---------- */
function openImportModal(){
  const overlay=document.createElement('div'); overlay.className='overlay';
  overlay.innerHTML=`<div class="modal"><h3>Importer un inventaire</h3>
    <div class="import-drop">Sélectionne un export Axis-SP (.xls) ou une sauvegarde JSON de cette application.</div>
    <div class="modal-actions"><button class="btn ghost" id="impCancel">Annuler</button><button class="btn primary" id="impChoose">Choisir un fichier</button></div></div>`;
  document.body.appendChild(overlay);
  document.getElementById('impCancel').addEventListener('click',()=>overlay.remove());
  overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.remove();});
  document.getElementById('impChoose').addEventListener('click',()=>{overlay.remove();fileInput.click();});
}
fileInput.addEventListener('change',async(e)=>{
  const file=e.target.files[0]; if(!file)return;
  const text=await file.text();
  try{
    if(text.trim().startsWith('{')){
      const v=JSON.parse(text);
      v.id=uid('v'); ensureVehicleShape(v); state.vehicles.push(v); await saveState(); render();
      alert('Véhicule "'+v.name+'" importé (JSON).');
    } else {
      const v=parseAxisXml(text);
      state.vehicles.push(v); await saveState(); render();
      alert('Véhicule "'+v.name+'" importé depuis Axis-SP ('+v.emplacements.length+' emplacement(s)).');
    }
  }catch(err){ alert('Import impossible : fichier non reconnu.'); console.error(err); }
  fileInput.value='';
});
function parseAxisXml(text){
  const doc=new DOMParser().parseFromString(text,'text/xml');
  const rows=Array.from(doc.getElementsByTagName('Row'));
  if(!rows.length) throw new Error('empty');
  const dataRows=rows.slice(1);
  const getCells=row=>Array.from(row.getElementsByTagName('Cell')).map(c=>{const d=c.getElementsByTagName('Data')[0];return d?d.textContent:'';});
  let vName='Engin importé', vCis='';
  const empMap=new Map();
  dataRows.forEach(row=>{
    const c=getCells(row);
    const[engin,cis,empName,artName,artQty,artLot,artInv,artExp,subName,subQty,subLot,subInv,subExp]=c;
    if(!empName)return;
    vName=engin||vName; vCis=cis||vCis;
    if(!empMap.has(empName)) empMap.set(empName,{id:uid('e'),name:empName,photos:[],articles:[],_artIndex:new Map()});
    const emp=empMap.get(empName);
    let art;
    if(emp._artIndex.has(artName)){ art=emp._artIndex.get(artName); }
    else{
      art={id:uid('a'),name:artName,qty:parseInt(artQty)||0,lot:artLot||'',invNum:artInv||'',expiry:(artExp&&artExp!=='—')?artExp:'',locked:false,lockLabel:'Sac plombé',regType:'',regDueDate:'',status:'verifier',lastCheck:'',checkedBy:'',comments:[],qtyMissing:0,photos:[],sousArticles:[]};
      emp.articles.push(art); emp._artIndex.set(artName,art);
    }
    if(subName){
      art.sousArticles.push({id:uid('s'),name:subName,qty:parseInt(subQty)||0,lot:subLot||'',invNum:subInv||'',expiry:(subExp&&subExp!=='—')?subExp:'',status:'verifier',lastCheck:'',checkedBy:'',comments:[],qtyMissing:0});
    }
  });
  const emplacements=Array.from(empMap.values()).map(e=>{delete e._artIndex;return e;});
  return {id:uid('v'),name:vName,cis:vCis,invNumber:'',immat:'',amsec:false,techCheck:defaultTechCheck(),emplacements};
}

(function(){
  const el=document.getElementById('bigButtonsToggle');
  const apply=on=>{ document.body.classList.toggle('big-buttons',on); el.textContent=on?'🧤 Gros boutons ✓':'🧤 Gros boutons'; };
  apply(localStorage.getItem('sp-big-buttons')==='1');
  el.addEventListener('click',()=>{
    const on=!document.body.classList.contains('big-buttons');
    localStorage.setItem('sp-big-buttons',on?'1':'0');
    apply(on);
  });
})();
document.getElementById('appVersion').textContent='v'+APP_VERSION;
loadState();
