function listenOnce(onResult){
  const mic=document.getElementById('voiceMic'); if(mic)mic.classList.add('listening');
  const rec=voiceState.recognition;
  let settled=false;
  const finish=(val)=>{ if(settled)return; settled=true; if(mic)mic.classList.remove('listening'); onResult(val); };
  rec.onresult=(e)=>{const txt=e.results[0][0].transcript.toLowerCase().trim(); finish(txt);};
  rec.onerror=()=>{ finish(''); };
  rec.onend=()=>{ if(mic)mic.classList.remove('listening'); };
  const tryStart=(retried)=>{
    try{ rec.start(); }
    catch(err){
      // La reconnaissance précédente n'a pas fini de se fermer : on retente une fois après une courte pause
      // au lieu de considérer silencieusement que rien n'a été dit.
      if(!retried) setTimeout(()=>tryStart(true),300);
      else finish('');
    }
  };
  tryStart(false);
}function voiceAskCurrentItem(){
  if(!voiceState)return;
  const{queue,index}=voiceState;
  if(index>=queue.length){
    document.getElementById('voiceItemText').textContent='Inventaire terminé.';
    document.getElementById('voiceHint').textContent='';
    document.getElementById('voiceProgress').textContent=queue.length+' / '+queue.length;
    voiceResumeMap[voiceState.v.id]=0;
    speak('Inventaire terminé pour '+spellOut(voiceState.v.name)+'.',()=>{setTimeout(stopVoiceInventory,1800);});
    return;
  }
  const item=queue[index];
  document.getElementById('voiceItemText').textContent=item.label+(item.qty?' (qté '+item.qty+')':'');
  document.getElementById('voiceProgress').textContent=(index+1)+' / '+queue.length;
  document.getElementById('voiceHint').textContent = item.type==='lock'
    ? 'Réponses possibles : Oui (= '+item.lockLabel+') · Manquant · Périmé · H.S.'
    : 'Réponses possibles : Oui (conforme) · Manquant · Périmé · H.S.';
  let phrase=spellOut(item.label)+'.';
  if(item.comment) phrase+=' Commentaire existant : '+item.comment+'.';
  speak(phrase,()=>listenOnce(txt=>voiceHandleAnswer(txt)));
}
function resetVoiceRecognition(){
  // Recrée l'objet de reconnaissance vocale : après plusieurs échecs, l'instance peut rester
  // bloquée dans un état incohérent côté navigateur — repartir d'un objet neuf débloque la situation
  // au lieu de laisser le mode vocal tourner en boucle sans jamais réussir à écouter.
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  try{ voiceState.recognition.abort(); }catch(e){}
  voiceState.recognition=new SR();
  voiceState.recognition.lang='fr-FR'; voiceState.recognition.continuous=false; voiceState.recognition.interimResults=false;
}
async function voiceHandleAnswer(txt){
  if(!voiceState)return;
  const item=voiceState.queue[voiceState.index];
  const v=voiceState.v;
  const answer=classifyAnswer(txt);
  if(!answer){
    voiceState.failCount=(voiceState.failCount||0)+1;
    if(voiceState.failCount>=2){
      voiceState.failCount=0;
      resetVoiceRecognition();
      speak('Je relance le micro. Répète : conforme, manquant, périmé, ou H.S.',()=>listenOnce(t=>voiceHandleAnswer(t)));
    } else {
      speak('Je n\'ai pas compris.',()=>listenOnce(t=>voiceHandleAnswer(t)));
    }
    return;
  }
  voiceState.failCount=0;
  let needsComment=false;
  if(item.type==='lock'){
    const{a}=findArt(v,item.empId+':'+item.artId);
    if(answer==='ok'){ a.locked=true; a.lastCheck=todayStr(); a.checkedBy=currentCheckerLabel('Vocal'); }
    else{ a.locked=false; addComment(a,ANSWER_LABEL[answer]); needsComment=true; }
  } else {
    const{a}=findArt(v,item.empId+':'+item.artId);
    a.status=answer; a.lastCheck=todayStr(); a.checkedBy=currentCheckerLabel('Vocal');
    if(answer==='manquant'||answer==='perime'){ if(!a.qtyMissing) a.qtyMissing=a.qty; } else { a.qtyMissing=0; }
    needsComment = (answer==='manquant'||answer==='perime'||answer==='hs');
  }
  await saveState();
  render(); // met à jour l'écran de vérification en direct, visible sous l'overlay vocal transparent
  if(needsComment){
    speak('Voulez-vous ajouter un commentaire ?',()=>listenOnce(t=>voiceHandleCommentChoice(t)));
  } else {
    voiceState.index++; voiceAskCurrentItem();
  }
}
function voiceHandleCommentChoice(txt){
  if(!voiceState)return;
  const n=normalizeTxt(txt);
  const yes=/\b(oui|ok)\b/.test(n);
  if(yes){
    speak('Dictez votre commentaire.',()=>listenOnce(t=>voiceHandleCommentText(t)));
  } else {
    voiceState.index++; voiceAskCurrentItem();
  }
}
async function voiceHandleCommentText(txt,retryCount){
  if(!voiceState)return;
  retryCount=retryCount||0;
  if(!txt||!txt.trim()){
    if(retryCount>=2){
      speak('Je n\'ai toujours pas entendu, on continue sans commentaire.',()=>{voiceState.index++; voiceAskCurrentItem();});
      return;
    }
    speak('Je n\'ai rien entendu, redis ton commentaire.',()=>listenOnce(t=>voiceHandleCommentText(t,retryCount+1)));
    return;
  }
  const item=voiceState.queue[voiceState.index];
  const v=voiceState.v;
  const{a}=findArt(v,item.empId+':'+item.artId);
  addComment(a,txt);
  await saveState();
  render();
  speak('Commentaire enregistré.',()=>{voiceState.index++; voiceAskCurrentItem();});
}

function flattenVehicleItems(v){
  const list=[];
  v.emplacements.forEach(emp=>emp.articles.forEach(a=>{
    if(a.sousArticles&&a.sousArticles.length){
      a.sousArticles.forEach(s=>list.push({empId:emp.id,artId:a.id,subId:s.id,label:emp.name+' — '+a.name+' > '+s.name,qty:s.qty}));
    } else {
      list.push({empId:emp.id,artId:a.id,subId:null,label:emp.name+' — '+a.name,qty:a.qty});
    }
  }));
  return list;
}

function downloadFile(filename,content,mime){
  const blob=new Blob([content],{type:mime}); const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

  const xml=`<?xml version="1.0" encoding="UTF-8"?>

${rows.join('\n')}
</Table></Worksheet></Workbook>`;
  downloadFile(`Export_${v.name.replace(/\s+/g,'_')}.xls`,xml,'application/vnd.ms-excel');
}

/* ---------- Import ---------- */
function openImportModal(){
  const overlay=document.createElement('div'); overlay.className='overlay';
  overlay.innerHTML=`<div class="modal"><h3>Importer un inventaire</h3>
    <div class="import-drop">Sélectionne un export Axis-SP (.xls) ou une sauvegarde JSON de cette application.</div>
    <div class="modal-actions"><button class="btn ghost" id="impCancel">Annuler</button><button class="btn primary" id="impChoose">Choisir un fichier</button></div></div>`;
  document.body.appendChild(overlay);
  document.getElementById('impCancel').addEventListener('click',()=>overlay.remove());
  overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.remove();});
  document.getElementById('impChoose').addEventListener('click',()=>{overlay.remove();fileInput.click();});
}
fileInput.addEventListener('change',async(e)=>{
  const file=e.target.files[0]; if(!file)return;
  const text=await file.text();
  try{
    if(text.trim().startsWith('{')){
      const v=JSON.parse(text);
      v.id=uid('v'); ensureVehicleShape(v); state.vehicles.push(v); render(); saveState();
      alert('Véhicule "'+v.name+'" importé (JSON).');
    } else {
      const v=parseAxisXml(text);
      state.vehicles.push(v); render(); saveState();
      alert('Véhicule "'+v.name+'" importé depuis Axis-SP ('+v.emplacements.length+' emplacement(s)).');
    }
  }catch(err){ alert('Import impossible : fichier non reconnu.'); console.error(err); }
  fileInput.value='';
});
function parseAxisXml(text){
  const doc=new DOMParser().parseFromString(text,'text/xml');
  const rows=Array.from(doc.getElementsByTagName('Row'));
  if(!rows.length) throw new Error('empty');
  const dataRows=rows.slice(1);
  const getCells=row=>Array.from(row.getElementsByTagName('Cell')).map(c=>{const d=c.getElementsByTagName('Data')[0];return d?d.textContent:'';});
  let vName='Engin importé', vCis='';
  const empMap=new Map();
  dataRows.forEach(row=>{
    const c=getCells(row);
    const[engin,cis,empName,artName,artQty,artLot,artInv,artExp,subName,subQty,subLot,subInv,subExp]=c;
    if(!empName)return;
    vName=engin||vName; vCis=cis||vCis;
    if(!empMap.has(empName)) empMap.set(empName,{id:uid('e'),name:empName,photos:[],articles:[],_artIndex:new Map()});
    const emp=empMap.get(empName);
    let art;
    if(emp._artIndex.has(artName)){ art=emp._artIndex.get(artName); }
    else{
      art={id:uid('a'),name:artName,qty:parseInt(artQty)||0,lot:artLot||'',invNum:artInv||'',expiry:(artExp&&artExp!=='—')?artExp:'',locked:false,lockLabel:'Sac plombé',regType:'',regDueDate:'',status:'verifier',lastCheck:'',checkedBy:'',comments:[],qtyMissing:0,photos:[],sousArticles:[]};
      emp.articles.push(art); emp._artIndex.set(artName,art);
    }
    if(subName){
      art.sousArticles.push({id:uid('s'),name:subName,qty:parseInt(subQty)||0,lot:subLot||'',invNum:subInv||'',expiry:(subExp&&subExp!=='—')?subExp:'',status:'verifier',lastCheck:'',checkedBy:'',comments:[],qtyMissing:0});
    }
  });
  const emplacements=Array.from(empMap.values()).map(e=>{delete e._artIndex;return e;});
  return {id:uid('v'),name:vName,cis:vCis,invNumber:'',immat:'',amsec:false,techCheck:defaultTechCheck(),emplacements};
}

// Applique le réglage "Gros boutons" mémorisé au chargement — le bouton lui-même est maintenant
// dans le menu latéral (data-menu-action="bigbuttons"), qui gère le bascule et l'affichage du libellé.
document.body.classList.toggle('big-buttons', localStorage.getItem('sp-big-buttons')==='1');
document.getElementById('appVersion').textContent='v'+APP_VERSION;
loadState();
// Vérification périodique des nouvelles consignes pour déclencher une notification locale (voir
// pollConsignesForNotification) — sans cet intervalle, la fonction ne serait jamais appelée.
setInterval(pollConsignesForNotification,45000);
// Filet de sécurité : vérifie toutes les 5 minutes si une remise à zéro programmée (8h du matin pour
// les quotidiens, nouvelle semaine/mois pour les autres) doit s'appliquer — sans dépendre d'un
// rechargement de page qui peut ne jamais survenir si l'appareil reste ouvert toute la journée.
setInterval(()=>{ if(!loadFailed) checkAndApplyScheduledResets(false); },5*60*1000);
// Sur mobile, un onglet en veille/arrière-plan peut geler les setInterval — on rattrape donc aussi
// explicitement au retour au premier plan (déverrouillage du téléphone, retour sur l'appli).
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden && !loadFailed) checkAndApplyScheduledResets(false);
});
</script>
