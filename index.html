function renderReserve(cat,search,sort){
  const meta=RESERVE_CATS[cat]; if(!meta){currentView={type:'dashboard'};return render();}
  const allItems=state.reserves[cat]||[];
  const activeItems=allItems.filter(it=>!it.archived);
  const archivedItems=allItems.filter(it=>it.archived);
  const isBottleCat = cat==='oxygene'||cat==='ari';
  const vehicleIdx=isBottleCat?null:buildVehicleArticleIndex(); // pour "aussi présent sur X véhicule(s)"
  search=search||'';
  sort=sort||(isBottleCat?'location':'name_asc');
  let reservePage=1;

  const sortItems=(arr)=>{
    const out=arr.slice();
    switch(sort){
      case 'name_desc': out.sort((a,b)=>b.name.localeCompare(a.name,'fr')); break;
      case 'qtymin_asc': out.sort((a,b)=>(a.qtyMin||0)-(b.qtyMin||0)); break;
      case 'qtymin_desc': out.sort((a,b)=>(b.qtyMin||0)-(a.qtyMin||0)); break;
      case 'qty_asc': out.sort((a,b)=>(a.qty||0)-(b.qty||0)); break;
      case 'qty_desc': out.sort((a,b)=>(b.qty||0)-(a.qty||0)); break;
      case 'name_asc': default: out.sort((a,b)=>a.name.localeCompare(b.name,'fr')); break;
    }
    return out;
  };

  const buildListHtml=(filterText,sortVal)=>{
    const sn=normalizeTxt(filterText||'');
    let items=sn?activeItems.filter(it=>normalizeTxt(it.name).includes(sn)||normalizeTxt(it.numero||'').includes(sn)):activeItems.slice();
    sort=sortVal||sort;
    const bottleRowStyle=it=>{
      if(!isBottleCat) return '';
      const affected = it.currentVehicleLabel && it.qty===0;
      const empty = it.pressureBar!=='' && parseFloat(it.pressureBar)<=0;
      if(cat==='oxygene'){
        // Oxygène : la couleur reflète l'ÉTAT (pleine en stock / vide à retourner / affectée à un engin).
        if(affected) return 'border-left:5px solid #2c6fa8;background:#eaf3fb;';
        if(empty) return 'border-left:5px solid var(--red-dark);background:#fdecec;';
        return 'border-left:5px solid #2e8b57;background:#eefaf3;';
      }
      // ARI : la couleur reflète le TYPE de bouteille (contenance + pression nominale), pour repérer
      // d'un coup d'œil des bouteilles interchangeables. Un fond bleu se superpose si affectée à un engin.
      const key=(it.volumeL||'?')+'L-'+(it.nominalPressure||it.pressureBar||'?')+'bar';
      const palette=['#8e44ad','#16a085','#d35400','#2980b9','#c0392b','#27ae60','#e67e22','#5b6d84'];
      let h=0; for(let i=0;i<key.length;i++) h=(h*31+key.charCodeAt(i))>>>0;
      const c=palette[h%palette.length];
      return `border-left:5px solid ${c};${affected?'background:#eaf3fb;':''}`;
    };
    const renderRow=it=>{
      const isUnique = isBottleCat || it.trackMode==='unique';
      const low = !isUnique && it.qtyMin>0 && it.qty<it.qtyMin;
      const inRepair = it.location==='reparation';
      return `<div class="article-row" data-item="${it.id}" style="grid-template-columns:${isUnique?'1fr 130px 30px 30px':'1fr 70px 70px 30px 30px'};padding-left:8px;${bottleRowStyle(it)}">
        <div>
          <div class="article-name">${escapeHtml(it.name)} ${low?'<span class="reg-badge overdue">Sous seuil</span>':''}${isBottleCat&&it.volumeL?` <span class="tag">${escapeHtml(it.volumeL)} L</span>`:''}${isBottleCat&&it.pressureBar?` <span class="tag">${escapeHtml(it.pressureBar)} bar</span>`:''}${isBottleCat&&it.pressureBar!==''&&parseFloat(it.pressureBar)<=0?` <span class="reg-badge overdue">Vide — ${cat==='ari'?'à recharger sur place':'à retourner en pharmacie'}</span>`:''}${it.currentVehicleLabel&&it.qty===0?' <span class="tag" style="background:#2c6fa8;color:#fff;">Sur engin</span>':''}${inRepair?' <span class="reg-badge overdue">🔧 En réparation</span>':''}</div>
          ${cat==='ari'&&it.pressureBar!==''&&parseFloat(it.pressureBar)<=0?`<div class="field-inline" style="margin-top:6px;"><button class="btn small primary" data-refill-ari="${it.id}">✓ Bouteille rechargée (remettre à 300 bar)</button></div>`:''}
          ${cat==='oxygene'?`<div class="field-inline" style="margin-top:6px;"><button class="btn small ${it.pressureBar!==''&&parseFloat(it.pressureBar)<=0?'primary':'ghost'}" data-archive-o2="${it.id}">📤 Renvoyer vers la pharmacie départementale</button></div>`:''}
          ${renderCommentsBlock(it,'r:'+cat+':'+it.id)}
          ${it.currentVehicleLabel&&it.qty===0?`<div class="comment-text" style="background:#e8f0fb;border-color:#b8d0ef;color:var(--navy);"><b>📍 Sur :</b> ${escapeHtml(it.currentVehicleLabel)}</div>`:''}
          ${!isBottleCat&&!isUnique&&(vehicleIdx[normalizeTxt(it.name)]||[]).length?(()=>{
            const matches=vehicleIdx[normalizeTxt(it.name)];
            const totalOnVehicles=matches.reduce((s,m)=>s+(m.qty||0),0);
            return `<details style="margin:6px 0;">
              <summary style="cursor:pointer;font-size:11.5px;color:var(--navy);font-weight:600;">📍 Aussi présent sur ${matches.length} emplacement(s) véhicule (${totalOnVehicles} unité(s) au total) ▾</summary>
              <div style="margin-top:4px;padding-left:8px;border-left:2px solid var(--line);">${matches.map(m=>`<div class="article-sub">• ${escapeHtml(m.vehicle)} — ${escapeHtml(m.emp)} (qté ${m.qty})</div>`).join('')}</div>
            </details>`;
          })():''}
          <div class="field-inline">
            <label>N° (bouteille / série / lot)</label><input value="${escapeHtml(it.numero||'')}" style="width:150px;" placeholder="si applicable" data-set-r-numero="${it.id}">
            <button class="btn small ghost" data-scan-r="${it.id}">📷 Scanner</button>
            ${isBottleCat?`<label>Volume (L)</label><input type="number" min="0" step="0.5" value="${it.volumeL||''}" style="width:60px;" placeholder="ex: 5" data-set-r-volume="${it.id}">
            <label>Pression (bar)</label><input type="number" min="0" value="${it.pressureBar||''}" style="width:65px;" placeholder="ex: 200" data-set-r-pressure="${it.id}">`:''}
            <label>Péremption</label><input type="date" value="${it.expiry||''}" data-set-r-expiry="${it.id}">
            <button class="btn small ghost" data-add-r-comment="${it.id}">💬 Ajouter une note</button>
            ${cat!=='ari'?`<button class="btn small ghost" data-hospital-receive="${it.id}">🏥 Reçu d'un centre hospitalier</button>`:''}
            ${!inRepair?`<button class="btn small ghost" data-send-repair="${it.id}">🔧 Envoyer en réparation</button>`:''}
            <label>Catégorie</label>
            <select data-set-r-cat="${it.id}">${Object.keys(RESERVE_CATS).map(c=>`<option value="${c}" ${c===cat?'selected':''}>${RESERVE_CATS[c].icon} ${RESERVE_CATS[c].label}</option>`).join('')}</select>
            ${!isBottleCat?`<label>Suivi</label><select data-set-r-trackmode="${it.id}"><option value="stock" ${it.trackMode!=='unique'?'selected':''}>Par quantité (stock)</option><option value="unique" ${it.trackMode==='unique'?'selected':''}>Individuel (numéro unique)</option></select>`:''}
          </div>
        </div>
        ${inRepair
          ? `<div style="text-align:center;"><label style="font-size:10px;color:var(--muted);display:block;">Statut</label><span class="tag" style="background:var(--amber-dark);color:#fff;">En réparation</span><button class="btn small primary" style="margin-top:4px;" data-r-return-repair="${it.id}">✓ De retour</button></div>`
          : isUnique
          ? `<div style="text-align:center;"><label style="font-size:10px;color:var(--muted);display:block;">Disponibilité</label>
              ${it.qty>0
                ? '<span class="tag" style="background:var(--green);color:#fff;">En stock</span>'
                : '<span class="tag" style="background:var(--grey);color:#fff;">Montée / sortie</span>'}
              <button class="btn small ghost" style="margin-top:4px;" data-assign-bottle="${it.id}">${it.qty>0?'📍 Assigner à un véhicule':'✓ Marquer en stock'}</button>
            </div>`
          : `<div><label style="font-size:10px;color:var(--muted);display:block;">Stock</label><input type="number" min="0" value="${it.qty}" style="width:60px;" data-set-r-qty="${it.id}"></div>
        <div><label style="font-size:10px;color:var(--muted);display:block;">Seuil</label><input type="number" min="0" value="${it.qtyMin}" style="width:60px;" data-set-r-qtymin="${it.id}"></div>`}
        <button class="icon-btn" title="Dupliquer" data-r-dup="${it.id}">⧉</button>
        <button class="del-btn" data-r-del="${it.id}">✕</button>
      </div>`;
    };
    let h='';
    if(isBottleCat){
      h+= cat==='oxygene'
        ? `<div style="font-size:11px;color:var(--muted);margin-bottom:10px;">🎨 Couleur : <span style="color:#2e8b57;">■</span> pleine/en stock · <span style="color:var(--red-dark);">■</span> vide, à retourner · <span style="color:#2c6fa8;">■</span> affectée à un engin</div>`
        : `<div style="font-size:11px;color:var(--muted);margin-bottom:10px;">🎨 Couleur : une teinte par type de bouteille (contenance + pression nominale) · fond bleuté = affectée à un engin</div>`;
    }
    if(!items.length){ h+=`<p style="font-size:12.5px;color:var(--muted);padding:10px 0;">Aucune référence ne correspond à « ${escapeHtml(filterText)} ».</p>`; }
    if(isBottleCat && sort==='location' && !sn){
      // Regroupement par emplacement (stock / chaque véhicule / réparation), puis par contenance et pression nominale à l'intérieur de chaque groupe.
      const byBottleSort=(a,b)=> (parseFloat(a.volumeL)||0)-(parseFloat(b.volumeL)||0) || (parseFloat(a.pressureBar)||0)-(parseFloat(b.pressureBar)||0) || a.name.localeCompare(b.name,'fr');
      const groups={}; const order=[];
      const pushTo=(key,it)=>{ if(!groups[key]){groups[key]=[];order.push(key);} groups[key].push(it); };
      items.forEach(it=>{
        if(it.location==='reparation') pushTo('🔧 En réparation',it);
        else if(it.currentVehicleLabel && it.qty===0) pushTo('🚒 '+it.currentVehicleLabel.split(' — ')[0],it);
        else pushTo('📦 En stock (réserve)',it);
      });
      order.sort((a,b)=> a==='📦 En stock (réserve)'?-1: b==='📦 En stock (réserve)'?1: a==='🔧 En réparation'?1: b==='🔧 En réparation'?-1: a.localeCompare(b,'fr'));
      order.forEach(key=>{
        const grp=groups[key].sort(byBottleSort);
        h+=`<div style="font-size:11.5px;font-weight:700;color:var(--navy);text-transform:uppercase;margin:14px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line);">${key} (${grp.length})</div>`;
        grp.forEach(it=>{ h+=renderRow(it); });
      });
    } else {
      items=sortItems(items);
      const PAGE_SIZE=60;
      const pageItems=items.slice(0,reservePage*PAGE_SIZE);
      pageItems.forEach(it=>{ h+=renderRow(it); });
      if(items.length>pageItems.length){
        h+=`<button class="btn ghost" id="reserveShowMoreBtn" style="width:100%;margin-top:8px;">Afficher plus (${items.length-pageItems.length} restant(s) sur ${items.length})</button>`;
      }
    }
    if(isBottleCat){
      const defaultPressure = cat==='oxygene'?200:300;
      h+=`<div class="add-row"><input placeholder="Numéro de la bouteille (obligatoire)" id="newRNumero" style="width:200px;"><input type="number" placeholder="Volume (L)" step="0.5" style="width:100px;" id="newRVolume"><select id="newRPressure" style="width:120px;"><option value="200" ${defaultPressure===200?'selected':''}>200 bar</option><option value="300" ${defaultPressure===300?'selected':''}>300 bar</option></select><button class="btn small primary" data-add-r="${cat}">Ajouter la bouteille</button></div>
      <p style="font-size:11px;color:var(--muted);margin:6px 0 0;">Le nom est généré automatiquement : « Bouteille ${cat==='oxygene'?'Oxygène':'Air'} &lt;numéro&gt; ». Pression nominale de la bouteille — la pression réelle mesurée se renseigne ensuite sur l'engin.</p>`;
    } else {
      h+=`<div class="add-row"><input placeholder="Nom de l'article" id="newRName"><input type="number" placeholder="Stock" value="1" style="width:60px;" id="newRQty"><input type="number" placeholder="Seuil" value="0" style="width:60px;" id="newRMin"><select id="newRTrackMode"><option value="stock">Par quantité (stock)</option><option value="unique">Individuel (numéro unique)</option></select><button class="btn small primary" data-add-r="${cat}">Ajouter</button></div>
      <p style="font-size:11px;color:var(--muted);margin:6px 0 0;">"Individuel" pour un matériel avec numéro de série unique (groupe électrogène, désincarcérateur...) — une ligne = une unité, traçable. "Par quantité" pour du consommable interchangeable (tuyaux, lances...).</p>`;
    }
    return h;
  };

  const bindListEvents=()=>{
    const smb=document.getElementById('reserveShowMoreBtn');
    if(smb)smb.addEventListener('click',()=>{
      reservePage++;
      document.getElementById('reserveListContainer').innerHTML=buildListHtml(search,sort);
      bindListEvents();
    });
    app.querySelectorAll('[data-add-r]').forEach(el=>el.addEventListener('click',async()=>{
      if(isBottleCat){
        const numero=document.getElementById('newRNumero').value.trim(); if(!numero)return;
        const volumeL=document.getElementById('newRVolume').value;
        const pressureBar=document.getElementById('newRPressure').value;
        if(state.reserves[cat].some(it=>normalizeTxt(it.numero||'')===normalizeTxt(numero))){
          alert('Une bouteille avec ce numéro existe déjà dans cette réserve.'); return;
        }
        const name='Bouteille '+(cat==='oxygene'?'Oxygène':'Air')+' '+numero;
        state.reserves[cat].push({id:uid('r'),name,qty:1,qtyMin:0,expiry:'',comments:[],numero,volumeL,pressureBar});
      } else {
        const name=document.getElementById('newRName').value.trim(); if(!name)return;
        const qty=parseInt(document.getElementById('newRQty').value)||0;
        const qtyMin=parseInt(document.getElementById('newRMin').value)||0;
        const trackMode=document.getElementById('newRTrackMode').value;
        const nk=normalizeTxt(name);
        if(trackMode==='unique'){
          state.reserves[cat].push({id:uid('r'),name,qty:1,qtyMin:0,expiry:'',comments:[],numero:'',volumeL:'',pressureBar:'',trackMode:'unique',location:'stock'});
        } else {
          const existing=state.reserves[cat].find(it=>normalizeTxt(it.name)===nk && it.trackMode!=='unique');
          if(existing){

/* ---------- Détection et fusion de doublons dans les réserves ---------- */
function levenshtein(a,b){
  const m=a.length,n=b.length;
  if(!m)return n; if(!n)return m;
  let prev=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){
    const cur=[i];
    for(let j=1;j<=n;j++){
      cur[j]=a[i-1]===b[j-1]?prev[j-1]:1+Math.min(prev[j-1],prev[j],cur[j-1]);
    }
    prev=cur;
  }
  return prev[n];
}
function areSimilarNames(n1,n2){
  const a=normalizeTxt(n1),b=normalizeTxt(n2);
  if(!a||!b||a===b) return a===b && a!=='';
  if(a.length>=4 && b.length>=4 && (a.startsWith(b)||b.startsWith(a))) return true;
  const dist=levenshtein(a,b);
  const threshold=Math.max(2,Math.floor(0.25*Math.min(a.length,b.length)));
  return dist<=threshold;
}
function duplicateReserveItem(cat,itemId){
  const items=state.reserves[cat]||[];
  const it=items.find(x=>x.id===itemId); if(!it)return;
  const clone=JSON.parse(JSON.stringify(it));
  clone.id=uid('r');
  clone.name=it.name+' (copie)';
  clone.comments=[];
  clone.currentVehicleLabel='';
  if(it.numero){
    const newNum=prompt('Ce type d\'élément a un numéro unique ("'+it.numero+'"). Indique le numéro de la copie :','');
    clone.numero=newNum?newNum.trim():'';
    if(clone.numero && items.some(x=>x.numero && normalizeTxt(x.numero)===normalizeTxt(clone.numero))){
      alert('⚠ Attention : le numéro "'+clone.numero+'" est déjà utilisé par un autre élément de cette réserve. La copie est créée quand même — pense à corriger.');
    }
  }
  items.push(clone);
  saveState(); render();
}
function findDuplicateGroups(){
  const groups=[];
  Object.keys(RESERVE_CATS).forEach(cat=>{
    const items=state.reserves[cat]||[];
    const used=new Set();
    for(let i=0;i<items.length;i++){
      if(used.has(items[i].id))continue;
      const cluster=[items[i]];
      for(let j=i+1;j<items.length;j++){
        if(used.has(items[j].id))continue;
        if(areSimilarNames(items[i].name,items[j].name)){ cluster.push(items[j]); used.add(items[j].id); }
      }
      if(cluster.length>1){ used.add(items[i].id); groups.push({cat,items:cluster}); }
    }
  });
  return groups;
}
function openDuplicatesModal(){
  const groups=findDuplicateGroups();
  const ignored=new Set();
  const overlay=document.createElement('div'); overlay.className='overlay';
  const renderGroup=(g,gi)=>{
    if(ignored.has(gi)) return '';
    return `
      <div class="tech-block" style="padding:12px;margin-bottom:10px;" id="dupGroup_${gi}">
        <div style="font-size:11px;color:var(--muted);text-transform:uppercase;margin-bottom:6px;">${RESERVE_CATS[g.cat].label}</div>
        ${g.items.map((it,ii)=>`<div style="display:flex;gap:8px;align-items:center;padding:4px 0;font-size:12.5px;">
          <input type="checkbox" data-dup-include="${gi}_${ii}" checked>
          <input type="radio" name="dupKeep_${gi}" value="${ii}" ${ii===0?'checked':''} data-dup-keep="${gi}">
          <label style="flex:1;">${escapeHtml(it.name)} <span class="article-sub">(stock ${it.qty}${it.numero?', n° '+escapeHtml(it.numero):''})</span></label>
        </div>`).join('')}
        <p style="font-size:10.5px;color:var(--muted);margin:4px 0 8px;">Case à gauche = inclure dans la fusion. Bouton radio = quel nom garder (parmi les inclus).</p>
        <div style="display:flex;gap:8px;">
          <button class="btn small primary" data-dup-merge="${gi}">Fusionner les éléments cochés</button>
          <button class="btn small ghost" data-dup-ignore="${gi}">Ce ne sont pas des doublons — ignorer</button>
        </div>
      </div>`;
  };
  const renderAll=()=>groups.map((g,gi)=>renderGroup(g,gi)).join('') || '<p style="font-size:12.5px;color:var(--muted);">Aucun groupe restant.</p>';
  overlay.innerHTML=`<div class="modal wide"><h3>🔍 Doublons probables</h3>
    <p style="font-size:12px;color:var(--muted);">Regroupés par ressemblance de nom (ex: "compresse" / "compresses stériles" / "compresses"). Décoche ce qui n'est pas concerné, choisis le nom à garder, puis fusionne — ou ignore le groupe si ce ne sont pas de vrais doublons.</p>
    <div id="dupList" style="max-height:400px;overflow-y:auto;">${groups.length?renderAll():'<p style="font-size:12.5px;color:var(--muted);">Aucun doublon probable détecté dans les réserves.</p>'}</div>
    <div class="modal-actions"><button class="btn ghost" id="dupClose">Fermer</button></div></div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.remove();});
  document.getElementById('dupClose').addEventListener('click',()=>overlay.remove());
  function bindGroupButtons(){
    overlay.querySelectorAll('[data-dup-ignore]').forEach(btn=>btn.addEventListener('click',()=>{
      const gi=btn.dataset.dupIgnore; ignored.add(gi);
      const el=document.getElementById('dupGroup_'+gi); if(el) el.remove();
    }));
    overlay.querySelectorAll('[data-dup-merge]').forEach(btn=>btn.addEventListener('click',async()=>{
      const gi=btn.dataset.dupMerge;
      const g=groups[gi];
      const includeFlags=g.items.map((it,ii)=>document.querySelector(`[data-dup-include="${gi}_${ii}"]`).checked);
      const includedIdx=g.items.map((it,ii)=>ii).filter(ii=>includeFlags[ii]);
      if(includedIdx.length<2){ alert('Coche au moins deux éléments à fusionner.'); return; }
      const keepRadio=overlay.querySelector(`input[name="dupKeep_${gi}"]:checked`);
      const keepIdx=parseInt(keepRadio.value);
      if(!includeFlags[keepIdx]){ alert('L\'élément dont tu gardes le nom doit être coché.'); return; }
      const keep=g.items[keepIdx];
      let totalQty=0, maxMin=0;
      let mergedComments=keep.comments?keep.comments.slice():[];
      includedIdx.forEach(ii=>{
        const it=g.items[ii]; totalQty+=(it.qty||0); if((it.qtyMin||0)>maxMin) maxMin=it.qtyMin;
        if(it!==keep && it.comments && it.comments.length) mergedComments=mergedComments.concat(it.comments);
      });
      keep.qty=totalQty;
      keep.qtyMin=maxMin;
      keep.comments=mergedComments;
      const toRemove=includedIdx.filter(ii=>ii!==keepIdx).map(ii=>g.items[ii].id);
      state.reserves[g.cat]=state.reserves[g.cat].filter(it=>!toRemove.includes(it.id));
      await saveState();
      document.getElementById('dupGroup_'+gi).remove();
    }));
  }
  bindGroupButtons();
}

function syncBottleReserveLink(regType,oldNum,newNum,locationLabel){
  // Que le numéro soit saisi à la main OU choisi via "Piocher en réserve", on garde la réserve
  // synchronisée : l'ancien numéro redevient "en stock", le nouveau passe "monté" avec sa localisation.
  const cat = regType==='O2' ? 'oxygene' : regType==='ARI' ? 'ari' : null;
  if(!cat || !state.reserves[cat]) return;
  const on=normalizeTxt(oldNum||''), nn=normalizeTxt(newNum||'');
  if(on && on!==nn){
    const oldEntry=state.reserves[cat].find(x=>normalizeTxt(x.numero||'')===on);
    if(oldEntry){ oldEntry.qty=1; oldEntry.currentVehicleLabel=''; }
  }
  if(nn){
    const newEntry=state.reserves[cat].find(x=>normalizeTxt(x.numero||'')===nn);
    if(newEntry){ newEntry.qty=0; newEntry.currentVehicleLabel=locationLabel; }
  }
}
function findBestReserveCat(name){
  // Cherche d'abord une référence de réserve dont le nom correspond, dans toutes les catégories,
  // pour éviter de tomber par défaut sur une catégorie vide simplement parce que le type
  // de suivi réglementaire de l'article n'a pas été renseigné dans la config du véhicule.
  const n=normalizeTxt(name);
  let bestCat=null;
  Object.keys(RESERVE_CATS).forEach(cat=>{
    (state.reserves[cat]||[]).forEach(it=>{
      if(it.qty>0){
        const itn=normalizeTxt(it.name);
        if(itn===n || itn.includes(n) || n.includes(itn)){ if(!bestCat) bestCat=cat; }
      }
    });
  });
  return bestCat;
}
function isBottleCategory(cat){return cat==='oxygene'||cat==='ari';}
function maskDateInput(el){
  el.addEventListener('input',()=>{
    let digits=el.value.replace(/\D/g,'').slice(0,8);
    let out=digits;
    if(digits.length>4) out=digits.slice(0,2)+'/'+digits.slice(2,4)+'/'+digits.slice(4);
    else if(digits.length>2) out=digits.slice(0,2)+'/'+digits.slice(2);
    el.value=out;
  });
}
function frDateToIso(fr){
  const m=(fr||'').trim().match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  if(!m) return null;
  const[,d,mo,y]=m;
  const iso=`${y}-${mo}-${d}`;
  const dt=new Date(iso);
  if(isNaN(dt)||dt.getMonth()+1!=parseInt(mo)) return null;
  return iso;
}
function isoDateToFr(iso){ return iso?fmtDate(iso):''; }

function copyArticleToReserve(name,qty){
  // Copie un matériel d'un véhicule vers la réserve — évite de retaper une référence qui existe déjà
  // sur un engin mais pas encore en stock. Si un article du même nom existe déjà dans une réserve
  // (toutes catégories confondues), on l'incrémente au lieu de créer un doublon.
  const sn=normalizeTxt(name);
  for(const c of Object.keys(RESERVE_CATS)){
    const existing=(state.reserves[c]||[]).find(it=>normalizeTxt(it.name)===sn && it.trackMode!=='unique');
    if(existing){
      if(!confirm('« '+name+' » existe déjà dans la réserve "'+RESERVE_CATS[c].label+'" (stock actuel '+existing.qty+'). Ajouter '+qty+' au stock existant ?')) return;
      existing.qty=(existing.qty||0)+qty;
      addComment(existing,'+'+qty+' copié depuis un véhicule le '+fmtDate(todayStr()));
      saveState(); render();
      alert('Stock mis à jour : '+existing.qty+' au total.');
      return;
    }
  }
  const guessedCat=guessReserveCat({name})||'petit';
  if(!confirm('« '+name+' » n\'existe pas encore en réserve. Créer la référence dans "'+RESERVE_CATS[guessedCat].label+'" avec un stock de '+qty+' ?')) return;
  state.reserves[guessedCat]=state.reserves[guessedCat]||[];
  state.reserves[guessedCat].push({id:uid('r'),name,qty,qtyMin:0,expiry:'',comments:[],numero:'',volumeL:'',pressureBar:'',trackMode:'stock',archived:false,archivedDate:'',archivedNote:'',location:'stock',currentVehicleLabel:''});
  saveState(); render();
  alert('« '+name+' » ajouté à la réserve "'+RESERVE_CATS[guessedCat].label+'".');
}
function openReservePicker(v,empId,artId,subId){
  const{a,emp}=findArt(v,empId+':'+artId);
  const target=subId?a.sousArticles.find(s=>s.id===subId):a;
  const missing=target.qtyMissing||target.qty||1;
  let cat=findBestReserveCat(target.name)||(target.regType?guessReserveCat(target):guessReserveCat(a))||'all';
  const overlay=document.createElement('div'); overlay.className='overlay';
  const renderList=(c,filterText)=>{
    // "Toutes catégories" par défaut : évite qu'un élément bien en stock semble "introuvable" simplement
    // parce que la catégorie devinée automatiquement n'était pas la bonne.
    const cats = c==='all' ? Object.keys(RESERVE_CATS) : [c];
    let items=[];
    cats.forEach(cc=>{ (state.reserves[cc]||[]).filter(it=>it.qty>0 && !it.archived && it.location!=='reparation').forEach(it=>items.push({...it,_cat:cc})); });
    const sn=normalizeTxt(filterText||'');
    if(sn) items=items.filter(it=>normalizeTxt(it.name).includes(sn)||normalizeTxt(it.numero||'').includes(sn));
    if(!items.length) return '<p style="font-size:12px;color:var(--muted);">Aucun stock disponible'+(sn?' pour cette recherche':(c==='all'?' dans aucune réserve':' dans cette réserve'))+'.</p>';
    return items.map(it=>`<div class="article-row" style="grid-template-columns:1fr 60px;"><div>${escapeHtml(it.name)} <span class="article-sub">(${RESERVE_CATS[it._cat].label} · stock ${it.qty}${it.numero?' · n° '+escapeHtml(it.numero):''})</span></div><button class="btn small primary" data-pick-r="${it.id}" data-pick-r-cat="${it._cat}">Choisir</button></div>`).join('');
  };
  overlay.innerHTML=`<div class="modal wide"><h3>🔁 Remplacer depuis la réserve</h3>
    <p style="font-size:12.5px;color:var(--muted);">Item : <b>${escapeHtml(target.name)}</b> — quantité à remplacer : ${missing}</p>
    <div class="filters" style="margin-bottom:10px;" id="rPickCats"><div class="chip ${cat==='all'?'active':''}" data-cat="all">🔎 Toutes</div>${Object.keys(RESERVE_CATS).map(c=>`<div class="chip ${c===cat?'active':''}" data-cat="${c}">${RESERVE_CATS[c].icon} ${RESERVE_CATS[c].label}</div>`).join('')}</div>
    <div class="field"><input id="rPickSearch" placeholder="Rechercher par nom ou numéro de bouteille…"></div>
    <div id="rPickList">${renderList(cat,'')}</div>
    <div class="modal-actions"><button class="btn ghost" id="rPickClose">Annuler</button></div></div>`;
  document.body.appendChild(overlay);
  document.getElementById('rPickClose').addEventListener('click',()=>overlay.remove());
  overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.remove();});
  document.getElementById('rPickSearch').addEventListener('input',e=>{
    document.getElementById('rPickList').innerHTML=renderList(cat,e.target.value); bindPicks();
  });
  function finalizePick(it,extra){
    it.qty=Math.max(0,it.qty-missing);
    target.status='ok'; target.qtyMissing=0; target.lastCheck=todayStr(); target.checkedBy=currentCheckerLabel();
    if(isContainerArt(target)) target.locked=true; // conteneur : reverrouillé une fois remplacé
    addComment(target,'Remplacé depuis réserve « '+RESERVE_CATS[cat].label+' » : '+it.name+(extra||''));
    // Traçabilité : indique sur quel engin/emplacement/article se trouve désormais cette référence de réserve.
    it.currentVehicleLabel=v.name+' — '+emp.name+' — '+target.name;
    return saveState();
  }
  function returnOldBottleIfNeeded(){
    // ARI : la bouteille vidée reste au centre, rechargée sur le compresseur, et retourne en réserve.
    // O2 : la bouteille vidée part chez le fournisseur pharmacie et sort du stock local — on ne la remet pas.
    const oldNum=target.invNum, oldVol=target.volumeL;
    if(cat==='ari' && oldNum){
      let oldEntry=(state.reserves.ari||[]).find(x=>x.numero===oldNum);
      if(!oldEntry){
        oldEntry={id:uid('r'),name:'Bouteille Air '+oldNum,qty:0,qtyMin:0,expiry:'',comments:[],numero:oldNum,volumeL:oldVol||'',pressureBar:''};
        state.reserves.ari.push(oldEntry);
      }
      oldEntry.qty=1;
      oldEntry.pressureBar='0';
      addComment(oldEntry,'Retour vidage le '+fmtDate(todayStr())+' — à recharger (compresseur du centre)');
    }
  }
  function finalizePickBottle(it,label){
    returnOldBottleIfNeeded();
    return finalizePick(it,label);
  }
  function bindPicks(){
    overlay.querySelectorAll('[data-pick-r]').forEach(el=>el.addEventListener('click',()=>{
      cat=el.dataset.pickRCat||cat; // catégorie réelle de l'objet choisi (utile quand "Toutes" était affiché)
      const it=(state.reserves[cat]||[]).find(x=>x.id===el.dataset.pickR); if(!it)return;
      if(isBottleCategory(cat)){
        if(it.numero){
          // Bouteille précise cochée dans la réserve : on reprend directement ses infos, pas de saisie.
          const label=' (bouteille n° '+it.numero+')';
          const newInvNum=it.numero, newVol=it.volumeL||'', newPres=it.pressureBar||'';
          finalizePickBottle(it,label).then(()=>{
            target.invNum=newInvNum; target.volumeL=newVol; target.nominalPressure=newPres||target.nominalPressure; target.pressureBar='';
            saveState().then(()=>{overlay.remove();render();});
          });
        } else {
          const newNum=prompt('Numéro de la nouvelle bouteille installée (laisser vide si inconnu) :', target.invNum||'');
          if(newNum===null) return;
          const label=newNum.trim()?(' (bouteille n° '+newNum.trim()+')'):'';
          finalizePickBottle(it,label).then(()=>{
            if(newNum.trim()) target.invNum=newNum.trim();
            saveState().then(()=>{overlay.remove();render();});
          });
        }
      } else {
        // Le champ de date pertinent dépend du type d'item : les articles à suivi réglementaire (ex: péremption pharma)
        // utilisent regDueDate (c'est ce champ qui pilote le badge affiché), les autres utilisent expiry.
        const currentDate = target.regType ? target.regDueDate : target.expiry;
        openDateEntryModal('Nouvelle date de péremption pour « '+target.name+' »', currentDate, async(iso)=>{
          let extra='';
          if(iso){
            if(target.regType) target.regDueDate=iso; else target.expiry=iso;
            extra=' (péremption '+fmtDate(iso)+')';
          }
          await finalizePick(it,extra);
          overlay.remove(); render();
        });
      }
    }));
  }
  bindPicks();
  overlay.querySelectorAll('[data-cat]').forEach(el=>el.addEventListener('click',()=>{
    cat=el.dataset.cat;
    overlay.querySelectorAll('[data-cat]').forEach(c2=>c2.classList.toggle('active',c2.dataset.cat===cat));
    document.getElementById('rPickList').innerHTML=renderList(cat,document.getElementById('rPickSearch').value);
    bindPicks();
  }));
}

/* ---------- Récapitulatif journalier ---------- */
function renderDaily(dateStr){
  dateStr=dateStr||todayStr();
  let html=`<div class="back-link" id="backLink">← Retour au tableau de bord</div>
  <div class="detail-header">
    <div class="detail-title"><h2>📋 Récapitulatif</h2><div class="code">Un menu déroulant par véhicule — écarts et remplacements mis en évidence</div></div>
    <div class="detail-actions"><input type="date" id="dailyDatePicker" value="${dateStr}" style="padding:8px 10px;border:1px solid var(--line);border-radius:3px;"><button class="btn ghost small" id="printDailyBtn">🖨 Imprimer</button></div>
  </div>
  <div style="font-size:11px;color:var(--muted);margin:-6px 0 14px;">🟢 pastille = vérification engin faite · 🟠 = à faire aujourd'hui · 🔴 = en retard · ⚪ = non concernée — fond vert = matériel vérifié et validé sans écart · fond noir = véhicule en panne ou absent</div>`;

  state.vehicles.forEach(v=>{
    const closure=(v.checkHistory||[]).filter(h=>h.date===dateStr);
    const lastClosure=closure.length?closure[closure.length-1]:null;
    const techDone = v.techCheck && v.techCheck.lastCheck===dateStr;
    let changedLeaf=[]; let changedLock=[];
    // Si une clôture de ce jour a une photo figée, on l'utilise en priorité — fiable même après que
    // le véhicule ait été revérifié depuis (les champs lastCheck des articles sont alors déjà écrasés
    // par cette vérification plus récente et ne refléteraient plus l'état réel de CE jour-là).
    let anomalies, replaced;
    if(lastClosure && lastClosure.anomaliesSnapshot){
      anomalies=lastClosure.anomaliesSnapshot.map(a=>({emp:'',name:a.label,statusLabel:a.statusLabel,comment:''}));
      replaced=(lastClosure.replacedSnapshot||[]).map(label=>({emp:'',name:label,comment:'Remplacé depuis réserve'}));
    } else {
      v.emplacements.forEach(emp=>{
        emp.articles.forEach(a=>{
          const hasChildren=isContainerArt(a);
          if(hasChildren){
            if(a.lastCheck===dateStr) changedLock.push({emp:emp.name,name:a.name,locked:a.locked,comment:commentsTooltip(a),checkedBy:a.checkedBy,lockLabel:a.lockLabel});
          } else if(a.lastCheck===dateStr){
            changedLeaf.push({emp:emp.name,name:a.name,status:a.status,comment:commentsTooltip(a),checkedBy:a.checkedBy});
          }
          (a.sousArticles||[]).forEach(s=>{ if(s.lastCheck===dateStr) changedLeaf.push({emp:emp.name,name:a.name+' > '+s.name,status:s.status,comment:commentsTooltip(s),checkedBy:s.checkedBy}); });
        });
      });
      anomalies=[
        ...changedLeaf.filter(c=>c.status==='manquant'||c.status==='perime'||c.status==='hs'),
        ...changedLock.filter(c=>!c.locked)
      ];
      replaced=changedLeaf.filter(c=>c.status==='ok' && c.comment && c.comment.includes('Remplacé depuis réserve'));
    }
    // Séparé en deux : activité MATÉRIEL (clôture ou items touchés) et activité ENGIN (indépendante) —
    // pour ne jamais laisser croire que le matériel a été vérifié simplement parce que l'engin l'a été.
    const hasMaterialActivity = closure.length>0 || changedLeaf.length>0 || changedLock.length>0;
    const hasActivity = hasMaterialActivity || techDone;
    // "Aucun écart" n'est affiché que si la vérification a été réellement CLÔTURÉE ce jour-là —
    // pas simplement parce que quelques items ont été touchés sans anomalie (inventaire en cours).
    const noDiscrepancy = closure.length>0 && anomalies.length===0 && replaced.length===0;
    const touchedCount = changedLeaf.length + changedLock.length;

    let badges='';
    if(closure.length) badges+=`<span class="tag">${closure[closure.length-1].pct}% conforme</span>`;
    if(anomalies.length) badges+=`<span class="tag" style="background:var(--red-dark);color:#fff;">${anomalies.length} écart(s)</span>`;
    if(replaced.length) badges+=`<span class="tag" style="background:var(--green);color:#fff;">${replaced.length} remplacé(s)</span>`;
    if(noDiscrepancy) badges+=`<span class="tag" style="background:var(--green);color:#fff;">✓ Aucun écart (matériel)</span>`;
    else if(!hasMaterialActivity) badges+=`<span class="tag" style="background:var(--grey);color:#fff;">Matériel non vérifié</span>`;
    if(hasMaterialActivity){
      badges+= closure.length
        ? `<span class="tag" style="background:var(--navy-3);color:#fff;">🔒 Matériel clôturé</span>`
        : `<span class="tag" style="background:var(--steel);color:#fff;">🔓 Matériel en cours</span>`;
    }
    const tdue=techDueInfo(v);
    if(techDone){
      badges += techOverallOk(v)
        ? `<span class="tag" style="background:var(--green);color:#fff;">✓ Engin OK</span>`
        : `<span class="tag" style="background:var(--red-dark);color:#fff;">⚠ Engin — anomalie(s)</span>`;
    }
    else if(tdue.due) badges+=`<span class="tag" style="background:var(--red-dark);color:#fff;">🔧 Engin en retard</span>`;

    const unavailable = v.outOfService || (v.currentCis && v.currentCis!==v.cis);
    const validated = noDiscrepancy; // clôturé aujourd'hui, sans écart : vérifié ET validé
    const techDot={green:'#2e8b57',orange:'#f0a500',red:'#c8102e',grey:'#9aa5af'}[techScheduleColor(v)];
    const techDotLabel={green:'Vérification engin faite',orange:'Vérification engin à faire aujourd\'hui',red:'Vérification engin en retard',grey:'Vérification engin non concernée/à venir'}[techScheduleColor(v)];
    const rowStyle = unavailable
      ? 'padding:0;background:#1c1c1c;'
      : validated
      ? 'padding:0;background:#e8f5ec;border-left:4px solid var(--green);'
      : 'padding:0;';
    html+=`<details class="emp-block" style="${rowStyle}">
      <summary style="cursor:pointer;padding:12px 14px;background:${unavailable?'#1c1c1c':(validated?'#e8f5ec':'var(--paper)')};display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;font-family:var(--font-head);font-size:15px;color:${unavailable?'#e0e0e0':'var(--navy)'};">
        <span><span title="${techDotLabel}" style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${techDot};margin-right:6px;border:1px solid rgba(0,0,0,.2);"></span>${escapeHtml(v.name)}${unavailable?' <span class="tag" style="background:#555;color:#fff;">Indisponible</span>':''}</span><span style="display:flex;gap:6px;flex-wrap:wrap;">${badges}</span>
      </summary>
      <div class="emp-body">`;

    if(!hasActivity){
      html+=`<p style="font-size:12.5px;color:var(--muted);">Aucune vérification enregistrée pour cet engin le ${fmtDate(dateStr)}.</p>`;
    } else if(!hasMaterialActivity){
      html+=`<p style="font-size:12.5px;color:var(--muted);">Matériel non vérifié ce jour-là (seule la vérification engin a été faite — voir ci-dessous).</p>`;
    } else if(noDiscrepancy){
      html+=`<div class="comment-text" style="background:#e8f5ec;border-color:#b7dfc4;color:var(--green-dark);"><b>✅ Aucun écart constaté</b> — inventaire vérifié sans anomalie${closure.length?' ('+closure[closure.length-1].pct+'% conforme, par '+escapeHtml(closure[closure.length-1].checkedBy)+')':''}.</div>`;
    } else {
      if(!closure.length){
        html+=`<div class="comment-text" style="background:#eef4fb;border-color:#b8d0ef;color:var(--navy);"><b>🔓 Vérification en cours</b> — ${touchedCount} item(s) contrôlé(s) aujourd'hui, pas encore clôturée. Ce qui suit ne concerne que ce qui a été vérifié jusqu'ici, pas l'inventaire complet.</div>`;
      }
      if(anomalies.length){
        html+=`<div style="margin-top:4px;"><b style="font-size:12.5px;color:var(--red-dark);">⚠ Écarts constatés (${anomalies.length})</b><ul style="margin:4px 0 0;padding-left:18px;font-size:12px;">`;
        anomalies.forEach(c=>{
          const label = c.statusLabel || (c.status ? (STATUS[c.status]?STATUS[c.status].label:c.status) : ('Non '+(c.lockLabel||'complet').toLowerCase()));
          html+=`<li>${c.emp?escapeHtml(c.emp)+' — ':''}${escapeHtml(c.name)} : <b>${label}</b>${c.checkedBy?' ('+escapeHtml(c.checkedBy)+')':''}${c.comment?' — 💬 '+escapeHtml(c.comment):''}</li>`;
        });
        html+=`</ul></div>`;
      }
      if(replaced.length){
        html+=`<div style="margin-top:10px;"><b style="font-size:12.5px;color:var(--green-dark);">🔁 Remplacés depuis la réserve (${replaced.length})</b><ul style="margin:4px 0 0;padding-left:18px;font-size:12px;">`;
        replaced.forEach(c=>{
          html+=`<li>${c.emp?escapeHtml(c.emp)+' — ':''}${escapeHtml(c.name)}${c.checkedBy?' ('+escapeHtml(c.checkedBy)+')':''}${c.comment?' — 💬 '+escapeHtml(c.comment):''}</li>`;
        });
        html+=`</ul></div>`;
      }
    }
    if(closure.length){
      html+=`<p style="font-size:11.5px;color:var(--muted);">Clôturé par : <b>${escapeHtml(closure[closure.length-1].checkedBy)}</b> <button class="btn small ghost" data-add-checker-closure="${v.id}" style="margin-left:6px;">+ Ajouter un nom</button></p>`;
    }
    if(techDone){
      const techAnoms=techCheckAnomalies(v);
      html+=`<p style="font-size:12.5px;margin-top:10px;"><b>🔧 Vérification engin effectuée</b> — par ${escapeHtml(v.techCheck.verifiedBy||'Non renseigné')}${v.techCheck.commentaire?' — "'+escapeHtml(v.techCheck.commentaire)+'"':''} <button class="btn small ghost" data-add-checker-tech="${v.id}" style="margin-left:6px;">+ Ajouter un nom</button></p>`;
      if(techAnoms.length){
        html+=`<div class="comment-text" style="background:#fdecec;border-color:#f3b8b8;color:var(--red-dark);"><b>⚠ Point(s) signalé(s) sur l'engin :</b> ${techAnoms.map(escapeHtml).join(', ')} <button class="btn small primary" style="margin-left:6px;" data-goto-tech="${v.id}">🔧 Accéder à la vérification</button></div>`;
      }
    }
    html+=`<button class="btn ghost small" style="margin-top:10px;" data-view-full="${v.id}">Voir l'inventaire complet →</button>`;
    html+=`</div></details>`;
  });

  app.innerHTML=html;
  document.getElementById('backLink').addEventListener('click',()=>{currentView={type:'dashboard'};render();});
  document.getElementById('dailyDatePicker').addEventListener('change',e=>{currentView={type:'daily',date:e.target.value};render();});
  document.getElementById('printDailyBtn').addEventListener('click',()=>window.print());
  app.querySelectorAll('[data-view-full]').forEach(el=>el.addEventListener('click',()=>{currentView={type:'check',vehicleId:el.dataset.viewFull};render();}));
  app.querySelectorAll('[data-add-checker-closure]').forEach(el=>el.addEventListener('click',async()=>{
    const vh=state.vehicles.find(x=>x.id===el.dataset.addCheckerClosure); if(!vh)return;
    const name=prompt('Nom de l\'agent à ajouter à la vérification matériel de « '+vh.name+' » (déjà clôturée) :',''); if(!name||!name.trim())return;
    const hist=(vh.checkHistory||[]).filter(h=>h.date===dateStr);
    if(!hist.length)return;
    const last=hist[hist.length-1];
    last.checkedBy = last.checkedBy && last.checkedBy!=='Non renseigné' ? last.checkedBy+', '+name.trim() : name.trim();
    render(); saveState();
  }));
  app.querySelectorAll('[data-add-checker-tech]').forEach(el=>el.addEventListener('click',async()=>{
    const vh=state.vehicles.find(x=>x.id===el.dataset.addCheckerTech); if(!vh)return;
    const name=prompt('Nom de l\'agent à ajouter à la vérification engin de « '+vh.name+' » :',''); if(!name||!name.trim())return;
    const cur=vh.techCheck.verifiedBy;
    vh.techCheck.verifiedBy = cur && cur!=='Non renseigné' ? cur+', '+name.trim() : name.trim();
    render(); saveState();
  }));
  app.querySelectorAll('[data-goto-tech]').forEach(el=>el.addEventListener('click',()=>{
    currentView={type:'tech',vehicleId:el.dataset.gotoTech}; render();
  }));
}

/* ---------- Scan QR / code-barres (API native, si disponible) ---------- */
async function openBarcodeScanner(onResult){
  if(!('BarcodeDetector' in window)){
    alert('Le scan direct n\'est pas disponible sur ce navigateur (fonctionne sur Chrome Android à jour). Tu peux saisir le numéro manuellement.');
    return;
  }
  let stream;
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
  }catch(e){
    alert('Impossible d\'accéder à la caméra (autorisation refusée ou indisponible).');
    return;
  }
  const overlay=document.createElement('div'); overlay.className='voice-overlay'; overlay.id='scanOverlay';
  overlay.innerHTML=`<button class="voice-close" id="scanClose">✕</button>
    <div class="vname">Scanner un QR / code-barres</div>
    <video id="scanVideo" autoplay playsinline style="width:100%;max-width:420px;border-radius:8px;margin-top:14px;"></video>
    <div class="vhint" id="scanHint" style="margin-top:14px;">Cadre le code dans l'image…</div>`;
  document.body.appendChild(overlay);
  const video=document.getElementById('scanVideo');
  video.srcObject=stream;
  let stopped=false;
  const stopAll=()=>{
    stopped=true;
    stream.getTracks().forEach(t=>t.stop());
    const ov=document.getElementById('scanOverlay'); if(ov)ov.remove();
  };
  document.getElementById('scanClose').addEventListener('click',stopAll);
  let detector;
  try{
    detector=new window.BarcodeDetector({formats:['qr_code','code_128','ean_13','ean_8','code_39','codabar']});
  }catch(e){
    document.getElementById('scanHint').textContent='Formats non supportés sur ce navigateur.';
    return;
  }
  const scanLoop=async()=>{
    if(stopped)return;
    try{
      const codes=await detector.detect(video);
      if(codes && codes.length){
        const value=codes[0].rawValue;
        document.getElementById('scanHint').textContent='Détecté : '+value;
        setTimeout(()=>{ stopAll(); onResult(value); },400);
        return;
      }
    }catch(e){ /* frame pas encore prête, on continue */ }
    requestAnimationFrame(scanLoop);
  };
  video.addEventListener('loadedmetadata',()=>scanLoop());
}

/* ---------- Aide (tutoriel + FAQ) ---------- */
function renderHelp(tab){
  tab=tab||'tuto';
  let html=`<div class="back-link" id="backLink">← Retour au tableau de bord</div>
  <div class="detail-header"><div class="detail-title"><h2>❓ Aide</h2><div class="code">Tutoriel et questions fréquentes</div></div></div>
  <div class="mode-tabs">
    <div class="mode-tab ${tab==='tuto'?'active':''}" id="helpTabTuto">📖 Tutoriel</div>
    <div class="mode-tab ${tab==='faq'?'active':''}" id="helpTabFaq">💬 FAQ</div>
  </div>`;

  if(tab==='tuto'){
    html+=helpTutoContent();
  } else {
    html+=helpFaqContent();
  }

  app.innerHTML=html;
  document.getElementById('backLink').addEventListener('click',()=>{currentView={type:'dashboard'};render();});
  document.getElementById('helpTabTuto').addEventListener('click',()=>{currentView={type:'help',tab:'tuto'};render();});
  document.getElementById('helpTabFaq').addEventListener('click',()=>{currentView={type:'help',tab:'faq'};render();});
}
function helpSection(title,bodyHtml){
  return `<div class="tech-block"><h4>${title}</h4>${bodyHtml}</div>`;
}

function helpFaqContent(){
  const qa=[
    ['Pourquoi ça met du temps à s\'afficher après un clic ?','Les actions les plus fréquentes (cocher un statut, changer une quantité en réserve) s\'affichent maintenant immédiatement, la sauvegarde se fait ensuite en arrière-plan. Si un délai persiste ailleurs, c\'est le temps de connexion au serveur — regarde la pastille "💾 Enregistré" en haut : si elle passe en rouge "⚠ Non synchronisé", vérifie ta connexion internet.'],
    ['J\'ai oublié d\'indiquer qui vérifie, comment corriger après coup ?','Dans le récapitulatif du jour, un bouton "+ Ajouter un nom" apparaît à côté de "Clôturé par..." et de "Vérification engin effectuée — par...".'],
    ['Le mode vocal ne fonctionne pas sur mon téléphone, que faire ?','Vérifie que tu utilises bien Chrome ou Edge à jour (pas Firefox, qui ne le supporte pas). La reconnaissance vocale nécessite aussi une connexion internet. Si ça ne marche vraiment pas, les boutons manuels (OK/Manq./Périmé/H.S.) restent une solution fiable.'],
    ['Comment savoir si un véhicule a une vérification en retard ?','La carte du véhicule affiche "⏰ à vérifier" (matériel) ou "🔧 Vérification engin en retard" (engin). Le bandeau "📅 Cette semaine" en haut du tableau de bord regroupe aussi tout ce qui est en retard ou à prévoir sur la semaine (lundi à dimanche).'],
    ['Quelle différence entre "suivi individuel" et "par quantité" en réserve ?','"Par quantité" (stock) convient au consommable interchangeable (tuyaux, compresses...) — un seul nombre suffit. "Individuel" convient à ce qui a un numéro de série unique (bouteille, groupe électrogène...) — chaque unité est une ligne à part, traçable précisément.'],
    ['Que fait le bouton 📍 sur un article ?','Il signale à l\'administrateur que cet article n\'est pas catalogué au bon emplacement dans le véhicule. Ça apparaît en rouge dans la Configuration jusqu\'à ce que l\'admin corrige la structure et clique "✓ Corrigé".'],
    ['Un véhicule affiche "Lecture seule", pourquoi ?','Il est actuellement prêté à un autre centre — c\'est ce centre qui gère désormais ses vérifications. Le centre d\'origine garde une visibilité complète mais ne peut plus modifier tant que le prêt est en cours.'],
    ['J\'ai oublié le mot de passe administrateur, que faire ?','Il n\'y a pas de récupération automatique (le mot de passe n\'est jamais stocké en clair). Il faut qu\'un administrateur déjà connecté le change depuis "🔒 Sécurité" sur le tableau de bord.'],
    ['Comment fusionner deux références en double dans une réserve ?','Bouton "🔍 Détecter les doublons" sur le tableau de bord. Décoche les éléments à exclure, choisis lequel garder, "Fusionner ce groupe" additionne les stocks sur la référence conservée.'],
    ['Comment ajouter un nouveau centre pour les prêts ?','Directement depuis la fenêtre "🔄 Prêter" ou "🏠 Mon centre", option "+ Nouveau centre…".'],
    ['Mes modifications sont-elles visibles par toute l\'équipe immédiatement ?','Oui, la synchronisation est en temps réel entre tous les appareils connectés (via Firestore). Un simple rechargement de page suffit si un changement ne semble pas apparaître.'],
    ['Comment imprimer une check-list papier de secours ?','Bouton "🖨 Imprimer" dans la vérification d\'un véhicule ou dans le récapitulatif du jour — tous les menus se déplient automatiquement et seuls les éléments utiles à la lecture papier restent affichés.'],
    ['Comment sauvegarder mes données régulièrement ?','Deux filets : le bouton "💾" en haut de l\'écran télécharge une sauvegarde complète immédiate, et l\'appli enregistre en plus automatiquement une copie chaque jour (bouton "🗓", 30 derniers jours conservés, restauration possible à n\'importe quelle date).'],
    ['Je ne trouve plus les boutons Configurer, Dupliquer, + Véhicule…','Ils sont masqués par défaut pour éviter les fausses manipulations. Clique sur "🛠" en haut de l\'écran et saisis le mot de passe administrateur : ils apparaissent aussitôt.'],
    ['Pourquoi je dois saisir la pression réelle des bouteilles ?','Pour garantir un contrôle réel et pas une simple validation de routine. Tant que la pression mesurée n\'est pas renseignée, la bouteille ne peut pas être validée "OK". La case devient rouge si la pression est sous 90% de la pression nominale de la bouteille.'],
    ['Ma saisie de pression ne s\'enregistrait pas, c\'est corrigé ?','Oui. Le champ prend maintenant en compte chaque chiffre tapé sans attendre que tu sortes du champ, et le clavier numérique s\'affiche directement sur mobile. Plus besoin d\'utiliser les petites flèches.'],
    ['Une bouteille d\'oxygène part vide, que faire ?','Bouton "📤 Renvoyer vers la pharmacie départementale" sur sa ligne : elle sort du stock actif et bascule dans l\'archive, consultable via "📦 Renvoyées en pharmacie" (avec remise en stock possible à son retour).'],
    ['Comment retrouver dans quel véhicule est une bouteille ?','Sa ligne dans la réserve affiche "📍 Sur : véhicule — emplacement — article". Le tri par emplacement (par défaut) regroupe aussi toutes les bouteilles par véhicule. La recherche globale fonctionne également par numéro.'],
    ['Un agent peut-il réorganiser le matériel sans être administrateur ?','Oui, pendant une vérification : glisser-déposer un article, ou utiliser les flèches ◀▶. Utile pour que l\'ordre affiché corresponde au rangement réel de l\'engin.'],
    ['L\'appli me demande confirmation pour "recommencer une vérification", pourquoi ?','Parce que le véhicule a déjà été vérifié pour la période en cours. Accepter remet les éléments conformes à "à vérifier" (les anomalies restent). Annuler permet juste de consulter sans rien effacer.'],
    ['Le pourcentage du tableau de bord ne bouge pas pendant que je revérifie, est-ce normal ?','Oui. Il affiche le résultat de la dernière clôture officielle et ne se met à jour qu\'une fois ta nouvelle vérification clôturée — pour éviter d\'afficher un score chutant artificiellement pendant qu\'un contrôle est en cours.'],
  ];
  return `<div class="emp-block"><div class="emp-body">`+qa.map(([q,a])=>`
    <details style="border-bottom:1px solid var(--line);padding:10px 0;">
      <summary style="cursor:pointer;font-weight:700;font-size:13px;color:var(--navy);">${q}</summary>
      <p style="font-size:12.5px;color:var(--ink);margin:8px 0 0;line-height:1.6;">${a}</p>
    </details>`).join('')+`</div></div>`;
}
function renderHospitalTracking(){
  const active=state.hospitalTracking.filter(h=>!h.returned);
  const done=state.hospitalTracking.filter(h=>h.returned).slice(-30).reverse();
  let html=`<div class="back-link" id="backLink">← Retour au tableau de bord</div>
  <div class="detail-header"><div class="detail-title"><h2>🏥 Suivi matériel en centre hospitalier</h2><div class="code">${active.length} en attente de récupération</div></div></div>
  <div class="emp-block"><div class="emp-body">`;
  if(!active.length){ html+='<p style="font-size:12.5px;color:var(--muted);">Rien laissé en centre hospitalier actuellement.</p>'; }
  active.forEach(h=>{
    html+=`<div class="article-row" style="grid-template-columns:1fr 140px;">
      <div style="font-size:12.5px;">
        <b>${escapeHtml(h.itemLabel)}</b><br>
        <span class="article-sub">${escapeHtml(h.vehicleName)} → ${escapeHtml(h.hospital||'centre non précisé')}${h.service?' ('+escapeHtml(h.service)+')':''} · laissé le ${fmtDate(h.dateLeft)}</span>
      </div>
      <button class="btn small primary" data-hosp-return="${h.id}">✓ Récupéré</button>
    </div>`;
  });
  html+=`</div></div>`;
  if(done.length){
    html+=`<div class="dash-header" style="margin-top:20px;"><div><h2>Historique récent</h2></div></div><div class="emp-block"><div class="emp-body">`;
    done.forEach(h=>{
      html+=`<div style="font-size:12px;color:var(--muted);padding:6px 0;border-bottom:1px solid var(--line);">${escapeHtml(h.itemLabel)} — ${escapeHtml(h.vehicleName)} → ${escapeHtml(h.hospital||'')} — laissé ${fmtDate(h.dateLeft)}, récupéré ${fmtDate(h.dateReturned)}</div>`;
    });
    html+=`</div></div>`;
  }
  app.innerHTML=html;
  document.getElementById('backLink').addEventListener('click',()=>{currentView={type:'dashboard'};render();});
  app.querySelectorAll('[data-hosp-return]').forEach(el=>el.addEventListener('click',async()=>{
    const h=state.hospitalTracking.find(x=>x.id===el.dataset.hospReturn); if(!h)return;
    h.returned=true; h.dateReturned=todayStr();
    // Le retour se fait par défaut dans la réserve Matériel VSAV.
    const cat='vsav';
    state.reserves[cat]=state.reserves[cat]||[];
    const nk=normalizeTxt(h.itemLabel);
    const existing=state.reserves[cat].find(it=>normalizeTxt(it.name)===nk && it.trackMode!=='unique');
    if(existing){ existing.qty=(existing.qty||0)+1; }
    else{ state.reserves[cat].push({id:uid('r'),name:h.itemLabel,qty:1,qtyMin:0,expiry:'',

function openReturnFromRepairModal(r){
  if(r.sourceType==='reserve'){
    // Retour direct dans la même réserve d'origine, pas de choix à faire.
    finalizeRepairReturn(r,r.cat);
    return;
  }
  const guessed=findBestReserveCat(r.itemLabel)||'';
  const overlay=document.createElement('div'); overlay.className='overlay';
  overlay.innerHTML=`<div class="modal"><h3>✓ Retour de réparation</h3>
    <p style="font-size:12.5px;color:var(--muted);">Item : <b>${escapeHtml(r.itemLabel)}</b>${r.numero?' (n° '+escapeHtml(r.numero)+')':''} — provenait de : ${escapeHtml(r.sourceLabel)}</p>
    <p style="font-size:12px;color:var(--muted);">Le matériel qui revient de réparation retourne en réserve par défaut (pas directement sur le véhicule, au cas où il aurait déjà été remplacé entre-temps). Choisis la réserve qui doit l'accueillir :</p>
    <div class="field"><label>Réserve de destination</label><select id="retCat">${Object.keys(RESERVE_CATS).map(c=>`<option value="${c}" ${c===guessed?'selected':''}>${RESERVE_CATS[c].icon} ${RESERVE_CATS[c].label}</option>`).join('')}</select></div>
    <div class="modal-actions"><button class="btn ghost" id="retCancel">Annuler</button><button class="btn primary" id="retConfirm">Confirmer le retour</button></div></div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.remove();});
  document.getElementById('retCancel').addEventListener('click',()=>overlay.remove());
  document.getElementById('retConfirm').addEventListener('click',()=>{
    const cat=document.getElementById('retCat').value;
    overlay.remove();
    finalizeRepairReturn(r,cat);
  });
}
async function finalizeRepairReturn(r,cat){
  const applyReturn=async(controlDate)=>{
    if(r.sourceType==='reserve'){
      const it=(state.reserves[r.cat]||[]).find(x=>x.id===r.reserveItemId);
      if(it){
        it.location='stock';
        if(it.trackMode!=='unique') it.qty=(it.qty||0)+1;
        if(controlDate) it.expiry=controlDate;
      }
    } else {
      state.reserves[cat]=state.reserves[cat]||[];
      const isUnique=!!r.numero;
      if(isUnique){
        state.reserves[cat].push({id:uid('r'),name:r.itemLabel,qty:1,qtyMin:0,expiry:controlDate||'',
          comments:[{id:uid('cm'),text:'De retour de réparation le '+fmtDate(todayStr())+(r.sourceLabel?' (provenait de '+r.sourceLabel+')':''),date:todayStr()}],
          numero:r.numero,volumeL:'',pressureBar:'',trackMode:'unique',location:'stock'});
      } else {
        const nk=normalizeTxt(r.itemLabel);
        const existing=state.reserves[cat].find(it=>normalizeTxt(it.name)===nk && it.trackMode!=='unique');
        if(existing){
          existing.qty=(existing.qty||0)+1;
          if(controlDate) existing.expiry=controlDate;
        } else {
          state.reserves[cat].push({id:uid('r'),name:r.itemLabel,qty:1,qtyMin:0,expiry:controlDate||'',
            comments:[{id:uid('cm'),text:'De retour de réparation le '+fmtDate(todayStr()),date:todayStr()}],numero:'',volumeL:'',pressureBar:'',trackMode:'stock',location:'stock'});
        }
      }
    }
    r.returned=true; r.dateRetour=todayStr(); r.cat=cat;
    render(); saveState();
    alert('Marqué de retour'+(cat?' — ajouté à la réserve « '+RESERVE_CATS[cat].label+' ».':'.'));
  };
  // Bouteilles ARI : contrôle annuel — proposer de saisir la nouvelle date au retour.
  if(cat==='ari'){
    openDateEntryModal('Nouvelle date de contrôle annuel (bouteille ARI)',null,(iso)=>applyReturn(iso));
  } else {
    applyReturn(null);
  }
}

function openQuickAddArticleModal(v){
  const overlay=document.createElement('div'); overlay.className='overlay';
  overlay.innerHTML=`<div class="modal"><h3>➕ Ajouter un article</h3>
    <div class="field"><label>Emplacement</label><select id="qaEmp">${v.emplacements.map(e=>`<option value="${e.id}">${escapeHtml(e.name)}</option>`).join('')}</select></div>

    <div class="field"><label>Quantité</label><input type="number" min="1" value="1" id="qaQty"></div>
    <div class="field"><label>Suivi réglementaire</label><select id="qaReg">${Object.keys(REG_TYPES).map(k=>`<option value="${k}">${REG_TYPES[k]}</option>`).join('')}</select></div>
    <div class="modal-actions"><button class="btn ghost" id="qaCancel">Annuler</button><button class="btn primary" id="qaConfirm">Ajouter</button></div></div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.remove();});
  document.getElementById('qaCancel').addEventListener('click',()=>overlay.remove());
  setTimeout(()=>document.getElementById('qaName').focus(),50);
  document.getElementById('qaConfirm').addEventListener('click',async()=>{
    const empId=document.getElementById('qaEmp').value;
    const emp=v.emplacements.find(e=>e.id===empId); if(!emp)return;
    const name=document.getElementById('qaName').value.trim(); if(!name)return;
    const qty=parseInt(document.getElementById('qaQty').value)||1;
    const regType=document.getElementById('qaReg').value;
    emp.articles.push({id:uid('a'),name,qty,lot:'',invNum:'',expiry:'',locked:false,lockLabel:'Tiroir complet',regType,regDueDate:'',status:'verifier',lastCheck:'',checkedBy:'',comments:[],qtyMissing:0,photos:[],volumeL:'',pressureBar:'',isContainer:false,wrongLocation:false,sousArticles:[]});
    await saveState(); overlay.remove(); render();
  });
}

function bindArticleDragDrop(v){
  let draggedKey=null, draggedType=null;
  app.querySelectorAll('[data-art-drag]').forEach(row=>{
    row.addEventListener('dragstart',e=>{ draggedKey=row.dataset.artDrag; draggedType='art'; row.classList.add('dragging'); e.stopPropagation(); });
    row.addEventListener('dragend',()=>row.classList.remove('dragging'));
    row.addEventListener('dragover',e=>{ if(draggedType==='art'){ e.preventDefault(); row.classList.add('drag-over'); } });
    row.addEventListener('dragleave',()=>row.classList.remove('drag-over'));
    row.addEventListener('drop',async e=>{
      e.preventDefault(); e.stopPropagation(); row.classList.remove('drag-over');
      if(draggedType!=='art'||!draggedKey)return;
      const[fromEmpId,fromArtId]=draggedKey.split(':');
      const[toEmpId,toArtId]=row.dataset.artDrag.split(':');
      if(fromEmpId!==toEmpId||fromArtId===toArtId)return; // on ne réordonne qu'à l'intérieur d'un même emplacement
      const emp=v.emplacements.find(x=>x.id===fromEmpId); if(!emp)return;
      const fromIdx=emp.articles.findIndex(a=>a.id===fromArtId);
      const toIdx=emp.articles.findIndex(a=>a.id===toArtId);
      if(fromIdx<0||toIdx<0)return;
      const[moved]=emp.articles.splice(fromIdx,1);
      emp.articles.splice(toIdx,0,moved);
      render(); saveState();
    });
  });
  app.querySelectorAll('[data-sub-drag]').forEach(row=>{
    row.addEventListener('dragstart',e=>{ draggedKey=row.dataset.subDrag; draggedType='sub'; row.classList.add('dragging'); e.stopPropagation(); });
    row.addEventListener('dragend',()=>row.classList.remove('dragging'));
    row.addEventListener('dragover',e=>{ if(draggedType==='sub'){ e.preventDefault(); row.classList.add('drag-over'); } });
    row.addEventListener('dragleave',()=>row.classList.remove('drag-over'));
    row.addEventListener('drop',async e=>{
      e.preventDefault(); e.stopPropagation(); row.classList.remove('drag-over');
      if(draggedType!=='sub'||!draggedKey)return;
      const[fromEmpId,fromArtId,fromSubId]=draggedKey.split(':');
      const[toEmpId,toArtId,toSubId]=row.dataset.subDrag.split(':');
      if(fromEmpId!==toEmpId||fromArtId!==toArtId||fromSubId===toSubId)return; // seulement à l'intérieur du même article
      const{a}=findArt(v,fromEmpId+':'+fromArtId); if(!a)return;
      const fromIdx=a.sousArticles.findIndex(s=>s.id===fromSubId);
      const toIdx=a.sousArticles.findIndex(s=>s.id===toSubId);
      if(fromIdx<0||toIdx<0)return;
      const[moved]=a.sousArticles.splice(fromIdx,1);
      a.sousArticles.splice(toIdx,0,moved);
      render(); saveState();
    });
  });
}

function moveInArray(arr,id,dir){
  dir=dir||-1; const i=arr.findIndex(x=>x.id===id); if(i<0)return;
  const j=i+dir; if(j<0||j>=arr.length)return;
  const tmp=arr[i]; arr[i]=arr[j]; arr[j]=tmp;
}

function compressImage(file){
  return new Promise((resolve)=>{
    const img=new Image(); const reader=new FileReader();
    reader.onload=e=>{img.src=e.target.result;};
    img.onload=()=>{
      const maxW=500; const scale=Math.min(1,maxW/img.width);
      const canvas=document.createElement('canvas'); canvas.width=img.width*scale; canvas.height=img.height*scale;
      canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
      resolve(canvas.toDataURL('image/jpeg',0.6));
    };
    reader.readAsDataURL(file);
  });
}

function isFullyChecked(v){
  for(const emp of v.emplacements){
    for(const a of emp.articles){
      const hasChildren=isContainerArt(a);
      if(hasChildren){
        if(!a.locked){
          for(const s of a.sousArticles){ if(s.status==='verifier') return false; }
        }
      } else if(a.status==='verifier'){ return false; }
    }
  }
  return true;
}
function vehicleStatsDaily(v){
  let total=0,ok=0;
  v.emplacements.forEach(e=>{
    e.articles.forEach(a=>{
      if(!a.dailyCheck) return;
      articleAllStatuses(a).forEach(st=>{ total++; if(st==='ok') ok++; });
    });
  });
  const pct=total?Math.round((ok/total)*100):100;
  return {total,ok,pct};
}

async function closeVehicleCheck(v){
  const st=vehicleStats(v);
  v.checkHistory=v.checkHistory||[];
  // Photo figée à l'instant T : les statuts individuels (a.lastCheck, etc.) seront écrasés dès la
  // prochaine vérification, donc sans cette photo, consulter cette clôture plus tard dans le récap du
  // jour ou l'historique afficherait du vide. On capture ici ce qui compte : les écarts et les
  // remplacements du jour, indépendamment de ce qui se passera ensuite sur ce véhicule.
  const anomaliesSnapshot=buildAnomaliesList(v).map(x=>({label:x.label,statusLabel:x.statusLabel}));
  const replacedSnapshot=[];
  v.emplacements.forEach(emp=>{
    emp.articles.forEach(a=>{
      if(a.lastCheck===todayStr() && a.status==='ok' && (a.comments||[]).some(c=>c.text&&c.text.includes('Remplacé depuis réserve'))) replacedSnapshot.push(emp.name+' — '+a.name);
      (a.sousArticles||[]).forEach(s=>{
        if(s.lastCheck===todayStr() && s.status==='ok' && (s.comments||[]).some(c=>c.text&&c.text.includes('Remplacé depuis réserve'))) replacedSnapshot.push(emp.name+' — '+a.name+' > '+s.name);
      });
    });
  });
  v.checkHistory.push({date:todayStr(),pct:st.pct,overall:st.overall,checkedBy:currentCheckerLabel(),anomaliesSnapshot,replacedSnapshot});
  if(v.checkHistory.length>50) v.checkHistory=v.checkHistory.slice(-50);
  v.activeChecker=null; // l'engin n'est plus "en cours de vérification"
  await flushSave(); // clôture = synchronisation immédiate, pas d'attente
  // Le nom de l'agent est réinitialisé une fois la vérification clôturée, pour que le prochain contrôle
  // (souvent fait par quelqu'un d'autre) ne reste pas attribué par erreur à la personne précédente.
  checkerNames=[]; activeCheckContext=null; await saveCheckers(); updateCheckerPill();
  // Une fois clôturé : ne laisser ouverts que les emplacements avec anomalie. S'il n'y en a aucune
  // (tout est conforme), on garde tout affiché plutôt que de tout replier d'un coup — un écran qui
  // se vide brutalement donne l'impression fausse que les données ont été perdues/réinitialisées.
  const remaining=buildAnomaliesList(v);
  if(remaining.length) checkOpenEmps = new Set(remaining.map(x=>x.empId));
  return st;
}
async function restartFullCheck(v){
  v.emplacements.forEach(emp=>{
    emp.articles.forEach(a=>{
      a.status='verifier'; a.locked=false; a.lastCheck=''; a.checkedBy=''; a.qtyMissing=0;
      (a.sousArticles||[]).forEach(s=>{ s.status='verifier'; s.lastCheck=''; s.checkedBy=''; s.qtyMissing=0; });
    });
  });
  v.lastMaterialResetCycle=currentMaterialCycleKey(v); // évite qu'un contrôle automatique ne refasse la même chose juste après
  await flushSave(); render();
  alert('Inventaire réinitialisé — à refaire entièrement.');
}
async function closeDailyCheck(v){
  const st=vehicleStatsDaily(v);
  v.dailyCheckHistory=v.dailyCheckHistory||[];
  v.dailyCheckHistory.push({date:todayStr(),pct:st.pct,checkedBy:currentCheckerLabel()});
  if(v.dailyCheckHistory.length>50) v.dailyCheckHistory=v.dailyCheckHistory.slice(-50);
  await flushSave();
  checkerNames=[]; activeCheckContext=null; await saveCheckers(); updateCheckerPill();
  return st;
}
function maybeCollapseFinishedEmp(v,empId){
  // Repli automatique d'un emplacement dès que tout son contenu est contrôlé sans anomalie :
  // la liste raccourcit au fur et à mesure, on voit tout de suite ce qu'il reste à faire.
  if(!autoCollapseEnabled) return;
  const emp=v.emplacements.find(e=>e.id===empId); if(!emp||!emp.articles.length) return;
  const allDone=emp.articles.every(a=>{
    if(isContainerArt(a)) return a.locked || (a.sousArticles||[]).every(s=>s.status==='ok');
    return a.status==='ok';
  });
  if(allDone && checkOpenEmps.has(empId)){
    checkOpenEmps.delete(empId);
    render();
  }
}
function maybeOfferClosure(v){
  if(v.emplacements.some(e=>e.articles.length) && isFullyChecked(v)){
    setTimeout(()=>{
      if(confirm('Tous les items de « '+v.name+' » ont été vérifiés. Clôturer la vérification maintenant ?')){
        closeVehicleCheck(v).then(st=>{ render(); alert('Vérification clôturée pour aujourd\'hui ('+st.pct+'% conforme).'); });
      }
    },150);
  }
}
function buildAnomaliesList(v){
  const list=[];
  v.emplacements.forEach(emp=>{
    emp.articles.forEach(a=>{
      const hasChildren=isContainerArt(a);
      if(hasChildren){
        // Un conteneur non plombé n'est PAS en soi une anomalie — il sera soit replombé à la
        // vérification suivante, soit laissé "vérifié complètement" sous-article par sous-article.
        // Seuls les sous-articles réellement en anomalie (manquant/périmé/HS) sont listés ci-dessous.
        a.sousArticles.forEach(s=>{
          if(s.status==='manquant'||s.status==='perime'||s.status==='hs') list.push({empId:emp.id,artId:a.id,subId:s.id,label:emp.name+' — '+a.name+' > '+s.name,statusLabel:STATUS[s.status].label,type:'leaf'});
        });
      } else if(a.status==='manquant'||a.status==='perime'||a.status==='hs'){
        list.push({empId:emp.id,artId:a.id,subId:null,label:emp.name+' — '+a.name,statusLabel:STATUS[a.status].label,type:'leaf'});
      }
    });
  });
  return list;
}

      row.addEventListener('dragstart',e=>{ draggedKey=row.dataset.checkArtDrag; row.classList.add('dragging'); e.stopPropagation(); });

      row.addEventListener('dragover',e=>{ e.preventDefault(); row.classList.add('drag-over'); });
      row.addEventListener('dragleave',()=>row.classList.remove('drag-over'));
      row.addEventListener('drop',async e=>{
        e.preventDefault(); e.stopPropagation(); row.classList.remove('drag-over');
        if(!draggedKey)return;
        const[fromEmpId,fromArtId]=draggedKey.split(':');
        const[toEmpId,toArtId]=row.dataset.checkArtDrag.split(':');
        if(fromEmpId!==toEmpId||fromArtId===toArtId)return;

        if(fromIdx<0||toIdx<0)return;

    el.addEventListener('input',()=>{

  app.querySelectorAll('[data-pick-reserve-sub-any]').forEach(el=>el.addEventListener('click',()=>{
    const[empId,artId,subId]=el.dataset.pickReserveSubAny.split(':'); openReservePicker(v,empId,artId,subId);

  app.querySelectorAll('[data-pick-reserve-art-any]').forEach(el=>el.addEventListener('click',()=>{

  }));
  app.querySelectorAll('[data-set-check-o2pres]').forEach(el=>{
    // 'input' (et non 'change') : la valeur est prise en compte à chaque frappe, sans attendre la perte
    // de focus — sinon taper un chiffre puis toucher directement un bouton perdait la saisie.
    // Pas de render() ici : cela détruirait le champ en cours de saisie. L'affichage se rafraîchit
    // quand l'agent quitte le champ (blur).

      const{a}=findArt(v,el.dataset.setCheckO2pres); a.pressureBar=el.value; saveState();
    });

  });
  app.querySelectorAll('[data-comment-art]').forEach(el=>el.addEventListener('click',async(ev)=>{
    ev.stopPropagation();
    const{a}=findArt(v,el.dataset.commentArt);

    if(c!==null && c.trim()){addComment(a,c);render();saveState();}
  }));
  app.querySelectorAll('[data-comment-sub]').forEach(el=>el.addEventListener('click',async(ev)=>{
    ev.stopPropagation();
    const[empId,artId,subId]=el.dataset.commentSub.split(':'); const{a}=findArt(v,empId+':'+artId);
    const sub=a.sousArticles.find(s=>s.id===subId);
    const c=prompt('Nouveau commentaire pour "'+sub.name+'" :','');
    if(c!==null && c.trim()){addComment(sub,c);render();saveState();}
  }));
  app.querySelectorAll('[data-del-comment]').forEach(el=>el.addEventListener('click',async(ev)=>{
    ev.stopPropagation();
    const parts=el.dataset.delComment.split(':');

    if(parts[0]==='art'){ const{a}=findArt(v,parts[1]+':'+parts[2]); obj=a; }
    else if(parts[0]==='sub'){ const{a}=findArt(v,parts[1]+':'+parts[2]); obj=a.sousArticles.find(s=>s.id===parts[3]); }

    render(); saveState();

  app.querySelectorAll('[data-toggle-emp]').forEach(el=>el.addEventListener('click',()=>{

  }));
  app.querySelectorAll('[data-toggle-lock]').forEach(el=>el.addEventListener('click',()=>requireChecker({vehicleId:v.id,type:'material'},()=>{
    const[empId,artId]=el.dataset.toggleLock.split(':'); const{a}=findArt(v,empId+':'+artId);
    a.locked=!a.locked;
    if(a.locked){a.lastCheck=todayStr();a.checkedBy=currentCheckerLabel();}
    render(); maybeOfferClosure(v); saveState();
  })));
  app.querySelectorAll('[data-set-art-status]').forEach(el=>el.addEventListener('click',()=>requireChecker({vehicleId:v.id,type:'material'},()=>{
    const[empId,artId,status]=el.dataset.setArtStatus.split(':'); const{a}=findArt(v,empId+':'+artId);
    const isBottle=a.regType==='O2'||a.regType==='ARI';
    if(status==='ok' && isBottle && a.pressureBar===''){
      alert('Renseigne la pression réelle mesurée avant de valider cette bouteille comme conforme.');
      return;
    }
    a.status=status; a.lastCheck=todayStr(); a.checkedBy=currentCheckerLabel();
    const needsFullRender = (status==='manquant'||status==='perime'||status==='hs');
    if((status==='manquant'||status==='perime')&&!a.qtyMissing) a.qtyMissing=a.qty;
    if(status!=='manquant'&&status!=='perime') a.qtyMissing=0;
    // Statut simple "OK"/"à vérifier" : mise à jour ciblée (instantanée). Une anomalie fait apparaître
    // des blocs supplémentaires (qté manquante, boutons réserve/réparation) : là on reconstruit l'écran.
    markVehicleActive(v);

    if((status==='manquant'||status==='perime')&&!sub.qtyMissing) sub.qtyMissing=sub.qty;
    if(status!=='manquant'&&status!=='perime') sub.qtyMissing=0;

    });
  }));
}

/* ---------- VOICE MODE (inventaire vocal) ---------- */
function buildVoiceQueue(v){
  const queue=[];
  v.emplacements.forEach(emp=>{
    emp.articles.forEach(a=>{
      const hasChildren=isContainerArt(a);
      if(hasChildren){
        queue.push({type:'lock',empId:emp.id,artId:a.id,label:a.name,lockLabel:a.lockLabel||'complet',comment:commentsTooltip(a)});
      } else {
        queue.push({type:'art',empId:emp.id,artId:a.id,label:a.name,qty:a.qty,comment:commentsTooltip(a)});
      }
    });
  });
  return queue;
}
function normalizeTxt(s){return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();}
function buildVehicleArticleIndex(){
  // Index (une seule passe sur tout le parc) : nom normalisé → liste des emplacements véhicule où ce
  // matériel existe. Utilisé pour afficher dans la réserve "aussi présent sur X véhicule(s)" sans
  // rescanner tout le parc pour chaque ligne de réserve (coûteux avec beaucoup d'articles).
  const idx={};
  state.vehicles.forEach(v=>{
    (v.emplacements||[]).forEach(emp=>{
      (emp.articles||[]).forEach(a=>{
        const key=normalizeTxt(a.name);
        if(key){ (idx[key]=idx[key]||[]).push({vehicle:v.name,vehicleId:v.id,emp:emp.name,empId:emp.id,artId:a.id,subId:null,qty:a.qty,name:a.name}); }
        (a.sousArticles||[]).forEach(s=>{
          const key2=normalizeTxt(s.name);
          if(key2){ (idx[key2]=idx[key2]||[]).push({vehicle:v.name,vehicleId:v.id,emp:emp.name+' > '+a.name,empId:emp.id,artId:a.id,subId:s.id,qty:s.qty,name:s.name}); }
        });
      });
    });
  });
  return idx;
}
function classifyAnswer(txt){
  const n=normalizeTxt(txt);
  if(/\b(conforme|ok|present|oui|positif)\b/.test(n)) return 'ok';
  if(/\b(manquant|absent|non|negatif|manque)\b/.test(n)) return 'manquant';
  if(/\b(perime|perimee)\b/.test(n)) return 'perime';
  if(/\b(hs|hors\s?service)\b/.test(n)) return 'hs';
  return null;
}
const ANSWER_LABEL={ok:'Conforme',manquant:'Manquant',perime:'Périmé',hs:'H.S.'};
const LETTER_NAMES={A:'a',B:'bé',C:'cé',D:'dé',E:'e',F:'effe',G:'gé',H:'ache',I:'i',J:'ji',K:'ka',L:'elle',M:'emme',N:'enne',O:'o',P:'pé',Q:'ku',R:'erre',S:'esse',T:'té',U:'u',V:'vé',W:'double vé',X:'iks',Y:'i grec',Z:'zède'};
function spellOut(text){
  // épelle phonétiquement les majuscules isolées et sigles (L, M, ARI, VSAV...) sans utiliser de points,
  // car "M." "Dr." etc. sont lus comme des abréviations (Monsieur...) par la synthèse vocale française.
  return String(text).replace(/\b[A-Z]{1,6}\b/g, m=> m.split('').map(ch=>LETTER_NAMES[ch]||ch).join(' '));
}
let voiceState=null;
let voiceMicStream=null;
let voiceResumeMap={};
async function startVoiceInventory(v){
  requireChecker({vehicleId:v.id,type:'material'},()=>startVoiceInventoryReal(v));
}
async function startVoiceInventoryReal(v){
  if(!('speechSynthesis' in window)){alert('La synthèse vocale n\'est pas disponible sur ce navigateur. Utilise Chrome sur Android ou sur ordinateur.');return;}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){alert('La reconnaissance vocale n\'est pas disponible sur ce navigateur (nécessite Chrome + autorisation micro).');return;}
  const queue=buildVoiceQueue(v);
  if(!queue.length){alert('Aucun item à contrôler pour cet engin.');return;}
  let startIndex=voiceResumeMap[v.id]||0;
  if(startIndex>=queue.length) startIndex=0;
  voiceState={v,queue,index:startIndex,recognition:new SR()};
  voiceState.recognition.lang='fr-FR'; voiceState.recognition.continuous=false; voiceState.recognition.interimResults=false;
  const overlay=document.createElement('div'); overlay.className='voice-overlay'; overlay.id='voiceOverlay';
  overlay.innerHTML=`<button class="voice-close" id="voiceClose">✕</button>
    <div class="vname">${escapeHtml(v.name)} — Inventaire vocal</div>
    <div class="voice-mic" id="voiceMic">🎤</div>
    <div class="vitem" id="voiceItemText">Préparation…</div>
    <div class="vhint" id="voiceHint">Réponses possibles : Oui (conforme) · Manquant · Périmé · H.S.</div>
    <div class="voice-progress" id="voiceProgress"></div>
    ${startIndex>0?'<button class="btn ghost small" id="voiceRestartBtn" style="margin-top:14px;">🔁 Recommencer depuis le début</button>':''}`;
  document.body.appendChild(overlay);
  document.getElementById('voiceClose').addEventListener('click',stopVoiceInventory);
  const rb=document.getElementById('voiceRestartBtn');
  if(rb)rb.addEventListener('click',()=>{voiceState.index=0;voiceResumeMap[v.id]=0;rb.remove();voiceAskCurrentItem();});
  voiceAskCurrentItem();
}
function stopVoiceInventory(){
  if(voiceState){
    try{voiceState.recognition.abort();}catch(e){}
    speechSynthesis.cancel();
    // Mémorise la position pour reprendre au même endroit au prochain lancement sur ce véhicule.
    if(voiceState.index<voiceState.queue.length) voiceResumeMap[voiceState.v.id]=voiceState.index;
    else voiceResumeMap[voiceState.v.id]=0;
  }
  const ov=document.getElementById('voiceOverlay'); if(ov)ov.remove();
  voiceState=null; render();
  // Le flux micro (voiceMicStream) reste ouvert volontairement pour ne pas redemander l'autorisation

  // au prochain lancement du mode vocal dans cette même session de navigation.
}
let preferredVoiceURI=localStorage.getItem('sp-voice-uri')||'';
function pickBestFrenchVoice(){
  const voices=speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.toLowerCase().startsWith('fr'));
  if(!voices.length) return null;
  if(preferredVoiceURI){ const m=voices.find(v=>v.voiceURI===preferredVoiceURI); if(m) return m; }
  // Les voix réseau (Google, Microsoft Online...) sonnent nettement plus naturelles que les voix
  // système locales — on les préfère par défaut si aucun choix explicite n'a été fait.
  const network=voices.find(v=>!v.localService && /google|microsoft|online|natural/i.test(v.name));
  return network || voices.find(v=>!v.localService) || voices[0];
}
function speak(text,cb){
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text); u.lang='fr-FR'; u.rate=parseFloat(localStorage.getItem('sp-voice-rate')||'0.98'); u.pitch=1.0;
  const voice=pickBestFrenchVoice(); if(voice) u.voice=voice;
  u.onend=()=>{if(cb)cb();};
  speechSynthesis.speak(u);
}
